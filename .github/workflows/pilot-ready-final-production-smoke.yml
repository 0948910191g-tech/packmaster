name: PackMaster Final Pilot-ready Production Smoke

on:
  push:
    branches:
      - pilot-ready-final-production-smoke

permissions:
  contents: read

jobs:
  diagnose-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Probe production create path
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push({ message: error.message, stack: error.stack }));
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            await page.goto('https://0948910191g-tech.github.io/packmaster/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch), null, { timeout: 60000 });
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor({ timeout: 60000 });
            await page.waitForTimeout(1200);

            console.log('CHECKPOINT list');
            console.log(JSON.stringify(await page.evaluate(async () => ({ rows: await window.PackMasterBatch.listBatches(), dateType: typeof Date }))));

            console.log('CHECKPOINT createMeta');
            const metaProbe = await page.evaluate(() => {
              try {
                return { ok: true, meta: window.PackMasterBatch.createBatchMeta([], new Date('2026-08-08T12:00:00.000Z')) };
              } catch (error) {
                return { ok: false, name: error.name, message: error.message, stack: error.stack, dateType: typeof Date };
              }
            });
            console.log('CREATE_META=' + JSON.stringify(metaProbe, null, 2));
            if (!metaProbe.ok) throw new Error('createBatchMeta probe failed: ' + metaProbe.message);

            console.log('CHECKPOINT exact-button');
            const button = page.getByRole('button', { name: 'สร้าง Batch ใหม่', exact: true });
            console.log('BUTTON_COUNT=' + await button.count());
            await button.click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor({ timeout: 30000 });
            console.log('CHECKPOINT clicked');
            console.log('BATCHES=' + JSON.stringify(await page.evaluate(() => window.PackMasterBatch.listBatches())));
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors, null, 2));
            console.log('CONSOLE_ERRORS=' + JSON.stringify(consoleErrors, null, 2));
            if (pageErrors.length || consoleErrors.length) throw new Error('Unexpected browser errors after create');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
