name: PackMaster Production Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify pilot markers
        env:
          PROD_URL: https://0948910191g-tech.github.io/packmaster/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Production smoke attempt ${attempt}/18"
            html="$(curl -fsSL --max-time 20 "${PROD_URL}?smoke=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -Fq 'PackMaster Pilot' \
              && printf '%s' "$html" | grep -Fq './packmaster-storage-health.js' \
              && printf '%s' "$html" | grep -Fq './packmaster-diagnostics.js' \
              && printf '%s' "$html" | grep -Fq 'รีวิวและพิมพ์'; then
              echo "Production smoke passed"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose the expected PackMaster Pilot build within the retry window" >&2
          exit 1
