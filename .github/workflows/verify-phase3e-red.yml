name: Verify Phase 3E Storage RED

on:
  push:
    branches:
      - phase3e-pilot-hardening

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm storage cleanup is still RED
        run: |
          if node tests/packmaster-storage-health.test.mjs; then
            echo "Expected storage test to fail before cleanup implementation" >&2
            exit 1
          else
            echo "TDD RED confirmed: cleanupArchivedReprintImages is missing"
          fi
