name: Apply Review Thai Display Fix

on:
  push:
    branches:
      - fix/review-keyword-thai-cleanup
    paths:
      - scripts/apply-review-thai-display-fix.py
      - .github/workflows/apply-review-thai-display-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-keyword-thai-cleanup
          fetch-depth: 0
      - name: Apply guarded patch
        run: python scripts/apply-review-thai-display-fix.py
      - name: Verify scope
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only)" = "index.html"
      - name: Commit patched Review UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "fix: show repaired Thai text in Review UI"
          git push origin HEAD:fix/review-keyword-thai-cleanup
