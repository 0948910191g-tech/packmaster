name: Patch Keyword Safe Only

on:
  push:
    branches:
      - fix-keyword-assistant-safe-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-keyword-assistant-safe-only
      - name: Patch Quick Mapping safety integration once
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          if 'safeOnly: true' in text and 'Keyword แนะนำที่ผ่าน Safety Check' in text:
              print('Quick Mapping safety integration already present')
              raise SystemExit(0)
          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)
          old = "              maxSuggestions: 3\n            });"
          new = "              maxSuggestions: 3,\n              safeOnly: true,\n              matchRule: matchSkuRule,\n              matchNormalizer: normalizeMatchText\n            });"
          replace_once(old, new, 'safe-only generation')
          old = "        setQuickMapState({ open: true, row, keyword: seed, shortName: '', suggestions });"
          new = "        setQuickMapState({ open: true, row, sourceText: seed, keyword: seed, shortName: '', suggestions });"
          replace_once(old, new, 'preserve source identity')
          old = "        const saved = saveSkuRule({ keyword, shortName }, { successMessage: 'บันทึกชื่อภายในแล้ว — Review จะอัปเดตจากกฎเดียวกับคลังคำศัพท์' });"
          new = "        const batchItemTexts = orders.flatMap(order => (Array.isArray(order && order.parsedItems) ? order.parsedItems : []))\n          .map(item => String(item && item.text || '').trim())\n          .filter(Boolean);\n        const safety = keywordAssistantApi && typeof keywordAssistantApi.assessKeywordSafety === 'function'\n          ? keywordAssistantApi.assessKeywordSafety({\n              candidate: keyword,\n              sourceText: String(quickMapState.sourceText || ''),\n              existingRules: skuRules,\n              batchItemTexts,\n              matchRule: matchSkuRule,\n              matchNormalizer: normalizeMatchText\n            })\n          : { safe: false, reason: 'matcher-unavailable' };\n        if (!safety.safe) {\n          const safetyMessage = safety.reason === 'duplicate-keyword'\n            ? 'Keyword นี้มีอยู่แล้วในคลังคำศัพท์ — กรุณาเลือกคำที่เฉพาะกว่า'\n            : 'Keyword นี้ยังไม่ผ่าน Safety Check — อาจเปลี่ยนผลจับคู่ SKU อื่น กรุณาเลือกคำที่เฉพาะกว่า';\n          showToast(safetyMessage, 'error');\n          return;\n        }\n        const saved = saveSkuRule({ keyword, shortName }, { successMessage: 'บันทึกชื่อภายในแล้ว — Review จะอัปเดตจากกฎเดียวกับคลังคำศัพท์' });"
          replace_once(old, new, 'Quick Mapping save safety')
          old = "        const targetEditingId = options.editingId || null;\n        if (targetEditingId) {"
          new = "        const targetEditingId = options.editingId || null;\n        const duplicateKeywordRule = skuRules.find(rule =>\n          rule.id !== targetEditingId &&\n          normalizeMatchText(rule.keyword) === normalizeMatchText(cleanKeyword)\n        );\n        if (duplicateKeywordRule) {\n          showToast('Keyword นี้มีอยู่แล้วในคลังคำศัพท์', 'error');\n          return false;\n        }\n        if (targetEditingId) {"
          replace_once(old, new, 'exact duplicate rule guard')
          old = '<label className="pm-label mb-0">Keyword แนะนำ</label><span className="text-[10px] font-semibold text-slate-400">กดเลือกเอง • แก้ต่อได้</span>'
          new = '<label className="pm-label mb-0">Keyword แนะนำที่ผ่าน Safety Check</label><span className="text-[10px] font-semibold text-slate-400">ไม่ซ้ำ • ไม่เปลี่ยนเส้นทาง SKU อื่น</span>'
          replace_once(old, new, 'safe label')
          old = "                              {suggestion.confidence === 'recommended' ? <span className=\"shrink-0 rounded-full bg-emerald-50 border border-emerald-200 px-2 py-0.5 text-[9px] font-black text-emerald-700\">แนะนำ</span> : <span className=\"shrink-0 rounded-full bg-amber-50 border border-amber-200 px-2 py-0.5 text-[9px] font-black text-amber-700\">ตรวจเพิ่ม</span>}\n                            </div>\n                            {suggestion.confidence !== 'recommended' && <div className=\"mt-1 text-[10px] font-semibold text-amber-700\">คำนี้อาจซ้ำกับสินค้า/กฎอื่น กรุณาตรวจชื่อสินค้าก่อนเลือก</div>}"
          new = "                              {suggestion.confidence === 'recommended' && <span className=\"shrink-0 rounded-full bg-emerald-50 border border-emerald-200 px-2 py-0.5 text-[9px] font-black text-emerald-700\">ปลอดภัย</span>}\n                            </div>\n                            <div className=\"mt-1 text-[10px] font-semibold text-emerald-700\">ผ่าน Smart Matcher กับคลังและ Batch ปัจจุบัน</div>"
          replace_once(old, new, 'safe badge')
          old = 'ยังไม่มี Keyword สั้นที่ระบบแนะนำได้อย่างปลอดภัย — ใช้ชื่อเดิมหรือแก้ Keyword เอง'
          new = 'ไม่มี Keyword ที่ผ่าน Safety Check กับคลังและ Batch ปัจจุบัน — กรุณาใช้ Keyword ที่เฉพาะกว่านี้หรือเปิดคลังคำศัพท์'
          replace_once(old, new, 'empty safe state')
          path.write_text(text)
          PY
      - name: Verify focused tests
        run: |
          node --test tests/packmaster-keyword-assistant.test.mjs
          node --test tests/packmaster-keyword-assistant-ui.test.mjs
          git diff --check
      - name: Commit patch when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No index patch to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Integrate fail-closed Keyword safety"
          git push origin HEAD:fix-keyword-assistant-safe-only
