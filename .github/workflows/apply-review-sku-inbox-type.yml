name: Apply Review SKU Inbox Type Fix

on:
  push:
    branches:
      - frontend-usability-pilot-pass
    paths:
      - tools/fix-review-sku-inbox-type.py
      - .github/workflows/apply-review-sku-inbox-type.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-usability-pilot-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Review SKU Inbox type fix
        run: python3 tools/fix-review-sku-inbox-type.py
      - name: Run full regression suite
        run: |
          set -euo pipefail
          for test_file in tests/*.test.mjs; do node "$test_file"; done
      - name: Compile JSX
        run: |
          npm install --no-save --no-package-lock @babel/core @babel/cli @babel/preset-react
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script type="text/babel">') + len('<script type="text/babel">')
          end = html.index('</script>', start)
          Path('/tmp/review-sku-inbox.jsx').write_text(html[start:end], encoding='utf-8')
          PY
          npx babel /tmp/review-sku-inbox.jsx --presets @babel/preset-react --out-file /tmp/review-sku-inbox.js
      - name: Verify frozen scope
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- packmaster-batch.js packmaster-workspace.js packmaster-duplicate.js packmaster-exceptions.js packmaster-pilot-safety.js packmaster-archive.js packmaster-storage-health.js packmaster-diagnostics.js
          grep -Fq "(currentException.types||[]).some(type=>type==='REVIEW_SKU'||type==='UNMAPPED')" index.html
          grep -Fq 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -Fq 'MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
          git diff --check
      - name: Commit SKU Inbox type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: fix SKU Review inbox action type"
          git push origin HEAD:frontend-usability-pilot-pass
