name: Verify Pilot Hardening RED

on:
  push:
    branches:
      - phase3e-pilot-hardening

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm missing storage health implementation
        run: |
          if node tests/packmaster-storage-health.test.mjs; then exit 1; else echo "Storage RED confirmed"; fi
      - name: Confirm missing diagnostics implementation
        run: |
          if node tests/packmaster-diagnostics.test.mjs; then exit 1; else echo "Diagnostics RED confirmed"; fi
      - name: Confirm missing pilot-ready package
        run: |
          if node tests/packmaster-pilot-ready.test.mjs; then exit 1; else echo "Pilot-ready RED confirmed"; fi
