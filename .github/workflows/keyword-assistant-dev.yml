name: Keyword Assistant Dev

on:
  push:
    branches:
      - feature-keyword-assistant

permissions:
  contents: read

jobs:
  keyword-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run keyword assistant unit tests
        run: node --test tests/packmaster-keyword-assistant.test.mjs
      - name: Run keyword assistant UI contract
        run: node --test tests/packmaster-keyword-assistant-ui.test.mjs
