name: Smoke Test PackMaster Phase 2 Production

on:
  push:
    branches:
      - phase2-production-smoke

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production assets are live
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            https://0948910191g-tech.github.io/packmaster/ -o /tmp/production.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            https://0948910191g-tech.github.io/packmaster/packmaster-batch.js -o /tmp/packmaster-batch.js
          grep -F './packmaster-batch.js' /tmp/production.html
          grep -F 'สร้าง Batch ใหม่' /tmp/production.html
          grep -F 'packmaster-local-v1' /tmp/packmaster-batch.js
          grep -F 'for (let i = 0; i < MappedOrders.length; i++)' /tmp/production.html

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Exercise production Batch workflow in isolated Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            const errors = [];

            page.on('pageerror', error => errors.push(`pageerror: ${error}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });

            await page.goto('https://0948910191g-tech.github.io/packmaster/', {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch), null, { timeout: 60000 });
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor({ timeout: 60000 });

            let stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 0, 'isolated browser should start with no batches');

            await page.getByRole('button', { name: /สร้าง Batch/ }).first().click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor({ timeout: 30000 });
            const firstName = (await page.locator('h2').filter({ hasText: 'Batch #' }).first().textContent()).trim();
            assert.match(firstName, /Batch #001$/);

            stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 1, 'created batch must persist to production IndexedDB');
            assert.equal(stored[0].name, firstName);

            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor();
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch));
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor();
            await page.getByText(firstName, { exact: true }).waitFor();

            await page.getByRole('button', { name: /สร้าง Batch ใหม่/ }).click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const secondName = (await page.locator('h2').filter({ hasText: 'Batch #' }).first().textContent()).trim();
            assert.match(secondName, /Batch #002$/);
            assert.notEqual(secondName, firstName);

            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 2, 'two production batches must coexist');

            const newest = stored[0];
            await page.getByRole('button', { name: 'เปิดงาน' }).first().click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const openedName = (await page.locator('h2').filter({ hasText: 'Batch #' }).first().textContent()).trim();
            assert.equal(openedName, newest.name, 'switching batch must load selected batch only');

            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            page.once('dialog', dialog => dialog.accept());
            await page.locator('button[title="ลบ Batch"]').first().click();
            await page.waitForTimeout(400);
            stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 1, 'delete must remove only the selected batch');

            // Clean isolated test data before closing the context.
            await page.evaluate(async () => {
              const rows = await window.PackMasterBatch.listBatches();
              for (const row of rows) await window.PackMasterBatch.deleteBatch(row.id);
            });
            stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 0, 'production smoke test data should be cleaned up');

            if (errors.length) {
              throw new Error(`Production browser errors:\n${errors.join('\n')}`);
            }

            console.log('PackMaster Phase 2 production browser smoke passed');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
