name: PackMaster Final Pilot-ready Production Smoke

on:
  push:
    branches:
      - pilot-ready-final-production-smoke

permissions:
  contents: read

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live production assets and frozen Batch adapter
        run: |
          BASE='https://0948910191g-tech.github.io/packmaster'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$BASE/" -o /tmp/production.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$BASE/packmaster-batch.js" -o /tmp/packmaster-batch.js
          grep -F './packmaster-archive.js' /tmp/production.html
          grep -F 'PackMaster Pilot' /tmp/production.html
          grep -F 'ความปลอดภัย Workspace' /tmp/production.html
          grep -F 'Storage Health' /tmp/production.html
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const source = fs.readFileSync('/tmp/packmaster-batch.js');
          const sha = crypto.createHash('sha1').update(`blob ${source.length}\0`).update(source).digest('hex');
          if (sha !== '941bddd557803aa27e58bd23372b9f51d6ca1605') throw new Error(`Production Batch adapter is not frozen: ${sha}`);
          console.log('Production Batch adapter matches frozen Phase 2 blob');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Diagnose first Production Batch storage call
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push({ message: error.message, stack: error.stack }));
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            await page.goto('https://0948910191g-tech.github.io/packmaster/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch && document.querySelector('#root')), null, { timeout: 60000 });
            await page.waitForTimeout(1000);
            const diag = await page.evaluate(async () => {
              const result = {
                typeofIndexedDB: typeof indexedDB,
                indexedDBConstructor: indexedDB && indexedDB.constructor ? indexedDB.constructor.name : null,
                typeofDate: typeof Date,
                dateIsFunction: typeof Date === 'function',
                typeofPromise: typeof Promise,
                batchKeys: Object.keys(window.PackMasterBatch || {}),
                listType: typeof window.PackMasterBatch?.listBatches,
                listResult: null,
                listError: null
              };
              try {
                result.listResult = await window.PackMasterBatch.listBatches();
              } catch (error) {
                result.listError = {
                  name: error && error.name,
                  message: error && error.message,
                  stack: error && error.stack
                };
              }
              return result;
            });
            console.log('BATCH_DIAGNOSTIC=' + JSON.stringify(diag, null, 2));
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors, null, 2));
            console.log('CONSOLE_ERRORS=' + JSON.stringify(consoleErrors, null, 2));
            if (diag.listError) throw new Error(`listBatches diagnostic failure: ${diag.listError.message}\n${diag.listError.stack || ''}`);
            console.log('Diagnostic listBatches passed');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
