name: Validate Hybrid Review Grid Browser

on:
  push:
    branches:
      - frontend-v3-hybrid-review-grid
    paths:
      - .github/workflows/validate-hybrid-review-grid-browser.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-v3-hybrid-review-grid
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/packmaster-http.log 2>&1 &
          echo $! >/tmp/packmaster-http.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/packmaster-http.log
          exit 1
      - name: Exercise hybrid multi-card review layout
        run: |
          cat > hybrid-review-grid-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1536, height: 1050 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            if (!api) throw new Error('PackMasterBatch unavailable');
            for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.setItem('skuMappingRules', JSON.stringify([{ id: 'hybrid-rule', keyword: 'HYBRID REVIEW SKU', shortName: 'เด้งม่วง5' }]));
            const meta = api.createBatchMeta([], new Date('2026-08-08T23:20:00+07:00'));
            const img = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200"><rect width="100%" height="100%" fill="white"/><text x="50" y="100" font-size="50" fill="black">HYBRID LABEL</text></svg>');
            const orders = Array.from({ length: 9 }, (_, idx) => {
              const n = idx + 1;
              return {
                id: `hybrid-order-${n}`,
                tracking: `HYBRID-${String(n).padStart(4, '0')}`,
                parsedItems: [{ text: 'HYBRID REVIEW SKU', qty: n % 3 + 1 }],
                pdfImage: img,
                platform: n % 2 ? 'SHOPEE' : 'TIKTOK',
                orderId: `HYBRIDORDER${String(n).padStart(4, '0')}`,
                declaredTotalQty: null,
                parserWarning: false
              };
            });
            const savedMeta = api.buildBatchMeta(meta, { total: 9, ready: 9, reviewSku: 0, reviewQty: 0, unmapped: 0 }, { now: new Date('2026-08-08T23:20:00+07:00') });
            await api.saveBatch(savedMeta, orders);
          });

          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'เปิดงาน', exact: true }).first().click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });
          await page.getByRole('button', { name: 'รีวิว & พิมพ์', exact: true }).first().click();
          const grid = page.locator('[data-pm-review-layout="hybrid-grid"]');
          await grid.waitFor({ state: 'visible' });
          const cards = page.locator('[data-pm-review-preview-item]');
          assert(await cards.count() === 9, `Expected 9 hybrid cards, got ${await cards.count()}`);
          assert(await page.locator('[data-pm-review-card-details]').count() === 9, 'Every hybrid card must have enhanced details');

          const columnCount = await grid.evaluate(el => getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length);
          assert(columnCount === 3, `Expected 3 desktop columns at 1536px, got ${columnCount}`);
          await cards.first().getByText('Order / Tracking', { exact: true }).waitFor();
          await cards.first().getByText('HYBRID-0001', { exact: true }).waitFor();
          await cards.first().getByText('ชื่อภายใน / ผลลัพธ์ที่จะพิมพ์', { exact: true }).waitFor();
          await cards.first().getByText('เด้งม่วง5', { exact: true }).waitFor();
          await cards.first().getByText('พร้อมพิมพ์', { exact: true }).waitFor();
          assert(await page.getByRole('button', { name: 'พรีวิวหลายใบ', exact: true }).getAttribute('title') === 'พรีวิวหลายใบ', 'Hybrid preview must be primary toggle');

          const search = page.getByPlaceholder('ค้นหา Order / SKU / ชื่อภายใน');
          await search.fill('HYBRID-0009');
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 1);
          assert(await cards.count() === 1, 'Search must filter hybrid cards');
          await search.fill('');
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 9);

          await page.getByRole('button', { name: 'มุมมองรายการ', exact: true }).click();
          await page.locator('table.pm-table').last().waitFor({ state: 'visible' });
          await page.getByRole('button', { name: 'พรีวิวหลายใบ', exact: true }).click();
          await grid.waitFor({ state: 'visible' });

          assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
          const relevantConsoleErrors = consoleErrors.filter(text => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(text));
          assert(relevantConsoleErrors.length === 0, `Console errors: ${relevantConsoleErrors.join(' | ')}`);

          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.removeItem('skuMappingRules');
          });
          await browser.close();
          console.log('PackMaster hybrid 3-column review grid Chromium smoke passed');
          JS
          node hybrid-review-grid-smoke.mjs
      - name: Verify frozen print scope
        run: |
          grep -Fq 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -Fq 'MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/packmaster-http.pid)" 2>/dev/null || true
