name: Verify Clean Keyword Assistant

on:
  push:
    branches:
      - verify-keyword-assistant-clean
    paths:
      - .github/workflows/verify-keyword-assistant-clean.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6b3e05c6e5f54a0ba36c5e0b84bddd382a139fa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact tested feature head and frozen safety invariants
        run: |
          test "$(git rev-parse HEAD)" = 'e6b3e05c6e5f54a0ba36c5e0b84bddd382a139fa'
          test "$(git hash-object packmaster-batch.js)" = '941bddd557803aa27e58bd23372b9f51d6ca1605'
          grep -Fq 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -Fq 'MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/kw-clean-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kw-clean-http.log
          exit 1
      - name: Exercise clean Keyword Assistant head
        run: |
          cat > verify-keyword-clean.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.evaluate(async () => {
            localStorage.removeItem('skuMappingRules');
            const api = window.PackMasterBatch;
            if (api) for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
          });
          await page.reload({ waitUntil: 'networkidle' });

          await page.getByRole('button', { name: 'เริ่มงานแพ็กใหม่', exact: true }).click();
          const longSource = '(1 แถม 1) ทิชชู่เปียกเครื่องสำอาง EXCARE MAKEUP REMOVER ช่วยขจัดเมคอัพและทำความสะอาดผิว 30 แผ่นใหญ่';
          await page.evaluate(async ({ longSource }) => {
            const api = window.PackMasterBatch;
            const batch = (await api.listBatches())[0];
            const pixel = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlF1VQAAAAASUVORK5CYII=';
            const orders = [
              { id:'kw1', tracking:'KW-CLEAN-1', orderId:'SYNTH-KW-1', platform:'SHOPEE', pdfImage:pixel, parsedItems:[{text:longSource,qty:1}], qtyWarning:false },
              { id:'kw2', tracking:'KW-CLEAN-2', orderId:'SYNTH-KW-2', platform:'SHOPEE', pdfImage:pixel, parsedItems:[{text:'HOYA V2 HAKU BLUE 1 ลัง',qty:1}], qtyWarning:true, declaredTotalQty:2 }
            ];
            await api.saveBatch(api.buildBatchMeta(batch,{total:2,ready:0,reviewSku:0,reviewQty:1,unmapped:1},{now:new Date()}),orders);
          }, { longSource });
          await page.getByRole('button', { name:'งานแพ็ก', exact:true }).click();
          await page.getByRole('button', { name:'เปิดงาน', exact:true }).first().click();
          await page.getByRole('button', { name:'รีวิว & พิมพ์', exact:true }).click();
          await page.getByRole('button', { name:'ตั้งชื่อ SKU', exact:true }).first().click();

          const modal = page.locator('[data-pm-quick-mapping]');
          await modal.waitFor({state:'visible'});
          const keyword = modal.locator('input').nth(0);
          const shortName = modal.locator('input').nth(1);
          assert(await keyword.inputValue() === longSource, 'long safe seed must remain initial Keyword');
          assert(await shortName.inputValue() === '', 'internal short name must stay blank');
          const suggestions = modal.locator('[data-pm-keyword-suggestion]');
          const count = await suggestions.count();
          assert(count >= 1 && count <= 3, `expected 1-3 suggestions, got ${count}`);
          const texts = await suggestions.evaluateAll(nodes => nodes.map(node => node.innerText));
          assert(texts.some(text => /EXCARE MAKEUP REMOVER/i.test(text)), `missing strong exact suggestion: ${texts.join(' | ')}`);
          const first = suggestions.first();
          const selected = (await first.locator('span').first().innerText()).trim();
          await first.click();
          assert(await keyword.inputValue() === selected, 'click must update Keyword only');
          assert(await shortName.inputValue() === '', 'suggestion must not fill shortName');
          assert((await page.evaluate(() => JSON.parse(localStorage.getItem('skuMappingRules') || '[]').length)) === 0, 'suggestion must not auto-save');
          await shortName.fill('Ex เมคอัพ1');
          await modal.getByRole('button',{name:'บันทึกและใช้',exact:true}).click();
          await modal.waitFor({state:'hidden'});
          const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('skuMappingRules') || '[]'));
          assert(saved.some(rule => rule.shortName === 'Ex เมคอัพ1'), 'manual shortName should save through normal rule path');

          const mixed = await page.evaluate(() => window.PackMasterKeywordAssistant.generateKeywordSuggestions({
            sourceText:'ทิชชู่เปียก สูตรเย็น 30 แผ่น สำหรับเช็ดทำความสะอาด',
            batchItemTexts:['ทิชชู่เปียก สูตรเย็น 30 แผ่น สำหรับเช็ดทำความสะอาด']
          }));
          assert(mixed.length > 0 && mixed.every(row => row.confidence === 'review'), 'mixed/Thai fallback must stay review-only');

          assert(await page.getByRole('button',{name:'Save PDF',exact:true}).isDisabled(), 'Qty exception must keep Save PDF locked');
          assert(pageErrors.length === 0, `page errors: ${pageErrors.join(' | ')}`);
          const relevant = consoleErrors.filter(text => !/favicon/i.test(text));
          assert(relevant.length === 0, `console errors: ${relevant.join(' | ')}`);
          await browser.close();
          console.log('Clean Keyword Assistant Chromium verification passed');
          JS
          node verify-keyword-clean.mjs
