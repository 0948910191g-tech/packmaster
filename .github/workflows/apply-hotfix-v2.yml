name: Apply Parser Matcher V2 Hotfix

on:
  push:
    branches:
      - hotfix/parser-matcher-v2
    paths:
      - scripts/apply-parser-matcher-v2.py
      - .github/workflows/apply-hotfix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/parser-matcher-v2
      - name: Apply targeted hotfix patch
        run: python3 scripts/apply-parser-matcher-v2.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit patched index
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: make SKU matching identity-first"
          git push origin HEAD:hotfix/parser-matcher-v2
