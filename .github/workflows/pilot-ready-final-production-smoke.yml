name: PackMaster Final Pilot-ready Production Smoke

on:
  push:
    branches:
      - pilot-ready-final-production-smoke

permissions:
  contents: read

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live production frozen Batch adapter
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://0948910191g-tech.github.io/packmaster/packmaster-batch.js -o /tmp/packmaster-batch.js
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const source = fs.readFileSync('/tmp/packmaster-batch.js');
          const sha = crypto.createHash('sha1').update(`blob ${source.length}\0`).update(source).digest('hex');
          if (sha !== '941bddd557803aa27e58bd23372b9f51d6ca1605') throw new Error(`Unexpected Production Batch adapter: ${sha}`);
          console.log('Frozen Production Batch adapter verified');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run checkpointed live workflow
        run: node .github/scripts/pilot-ready-checkpoint-smoke.js

      - name: Reached Production load
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 1

      - name: Reached Batch create
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 3

      - name: Reached Archive sidecar
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 6

      - name: Reached Storage cleanup
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 7

      - name: Reached Diagnostics
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 8

      - name: Reached Workspace Backup
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 9

      - name: Reached Workspace Restore
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 10

      - name: Reached Invalid Backup rejection
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 11

      - name: Reached Reload persistence
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 12

      - name: Completed full Production smoke
        if: always()
        run: test "$(cut -d: -f1 /tmp/packmaster-pilot-checkpoint 2>/dev/null || echo 0)" -ge 13

      - name: Assert no hidden workflow error
        if: always()
        run: test ! -f /tmp/packmaster-pilot-error
