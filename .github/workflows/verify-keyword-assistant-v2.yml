name: Verify Keyword Assistant v2

on:
  push:
    branches:
      - verify-keyword-assistant-v2

jobs:
  production-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for live v2 helper
        run: |
          for i in $(seq 1 60); do
            curl -fsS "https://0948910191g-tech.github.io/packmaster/packmaster-keyword-assistant.js?ts=$(date +%s)" -o /tmp/live-helper.js || true
            if grep -q "METADATA_TOKENS" /tmp/live-helper.js && grep -q "product-anchor-window" /tmp/live-helper.js; then exit 0; fi
            sleep 2
          done
          echo "Live helper did not update in time"
          cat /tmp/live-helper.js || true
          exit 1
      - name: Verify live frozen Batch adapter
        run: |
          curl -fsS "https://0948910191g-tech.github.io/packmaster/packmaster-batch.js?ts=$(date +%s)" -o /tmp/live-batch.js
          test "$(git hash-object /tmp/live-batch.js)" = "941bddd557803aa27e58bd23372b9f51d6ca1605"
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise live Keyword Assistant v2
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.goto('https://0948910191g-tech.github.io/packmaster/?verify=keyword-v2-' + Date.now(), { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => window.PackMasterKeywordAssistant && typeof window.PackMasterKeywordAssistant.generateKeywordSuggestions === 'function');

            const result = await page.evaluate(() => {
              const api = window.PackMasterKeywordAssistant;
              const thaiSource = '(ยกลัง36ห่อ) ใหม่ ทิชชู่เปียก ฮากุ เบบี้ สูตรน้ำแร่ อ่อนโยน ผิวบอบบางชุ่มชื้น 40 แผ่น/ห่อ ID 123456789012345678 NICKNAME ลูกค้าทดสอบ';
              const excareSource = '1 ห่อ ทิชชู่เปียกสำหรับผู้ใหญ่ EXCARE ADULT Wipes XXL 50 แผ่นใหญ่ ผิวบอบบาง ID 987654321098765432 NICKNAME TESTUSER';
              return {
                thai: api.generateKeywordSuggestions({ sourceText: thaiSource, batchItemTexts: [thaiSource] }),
                excare: api.generateKeywordSuggestions({ sourceText: excareSource, existingRules: [{ id: 1, keyword: 'EXCARE', shortName: 'existing' }], batchItemTexts: [excareSource] })
              };
            });

            assert.equal(result.thai[0]?.value, 'ฮากุ เบบี้ สูตรน้ำแร่');
            assert.ok(result.excare.length > 0);
            assert.match(result.excare[0].value, /EXCARE|ADULT|XXL/i);
            const all = [...result.thai, ...result.excare];
            assert.equal(all.some(row => /NICKNAME|\bID\b|\d{8,}/i.test(row.value)), false);
            assert.deepEqual(errors, []);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
