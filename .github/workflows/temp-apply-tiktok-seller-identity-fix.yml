name: Temporary Apply TikTok Seller Identity Fix

on:
  push:
    branches:
      - fix/tiktok-seller-identity-20260814

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiktok-seller-identity-20260814
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply minimal matcher fix
        run: node scripts/apply-tiktok-seller-identity-fix.mjs

      - name: Run focused regression
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "fix: prioritize TikTok seller SKU identity"
          git push origin HEAD:fix/tiktok-seller-identity-20260814
