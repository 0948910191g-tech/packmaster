name: Temporary Apply Keyword Static Safety

on:
  push:
    branches:
      - agent/matcher-safety-reset-20260827
    paths:
      - .github/workflows/temp-apply-keyword-static-safety.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          ref: agent/matcher-safety-reset-20260827
          fetch-depth: 0

      - name: Apply Keyword Assistant static safety patch
        run: node scripts/apply-keyword-static-safety.mjs

      - name: Verify only Keyword Assistant changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "packmaster-keyword-assistant.js"
          git diff --check

      - name: Keyword Assistant regression tests
        run: node --test tests/packmaster-keyword-assistant.test.mjs

      - name: Review Keyword recommendation tests
        run: node --test tests/packmaster-review-keyword-suggestions.test.mjs

      - name: Smart matcher regression tests
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Commit verified Keyword Assistant patch and remove temporary tooling
        run: |
          rm scripts/apply-keyword-static-safety.mjs
          rm .github/workflows/temp-apply-keyword-static-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packmaster-keyword-assistant.js scripts/apply-keyword-static-safety.mjs .github/workflows/temp-apply-keyword-static-safety.yml
          git commit -m "fix: add static Keyword Assistant safety gate"
          git push origin HEAD:agent/matcher-safety-reset-20260827
