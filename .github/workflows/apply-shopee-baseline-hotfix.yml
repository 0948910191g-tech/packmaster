name: Apply Shopee Baseline Hotfix

on:
  push:
    branches:
      - hotfix/shopee-row-baseline
    paths:
      - scripts/apply-shopee-row-baseline-fix.py
      - .github/workflows/apply-shopee-baseline-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/shopee-row-baseline
      - name: Apply Shopee baseline patch
        run: python3 scripts/apply-shopee-row-baseline-fix.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit patched index
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: include Shopee first product line in row parser"
          git push origin HEAD:hotfix/shopee-row-baseline
