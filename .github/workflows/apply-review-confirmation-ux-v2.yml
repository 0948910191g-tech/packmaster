name: Apply Review Confirmation UX V2

on:
  push:
    branches:
      - feature/review-confirmation-ux-v2
    paths:
      - scripts/apply-review-confirmation-ux-v2.mjs
      - .github/workflows/apply-review-confirmation-ux-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/review-confirmation-ux-v2
          fetch-depth: 1

      - name: Apply guarded index patch
        run: node scripts/apply-review-confirmation-ux-v2.mjs

      - name: Verify only expected app file changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "No patch changes required"
            exit 0
          fi
          if [ "$changed" != "index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: wire Review Confirmation UX V2"
          git push origin HEAD:feature/review-confirmation-ux-v2
