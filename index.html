<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PackMaster V48.12 Ultimate (The Print Perfect)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] } } } }
  </script>
  <style>
    @media print { 
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      @page { size: 100mm 150mm; margin: 0; } 
      body { background: white !important; } 
      .print-area { display: block !important; }
      .no-print { display: none !important; }
      
      .label-overlay {
        background-color: #ffffff !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 4px dashed #172554 !important;
      }
      .label-overlay-text {
        text-shadow: none !important;
        color: #172554 !important;
      }
    }
    body { font-family: 'Noto Sans Thai', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] text-blue-950 selection:bg-blue-200">
  <div id="root"></div>

  <script type="text/babel">
    if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const { useState, useEffect, useCallback, useMemo } = React;

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => { const timer = setTimeout(() => onClose(), 3000); return () => clearTimeout(timer); }, [onClose]);
      return (
        <div className={`fixed top-6 right-6 z-[99999] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl border animate-in slide-in-from-right-8 duration-300 ${type === 'success' ? 'bg-white border-green-100 text-green-700' : 'bg-white border-red-100 text-red-600'}`}>
          <span className="text-xl">{type === 'success' ? '✅' : '❌'}</span>
          <span className="font-bold text-sm tracking-wide">{message}</span>
        </div>
      );
    };

    const LabelCard = ({ order, isExport = false, thermalMode = true }) => {
      const [displayImg, setDisplayImg] = useState(order.pdfImage);

      useEffect(() => {
        if (!order || !order.pdfImage) return;
        if (!thermalMode) {
          setDisplayImg(order.pdfImage);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement('canvas');
          cvs.width = img.width;
          cvs.height = img.height;
          const ctx = cvs.getContext('2d');
          ctx.filter = 'grayscale(100%) brightness(80%) contrast(200%)';
          ctx.drawImage(img, 0, 0);
          setDisplayImg(cvs.toDataURL('image/jpeg', 0.9));
        };
        img.src = order.pdfImage;
      }, [order.pdfImage, thermalMode]);

      if (!order || !order.pdfImage) return null;
      
      const itemCount = order.displayItems ? order.displayItems.length : 0;
      let maxLen = itemCount > 0 ? Math.max(...order.displayItems.map(t => t.length), 0) : 0;
      
      let fontSize = '42pt';
      let lineHeight = 1.2;
      
      if (itemCount === 1) {
          fontSize = maxLen > 20 ? '18pt' : maxLen > 12 ? '24pt' : maxLen > 8 ? '32pt' : '40pt';
          lineHeight = 1.1;
      } else if (itemCount === 2) {
          fontSize = maxLen > 22 ? '13pt' : maxLen > 15 ? '16pt' : maxLen > 10 ? '20pt' : '22pt';
          lineHeight = 1.1;
      } else if (itemCount === 3) {
          fontSize = maxLen > 20 ? '11pt' : '13pt'; 
          lineHeight = 1.1;
      } else {
          fontSize = '10pt'; 
          lineHeight = 1.0;
      }

      return (
        <div className={`shrink-0 box-border ${isExport ? '' : 'border-2 border-blue-50 shadow-xl shadow-blue-900/5 rounded-2xl'}`} style={{ width: '100mm', height: '150mm', backgroundColor: '#ffffff', position: 'relative', overflow: 'hidden', pageBreakAfter: 'always', margin: 0, display: 'block', isolation: 'isolate' }}>
          <img src={displayImg} alt="Label Base" style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'fill', zIndex: 0 }} />
          
          {order.displayItems && order.displayItems.length > 0 && (
            <div className="label-overlay" style={{ position: 'absolute', zIndex: 10, boxSizing: 'border-box', bottom: '24px', left: '16px', right: '16px', height: '18%', border: '4px dashed #172554', borderRadius: '14px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '8px', gap: '4px', backgroundColor: 'rgba(255,255,255,0.90)', backdropFilter: 'blur(2px)', overflow: 'hidden' }}>
              {order.displayItems.map((text, idx) => (
                <p key={idx} className="label-overlay-text" style={{ fontFamily: '"Noto Sans Thai", sans-serif', fontWeight: 800, color: '#172554', lineHeight: lineHeight, margin: 0, textAlign: 'center', wordBreak: 'break-word', width: '100%', letterSpacing: '-0.02em', fontSize: fontSize, textShadow: '3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 2px 4px 8px rgba(23, 37, 84, 0.15)' }}>
                  {text}
                </p>
              ))}
            </div>
          )}
        </div>
      );
    };

    const normalizeRuleKeyword = (value) => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');

    const normalizeMatchText = (str) => String(str || '').toLowerCase()
        .replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ')
        .replace(/[\uF700-\uF71A]/g, '')
        .replace(/\u0E33/g, 'า')
        .replace(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g, '')
        .replace(/[!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\bbb\b/g, 'baby');

    const COMMON_MATCH_TERMS = new Set(['hoya', 'haku', 'baby', 'wipes', 'wipe', 'ทชชเปยก', 'ผาเปยก']);
    const RULE_UNIT_TOKENS = new Set(['หอ', 'แพค', 'pack', 'packs', 'ลัง', 'case', 'x', 'ชน', 'ชิ้น', 'แผน']);
    const VARIANT_CONCEPTS = {
      VALUE_PACK: ['value pack', 'valuepack', 'แวลู', 'แวล'],
      PLUS: ['plus', 'พลส', 'พลัส'],
      COOLING: ['cooling', 'คูลลิง', 'คูลลิ่ง', 'สูตรเย็น', 'เย็นติดแอร', 'ติดแอร'],
      EXTRA: ['extra', 'เอ็กซตรา', 'เอกซตรา', 'เอ็กซ์ตร้า'],
      MENTHOL: ['menthol', 'เมนทอล'],
      LAVENDER: ['lavender', 'ลาเวนเดอร'],
      JASMINE: ['jasmine', 'มะลิ'],
      MIX: ['mix', 'คละ'],
      NONO: ['nono'],
      ALCOHOL: ['alcohol', 'alc', 'แอลกอฮอล']
    };
    const HARD_VARIANT_CONCEPTS = new Set(['VALUE_PACK', 'PLUS', 'EXTRA', 'MENTHOL', 'LAVENDER', 'JASMINE', 'MIX']);

    const getVariantConcepts = (value) => {
      const text = normalizeMatchText(value);
      const concepts = new Set();
      Object.entries(VARIANT_CONCEPTS).forEach(([concept, aliases]) => {
        if (aliases.some(alias => text.includes(normalizeMatchText(alias)))) concepts.add(concept);
      });
      return concepts;
    };

    const extractPackTokens = (value) => {
      const text = normalizeMatchText(value);
      const tokens = new Set();
      const regex = /(\d{1,3})\s*(หอ|แพค|packs?|ลัง|case)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const unit = /ลัง|case/.test(match[2]) ? 'case' : 'pack';
        tokens.add(`${parseInt(match[1], 10)}:${unit}`);
      }
      return tokens;
    };

    const tokenMatchesSearch = (token, searchArea) => {
      if (!token) return false;
      if (/^\d{1,4}$/.test(token)) {
        const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`(^|\\D)${escaped}(?!\\d)`).test(searchArea);
      }
      if (/^[a-z0-9]+$/.test(token)) {
        const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`(^|[^a-z0-9])${escaped}(?![a-z0-9])`).test(searchArea);
      }
      return searchArea.includes(token);
    };

    const extractRulePackNumbers = (value) => {
      const clean = normalizeMatchText(value);
      const explicit = extractPackTokens(clean);
      if (explicit.size > 0) {
        return new Set([...explicit].map(token => parseInt(token.split(':')[0], 10)).filter(Number.isFinite));
      }
      const trailing = clean.match(/(?:^|\D)(\d{1,3})\s*$/);
      return trailing ? new Set([parseInt(trailing[1], 10)]) : new Set();
    };

    const extractTextPackNumbers = (value) => new Set(
      [...extractPackTokens(value)].map(token => parseInt(token.split(':')[0], 10)).filter(Number.isFinite)
    );

    const extractBundleSignature = (value) => {
      const compact = normalizeMatchText(value).replace(/\s+/g, '');
      const match = compact.match(/(\d{1,3})(?:แถม|free)(\d{1,3})/i);
      return match ? `${parseInt(match[1], 10)}+${parseInt(match[2], 10)}` : null;
    };

    const bundleCompatible = (ruleText, searchText) => {
      const ruleBundle = extractBundleSignature(ruleText);
      const textBundle = extractBundleSignature(searchText);
      if (textBundle) return ruleBundle === textBundle;
      return !ruleBundle;
    };

    const scoreSkuRule = (rule, textToSearch, allRules = []) => {
      const searchArea = normalizeMatchText(textToSearch);
      const cleanKw = normalizeMatchText(rule && rule.keyword);
      if (!searchArea || !cleanKw) return { rule, score: -Infinity, hardConflict: true, reason: 'empty' };

      let score = 0;
      let hardConflict = false;
      const reasons = [];
      const ruleTokens = cleanKw.split(' ').filter(Boolean);
      const matchedTokens = ruleTokens.filter(token => tokenMatchesSearch(token, searchArea));
      const coverage = ruleTokens.length ? matchedTokens.length / ruleTokens.length : 0;
      const textConcepts = getVariantConcepts(searchArea);
      const ruleConcepts = getVariantConcepts(cleanKw);
      const textBundle = extractBundleSignature(searchArea);
      const ruleBundle = extractBundleSignature(cleanKw);

      if (textBundle || ruleBundle) {
        if (textBundle && ruleBundle === textBundle) {
          score += 180;
          reasons.push(`bundle:${textBundle}`);
        } else {
          score -= 240;
          hardConflict = true;
          reasons.push(textBundle ? 'bundle-mismatch' : 'missing-bundle');
        }
      }

      if (searchArea.includes(cleanKw)) {
        score += 140;
        reasons.push('exact');
      }
      if (coverage === 1) {
        score += 70;
        reasons.push('all-terms');
      } else if (coverage >= 0.75) {
        score += 25;
        reasons.push('partial-terms');
      }

      const specificTokens = ruleTokens.filter(token =>
        !/^\d{1,4}$/.test(token) && !COMMON_MATCH_TERMS.has(token) && !RULE_UNIT_TOKENS.has(token)
      );
      const matchedSpecific = specificTokens.filter(token => tokenMatchesSearch(token, searchArea));
      const hasConceptIdentity = [...ruleConcepts].some(concept => textConcepts.has(concept));
      if (specificTokens.length > 0 && matchedSpecific.length === 0 && !hasConceptIdentity) {
        score -= 220;
        hardConflict = true;
        reasons.push('identity-miss');
      }

      matchedTokens.forEach(token => {
        if (COMMON_MATCH_TERMS.has(token)) {
          score += 4;
          return;
        }
        if (/^\d{1,4}$/.test(token)) {
          score += 8;
          return;
        }
        const frequency = (Array.isArray(allRules) ? allRules : []).filter(candidate =>
          tokenMatchesSearch(token, normalizeMatchText(candidate && candidate.keyword))
        ).length;
        score += frequency <= 1 ? 18 : 9;
      });

      const textPackNumbers = extractTextPackNumbers(searchArea);
      const rulePackNumbers = extractRulePackNumbers(cleanKw);
      if (rulePackNumbers.size > 0 && textPackNumbers.size > 0) {
        const packMatch = [...rulePackNumbers].some(number => textPackNumbers.has(number));
        if (packMatch) {
          score += 50;
          reasons.push('pack');
        } else {
          score -= 200;
          hardConflict = true;
          reasons.push('pack-conflict');
        }
      }

      ruleConcepts.forEach(concept => {
        if (textConcepts.has(concept)) {
          score += 40;
          reasons.push(`concept:${concept}`);
        } else {
          score -= HARD_VARIANT_CONCEPTS.has(concept) ? 160 : 35;
          if (HARD_VARIANT_CONCEPTS.has(concept)) hardConflict = true;
          reasons.push(`missing:${concept}`);
        }
      });

      HARD_VARIANT_CONCEPTS.forEach(concept => {
        if (textConcepts.has(concept) && !ruleConcepts.has(concept)) {
          score -= 200;
          hardConflict = true;
          reasons.push(`unexpected:${concept}`);
        }
      });

      const coolingFamilyConcepts = new Set(['MENTHOL', 'LAVENDER', 'JASMINE', 'EXTRA', 'MIX']);
      if (textConcepts.has('COOLING') && !ruleConcepts.has('COOLING') &&
          ![...ruleConcepts].some(concept => coolingFamilyConcepts.has(concept)) &&
          ruleTokens.includes('haku')) {
        score -= 180;
        hardConflict = true;
        reasons.push('cooling-generic-conflict');
      }

      const numericRuleTokens = ruleTokens.filter(token => /^\d{1,4}$/.test(token));
      if (numericRuleTokens.some(token => tokenMatchesSearch(token, searchArea)) &&
          [...ruleConcepts].every(concept => textConcepts.has(concept))) {
        score += 20;
        reasons.push('concept-number');
      }

      return { rule, score, hardConflict, reason: reasons.join(',') || 'weak' };
    };

    const normalizeOutputIdentity = (value) => normalizeMatchText(value).replace(/\s+/g, '');

    const matchSkuRule = (textToSearch, rules) => {
      const searchArea = normalizeMatchText(textToSearch);
      const normalizedRules = (Array.isArray(rules) ? rules : [])
        .map(rule => ({ rule, cleanKw: normalizeMatchText(rule && rule.keyword) }))
        .filter(entry => entry.cleanKw);

      const exactMatches = normalizedRules
        .filter(entry => searchArea.includes(entry.cleanKw) && bundleCompatible(entry.cleanKw, searchArea))
        .sort((a, b) => b.cleanKw.length - a.cleanKw.length);

      if (exactMatches.length > 0) {
        const longestLength = exactMatches[0].cleanKw.length;
        const longest = exactMatches.filter(entry => entry.cleanKw.length === longestLength);
        const outputs = new Set(longest.map(entry => normalizeOutputIdentity(entry.rule && entry.rule.shortName)));
        if (outputs.size > 1) {
          return { status: 'ambiguous', rule: null, score: 1000, runnerUpScore: 1000, reason: 'exact-conflict' };
        }
        return { status: 'matched', rule: longest[0].rule, score: 1000, runnerUpScore: 0, reason: 'exact-longest' };
      }

      const candidates = normalizedRules
        .map(entry => scoreSkuRule(entry.rule, textToSearch, rules))
        .filter(candidate => Number.isFinite(candidate.score))
        .sort((a, b) => b.score - a.score);

      if (candidates.length === 0) {
        return { status: 'unmatched', rule: null, score: 0, runnerUpScore: 0, reason: 'no-rules' };
      }

      const best = candidates[0];
      const runnerUp = candidates[1] || null;
      const runnerUpScore = runnerUp ? runnerUp.score : -Infinity;

      if (best.hardConflict || best.score < 80) {
        return { status: 'unmatched', rule: null, score: best.score, runnerUpScore, reason: best.reason };
      }

      if (runnerUp && !runnerUp.hardConflict &&
          normalizeOutputIdentity(runnerUp.rule && runnerUp.rule.shortName) !== normalizeOutputIdentity(best.rule && best.rule.shortName) &&
          best.score - runnerUp.score < 20) {
        return { status: 'ambiguous', rule: null, score: best.score, runnerUpScore, reason: 'score-gap' };
      }

      return { status: 'matched', rule: best.rule, score: best.score, runnerUpScore, reason: best.reason };
    };

    const parseExplicitTotalQty = (fullText, platform) => {
      const text = String(fullText || '');
      if (platform === 'TIKTOK') {
        const match = text.match(/Qty\s*Total\s*:\s*(\d{1,4})/i);
        return match ? parseInt(match[1], 10) : null;
      }
      const shopeeFooter = text.match(/Shopee\s*Order\s*No\.?\s*[A-Z0-9]+\s+(\d{1,4})\s*$/i);
      return shopeeFooter ? parseInt(shopeeFooter[1], 10) : null;
    };

    const toPositionedPdfItems = (textContent) => (textContent && Array.isArray(textContent.items) ? textContent.items : [])
      .map((item, index) => ({
        text: String(item && item.str || '').trim(),
        x: Number(item && item.transform && item.transform[4]) || 0,
        y: Number(item && item.transform && item.transform[5]) || 0,
        index
      }))
      .filter(item => item.text);

    const parseTikTokPositionedItems = (rawItems, declaredTotalQty = null) => {
      const entries = (Array.isArray(rawItems) ? rawItems : []).map((item, index) => ({
        text: String(item && (item.text ?? item.str) || '').trim(),
        x: Number(item && (item.x ?? (item.transform && item.transform[4]))) || 0,
        y: Number(item && (item.y ?? (item.transform && item.transform[5]))) || 0,
        index: Number.isFinite(item && item.index) ? item.index : index
      })).filter(item => item.text);

      const hasTableSignal = normalizeMatchText(entries.map(item => item.text).join(' ')).includes('product name');
      const qtyHeaders = entries.filter(item => normalizeMatchText(item.text) === 'qty');
      let header = null;

      for (const qtyHeader of qtyHeaders) {
        const sameLine = entries.filter(item => Math.abs(item.y - qtyHeader.y) <= 5);
        const lineText = normalizeMatchText(sameLine.map(item => item.text).join(' '));
        const sellerHeader = sameLine.find(item => normalizeMatchText(item.text).includes('seller'));
        const skuHeaders = sameLine
          .filter(item => /(^|\s)sku($|\s)/.test(normalizeMatchText(item.text)))
          .sort((a, b) => a.x - b.x);
        const firstSkuHeader = sellerHeader
          ? (skuHeaders.find(item => item.x < sellerHeader.x - 1) || skuHeaders[0])
          : skuHeaders[0];

        if (lineText.includes('product name') && firstSkuHeader && sellerHeader && qtyHeader.x > sellerHeader.x) {
          header = {
            y: qtyHeader.y,
            qtyX: qtyHeader.x,
            firstSkuX: firstSkuHeader.x,
            sellerX: sellerHeader.x
          };
          break;
        }
      }

      if (!header) {
        return { items: [], declaredTotalQty, parserWarning: hasTableSignal, reason: hasTableSignal ? 'header-not-found' : 'no-table' };
      }

      const qtyMarkers = entries.filter(item =>
        /^\d{1,4}$/.test(item.text) && Math.abs(item.x - header.qtyX) <= 14 && Math.abs(item.y - header.y) > 5
      );
      if (qtyMarkers.length === 0) {
        return { items: [], declaredTotalQty, parserWarning: true, reason: 'qty-column-empty' };
      }

      const nearest = [...qtyMarkers].sort((a, b) => Math.abs(a.y - header.y) - Math.abs(b.y - header.y))[0];
      const direction = Math.sign(nearest.y - header.y) || 1;
      const distance = item => (item.y - header.y) * direction;
      const markers = qtyMarkers
        .filter(item => distance(item) > 4)
        .sort((a, b) => distance(a) - distance(b));

      const items = [];
      let parserWarning = false;
      markers.forEach((marker, markerIndex) => {
        const currentDistance = distance(marker);
        const previousDistance = markerIndex > 0 ? distance(markers[markerIndex - 1]) : 4;
        const nextDistance = markerIndex < markers.length - 1 ? distance(markers[markerIndex + 1]) : Infinity;
        const lower = markerIndex === 0 ? 4 : (previousDistance + currentDistance) / 2;
        const upper = Number.isFinite(nextDistance) ? (currentDistance + nextDistance) / 2 : Infinity;

        const rowEntries = entries.filter(item => {
          const d = distance(item);
          return d >= lower && d < upper && item.index !== marker.index;
        });
        const productParts = rowEntries.filter(item => item.x < header.firstSkuX - 2).sort((a, b) => a.index - b.index);
        const skuParts = rowEntries.filter(item => item.x >= header.firstSkuX - 2 && item.x < header.sellerX - 2).sort((a, b) => a.index - b.index);
        const sellerParts = rowEntries.filter(item => item.x >= header.sellerX - 2 && item.x < header.qtyX - 5).sort((a, b) => a.index - b.index);
        const productText = productParts.map(item => item.text).join(' ').trim();
        const skuText = skuParts.map(item => item.text).join(' ').trim();
        const sellerText = sellerParts.map(item => item.text).join(' ').trim();
        const text = [productText, skuText, sellerText].filter(Boolean).join(' | ');
        const qty = parseInt(marker.text, 10);

        if (!text || !Number.isFinite(qty) || qty < 1) {
          parserWarning = true;
          return;
        }
        items.push({ text, qty });
      });

      if (items.length !== markers.length) parserWarning = true;
      return { items, declaredTotalQty, parserWarning, reason: parserWarning ? 'partial-row-parse' : 'positioned-columns' };
    };

    const parseShopeePositionedItems = (rawItems, declaredTotalQty = null) => {
      const entries = (Array.isArray(rawItems) ? rawItems : []).map((item, index) => ({
        text: String(item && (item.text ?? item.str) || '').trim(),
        x: Number(item && (item.x ?? (item.transform && item.transform[4]))) || 0,
        y: Number(item && (item.y ?? (item.transform && item.transform[5]))) || 0,
        index: Number.isFinite(item && item.index) ? item.index : index
      })).filter(item => item.text);

      const hashHeaders = entries.filter(item => item.text.trim() === '#');
      let header = null;

      for (const hashHeader of hashHeaders) {
        const sameLine = entries.filter(item => Math.abs(item.y - hashHeader.y) <= 6).sort((a, b) => a.x - b.x);
        const lineText = normalizeMatchText(sameLine.map(item => item.text).join(' '));
        if (!lineText.includes('ชอสนคา') || !lineText.includes('จานวน')) continue;

        const nonHash = sameLine.filter(item => item.index !== hashHeader.index);
        const productHeader = nonHash.find(item => normalizeMatchText(item.text).includes('ชอสนคา')) || nonHash[0];
        const qtyHeader = [...nonHash].reverse().find(item => normalizeMatchText(item.text).includes('จานวน')) || nonHash[nonHash.length - 1];
        if (!productHeader || !qtyHeader || qtyHeader.x <= productHeader.x) continue;

        header = {
          y: hashHeader.y,
          rowX: hashHeader.x,
          productX: productHeader.x,
          qtyX: qtyHeader.x
        };
        break;
      }

      const hasTableSignal = entries.some(item => item.text.trim() === '#') &&
        normalizeMatchText(entries.map(item => item.text).join(' ')).includes('ชอสนคา');

      if (!header) {
        return { items: [], declaredTotalQty, parserWarning: hasTableSignal, reason: hasTableSignal ? 'header-not-found' : 'no-table' };
      }

      const rowCandidates = entries.filter(item =>
        /^\d{1,2}$/.test(item.text) && Math.abs(item.x - header.rowX) <= 16 && Math.abs(item.y - header.y) > 5
      );
      if (rowCandidates.length === 0) {
        return { items: [], declaredTotalQty, parserWarning: true, reason: 'row-index-empty' };
      }

      const nearest = [...rowCandidates].sort((a, b) => Math.abs(a.y - header.y) - Math.abs(b.y - header.y))[0];
      const direction = Math.sign(nearest.y - header.y) || 1;
      const distance = item => (item.y - header.y) * direction;
      const sortedRows = rowCandidates.filter(item => distance(item) > 4).sort((a, b) => distance(a) - distance(b));
      const rowMarkers = [];
      let expected = 1;
      for (const candidate of sortedRows) {
        const rowNumber = parseInt(candidate.text, 10);
        if (rowNumber === expected) {
          rowMarkers.push(candidate);
          expected += 1;
        }
      }

      if (rowMarkers.length === 0) {
        return { items: [], declaredTotalQty, parserWarning: true, reason: 'row-sequence-empty' };
      }

      const footerDistances = entries
        .filter(item => {
          const normalized = normalizeMatchText(item.text);
          return normalized.includes('shopee order') || normalized.includes('powered by');
        })
        .map(distance)
        .filter(value => value > distance(rowMarkers[rowMarkers.length - 1]));
      const footerDistance = footerDistances.length ? Math.min(...footerDistances) : Infinity;

      const items = [];
      let parserWarning = false;

      rowMarkers.forEach((rowMarker, rowIndex) => {
        const currentDistance = distance(rowMarker);
        const previousDistance = rowIndex > 0 ? distance(rowMarkers[rowIndex - 1]) : 4;
        const nextDistance = rowIndex < rowMarkers.length - 1 ? distance(rowMarkers[rowIndex + 1]) : footerDistance;
        const lower = rowIndex === 0 ? 4 : (previousDistance + currentDistance) / 2;
        const upper = rowIndex < rowMarkers.length - 1
          ? (currentDistance + nextDistance) / 2
          : (Number.isFinite(footerDistance) ? footerDistance : Infinity);
        const rowEntries = entries.filter(item => {
          const d = distance(item);
          return d >= lower && d < upper && item.index !== rowMarker.index;
        });

        const qtyCandidates = rowEntries.filter(item =>
          /^\d{1,4}$/.test(item.text) && Math.abs(item.x - header.qtyX) <= 22
        ).sort((a, b) => {
          const aDistance = Math.abs(distance(a) - currentDistance) + Math.abs(a.x - header.qtyX) / 10;
          const bDistance = Math.abs(distance(b) - currentDistance) + Math.abs(b.x - header.qtyX) / 10;
          return aDistance - bDistance;
        });
        const qtyItem = qtyCandidates[0] || null;
        const qty = qtyItem ? parseInt(qtyItem.text, 10) : NaN;

        const productParts = rowEntries
          .filter(item => item.index !== (qtyItem && qtyItem.index) && item.x >= header.productX - 6 && item.x < header.qtyX - 8)
          .sort((a, b) => distance(a) - distance(b) || a.x - b.x || a.index - b.index);
        const productText = productParts.map(item => item.text).join(' ').trim();

        if (!productText || !Number.isFinite(qty) || qty < 1) {
          parserWarning = true;
          return;
        }
        items.push({ text: productText, qty });
      });

      if (items.length !== rowMarkers.length) parserWarning = true;
      return { items, declaredTotalQty, parserWarning, reason: parserWarning ? 'partial-row-parse' : 'positioned-columns' };
    };

    const hasQtyWarning = (items, declaredTotalQty, parserWarning = false) => {
      if (parserWarning) return true;
      if (!Number.isFinite(declaredTotalQty)) return false;
      const sum = (Array.isArray(items) ? items : []).reduce((total, item) => total + (parseInt(item && item.qty, 10) || 0), 0);
      return sum !== declaredTotalQty;
    };

    const sanitizeSkuRule = (rule, fallbackId) => {
      if (!rule || typeof rule !== 'object') return null;
      if (typeof rule.keyword !== 'string' || typeof rule.shortName !== 'string') return null;

      const keyword = rule.keyword.trim();
      const shortName = rule.shortName.trim();
      if (!keyword || !shortName) return null;

      return { id: rule.id ?? fallbackId, keyword, shortName };
    };

    const getAggregatedShortName = (baseName, qty, sourceKeyword = '') => {
      const cleanBaseName = String(baseName || '').trim().replace(/\u00A0/g, ' ');
      const normalizedQty = Math.max(1, parseInt(qty, 10) || 1);
      if (normalizedQty <= 1) return cleanBaseName;

      const numberMatches = Array.from(cleanBaseName.matchAll(/\d+/g));
      if (numberMatches.length === 0) return cleanBaseName;

      const bundleSignature = extractBundleSignature(sourceKeyword);
      if (bundleSignature) {
        const componentQtys = bundleSignature.split('+').map(value => parseInt(value, 10)).filter(Number.isFinite);
        if (componentQtys.length > 0 && numberMatches.length >= componentQtys.length) {
          const targets = numberMatches.slice(-componentQtys.length);
          const aligned = targets.every((match, index) => parseInt(match[0], 10) === componentQtys[index]);
          if (aligned) {
            let result = cleanBaseName;
            for (let index = targets.length - 1; index >= 0; index--) {
              const target = targets[index];
              const replacement = String(componentQtys[index] * normalizedQty);
              result = `${result.substring(0, target.index)}${replacement}${result.substring(target.index + target[0].length)}`;
            }
            return result;
          }
        }
      }

      const target = numberMatches[numberMatches.length - 1];
      const perItemQty = parseInt(target[0], 10);
      if (!Number.isFinite(perItemQty)) return cleanBaseName;

      const aggregatedQty = perItemQty * normalizedQty;
      return `${cleanBaseName.substring(0, target.index)}${aggregatedQty}${cleanBaseName.substring(target.index + target[0].length)}`;
    };

    const waitForLabelRender = async (element, order, thermalMode, timeoutMs = 10000) => {
      const image = element.querySelector('img[alt="Label Base"]');
      if (!image) throw new Error(`ไม่พบรูปใบปะหน้าสำหรับ ${order.id}`);

      const startedAt = Date.now();
      while (true) {
        const imageLoaded = image.complete && image.naturalWidth > 0;
        const thermalReady = !thermalMode || image.src !== order.pdfImage;
        if (imageLoaded && thermalReady) return;

        if (Date.now() - startedAt > timeoutMs) {
          throw new Error(`รอรูปใบปะหน้าไม่สำเร็จภายในเวลาที่กำหนด: ${order.id}`);
        }
        await new Promise(resolve => setTimeout(resolve, 50));
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('upload');
      const [orders, setOrders] = useState([]);
      const [skuRules, setSkuRules] = useState(() => {
        try {
          const saved = localStorage.getItem('skuMappingRules');
          if (!saved) return [];

          const parsedRules = JSON.parse(saved);
          if (!Array.isArray(parsedRules)) return [];

          return parsedRules
            .map((rule, index) => sanitizeSkuRule(rule, `saved-${Date.now()}-${index}`))
            .filter(Boolean);
        } catch (e) {
          console.warn('โหลดกฎ SKU จาก localStorage ไม่สำเร็จ', e);
          return [];
        }
      });
      const [newRule, setNewRule] = useState({ keyword: '', shortName: '' });
      const [editingId, setEditingId] = useState(null); 
      
      const [uploadError, setUploadError] = useState('');
      const [loadingStatus, setLoadingStatus] = useState({ active: false, current: 0, total: 0 });
      const [exportStatus, setExportStatus] = useState({ active: false, current: 0, total: 0 });
      const [previewMode, setPreviewMode] = useState('table');
      const [testInput, setTestInput] = useState('');
      const [testQty, setTestQty] = useState('1');
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      // Phase 1 UI/UX V2 — presentation-only controls
      const [reviewSearch, setReviewSearch] = useState('');
      const [reviewPlatform, setReviewPlatform] = useState('ALL');
      const [reviewStatus, setReviewStatus] = useState('ALL');
      const [skuSearch, setSkuSearch] = useState('');
      const [skuFilter, setSkuFilter] = useState('ALL');

      const [thermalMode, setThermalMode] = useState(() => {
        try { const saved = localStorage.getItem('thermalMode'); if (saved !== null) return JSON.parse(saved); } catch (e) {} return true;
      });

      useEffect(() => { localStorage.setItem('skuMappingRules', JSON.stringify(skuRules)); }, [skuRules]);
      useEffect(() => { localStorage.setItem('thermalMode', JSON.stringify(thermalMode)); }, [thermalMode]);

      const showToast = (message, type = 'success') => setToast({ show: true, message, type });

      const getMatchResult = useCallback((textToSearch) => {
        return matchSkuRule(textToSearch, skuRules);
      }, [skuRules]);

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        if (orders.length >= 150) {
            showToast('อัลบั้มเต็มแล้ว! (สูงสุด 150 ใบ) กรุณาล้างข้อมูลก่อนอัปโหลดใหม่', 'error');
            e.target.value = null;
            return;
        }

        setLoadingStatus({ active: true, current: 0, total: 'เช็คจำนวนหน้า...' });
        setUploadError(''); 

        try {
          const pdfjs = window.pdfjsLib;
          if (!pdfjs) throw new Error("โหลดระบบอ่าน PDF ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");

          let totalNewPages = 0;
          let pdfDocuments = [];
          
          for (const file of files) {
            if (!file.name.toLowerCase().endsWith('.pdf')) continue;
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjs.getDocument({ data: arrayBuffer }).promise;
            totalNewPages += pdf.numPages;
            pdfDocuments.push({ file, pdf });
          }

          if (totalNewPages === 0) {
              setUploadError('ไม่พบไฟล์ PDF ที่รองรับ กรุณาตรวจไฟล์อีกครั้งค่ะ');
              showToast('ไม่มีไฟล์ PDF', 'error');
              setLoadingStatus({ active: false, current: 0, total: 0 });
              e.target.value = null;
              return;
          }

          if (orders.length + totalNewPages > 150) {
              const overAmount = (orders.length + totalNewPages) - 150;
              showToast(`อัปโหลดไม่ได้! รวมแล้วเกิน 150 ใบ (เกินมา ${overAmount} ใบ)`, 'error');
              setLoadingStatus({ active: false, current: 0, total: 0 });
              e.target.value = null;
              return;
          }

          let allNewOrders = [];
          let currentPageCount = 0;
          
          for (const { pdf } of pdfDocuments) {
            for (let i = 1; i <= pdf.numPages; i++) {
              currentPageCount++;
              
              if (currentPageCount % 5 === 0 || currentPageCount === totalNewPages) {
                  setLoadingStatus(prev => ({ ...prev, current: currentPageCount, total: totalNewPages }));
                  await new Promise(resolve => setTimeout(resolve, 1));
              }
              
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const fullText = textContent.items.map(item => item.str).join(' ');
              const positionedItems = toPositionedPdfItems(textContent);

              const viewport = page.getViewport({ scale: 2.5 }); 
              const canvas = document.createElement('canvas');
              const context = canvas.getContext('2d');
              canvas.height = viewport.height; canvas.width = viewport.width;
              await page.render({ canvasContext: context, viewport }).promise;
              const pdfImage = canvas.toDataURL('image/jpeg', 0.9);

              let platform = 'SHOPEE';
              if (fullText.match(/Order\s*ID/i) || fullText.match(/In\s*transit/i) || fullText.match(/TikTok/i)) platform = 'TIKTOK';
              const declaredTotalQty = parseExplicitTotalQty(fullText, platform);
              let parserWarning = false;

              let zone = fullText;

              const tableStartRegex = /(?:ชื่[\s\u200B]*อ[\s\u200B]*สิ[\s\u200B]*น[\s\u200B]*ค้[\s\u200B]*า|P[\s\u200B]*r[\s\u200B]*o[\s\u200B]*d[\s\u200B]*u[\s\u200B]*c[\s\u200B]*t|#\s*ชื่[\s\u200B]*อ)/i;
              const tableStartMatch = zone.match(tableStartRegex);
              
              if (tableStartMatch) {
                  zone = zone.substring(tableStartMatch.index);
                  zone = zone.replace(/(?:ชื่[\s\u200B]*อ[\s\u200B]*สิ[\s\u200B]*น[\s\u200B]*ค้[\s\u200B]*า|P[\s\u200B]*r[\s\u200B]*o[\s\u200B]*d[\s\u200B]*u[\s\u200B]*c[\s\u200B]*t[\s\u200B]*N[\s\u200B]*a[\s\u200B]*m[\s\u200B]*e|#\s*ชื่[\s\u200B]*อ)/gi, '');
                  zone = zone.replace(/(?:ตั[\s\u200B]*ว[\s\u200B]*เ[\s\u200B]*ลื[\s\u200B]*อ[\s\u200B]*ก|จ[\s\u200B]*[ำํา]+[\s\u200B]*น[\s\u200B]*ว[\s\u200B]*น|S[\s\u200B]*K[\s\u200B]*U|S[\s\u200B]*e[\s\u200B]*l[\s\u200B]*l[\s\u200B]*e[\s\u200B]*r|Q[\s\u200B]*t[\s\u200B]*y)/gi, '');
                  
                  const footerRegex = /(?:[Ss]hopee\s*Order|[Oo]rder\s*No|[Pp]rint\s*Date|[Pp]age\s*\d|[Pp]owered\s*by|ผู้รับ\s*\(TO\)|[Tt]ikTok\s*Shop|[Oo]rder\s*ID|[Hh]opee|[Rr]der\s*No|[Rr]int\s*Date|[Aa]ge\s*\d|[Oo]wered|[Ii]kTok)/i;
                  const footerMatch = zone.match(footerRegex);
                  if (footerMatch) {
                      zone = zone.substring(0, footerMatch.index);
                  }
              }
              
              zone = zone.replace(/\b2\d{5}[A-Z0-9]{8,}\b/gi, ''); 
              zone = zone.replace(/\b12160\b/g, '');

              zone = zone.replace(/(?:ไม่ต้องเก็บเงิน|เก็บเงินปลายทาง|PICK[\s-]*UP|NDD|HOME|OFFICE|ROS|SUB|CON|LGN|DROP|Bulky)/gi, '');
              zone = zone.replace(/\b[A-Z0-9]{1,4}-\([A-Z0-9.]+\)/gi, ''); 
              zone = zone.replace(/\b[A-Z]+-[A-Z]\s+-\s+[ก-๙]+\b/gi, ''); 
              zone = zone.replace(/\b[A-Z0-9]+_[0-9]+_[A-Z0-9]+_[A-Z0-9-]+\b/gi, ''); 

              zone = zone.replace(/\b[A-Z]\d\s+[A-Z0-9]+-\d+\b/gi, ''); 
              zone = zone.replace(/\b[A-Z]\d-\([A-Z0-9.]+\)\b/gi, ''); 
              zone = zone.replace(/\b\d{3}[A-Z]\b/gi, ''); 
              zone = zone.replace(/\b\d{5}\b/g, ''); 
              zone = zone.replace(/\b0\d{8,9}\b/g, ''); 
              zone = zone.replace(/\b\d{6}[A-Z0-9]{5,}\b/gi, ''); 
              zone = zone.replace(/\b(?:TH|JT|SPX)[A-Z0-9]+\b/gi, '');
              zone = zone.replace(/\b\d{12,}\b/g, ''); 
              zone = zone.replace(/(?:บ้านเลขที่|เลขที่|หมู่ที่|หมู่|ม\.|ซอย|ซ\.|ถนน|ถ\.)\s*\d+[\/\d]*/g, '');
              zone = zone.replace(/\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/g, ''); 
              zone = zone.replace(/\d{1,2}:\d{2}/g, ''); 
              
              // 🟢 ตัดข้อความส่วนยอดรวมทิ้ง ป้องกันระบบดึงเลขผิดมาใส่ SKU
              const endOfTableRegex = /(?:จ[ำํา]นวนรวม|ยอดรวม|รวมทั้งสิ้น|Total\s*Qty|Qty\s*Total)/i;
              const endOfTableMatch = zone.match(endOfTableRegex);
              if (endOfTableMatch) {
                  zone = zone.substring(0, endOfTableMatch.index);
              }
              
              zone = zone.replace(/In\s*transit\s*by[\s:]*[\d\/:\s]+/gi, '');
              zone = zone.replace(/(?:TikTok\s*Shop|Shopee)/gi, '');

              let parsedItems = [];

              if (platform === 'TIKTOK') {
                  const tikTokResult = parseTikTokPositionedItems(positionedItems, declaredTotalQty);
                  parsedItems = tikTokResult.items;
                  parserWarning = tikTokResult.parserWarning;
              }

              if (platform === 'SHOPEE') {
                  const shopeePositionedResult = parseShopeePositionedItems(positionedItems, declaredTotalQty);
                  if (shopeePositionedResult.items.length > 0 || shopeePositionedResult.parserWarning) {
                      parsedItems = shopeePositionedResult.items;
                      parserWarning = shopeePositionedResult.parserWarning;
                  } else {
                  let remainingText = zone.trim();
                  let currentItemNum = 1;
                  
                  let isNewFormat = false;
                  let firstMarker = remainingText.match(/(?:^|\s)1\s+(\d+)(?:\s+|$)/);
                  if (firstMarker) {
                      let textAfter = remainingText.substring(firstMarker.index + firstMarker[0].length);
                      if (textAfter.trim().length < 30 || textAfter.match(/(?:^|\s)2\s+(\d+)(?:\s+|$)/)) {
                          isNewFormat = true;
                      }
                  }

                  if (isNewFormat) {
                      while (remainingText.length > 0 && currentItemNum <= 20) {
                          let regex = new RegExp(`^(.*?)(?:^|\\s)${currentItemNum}\\s+(\\d+)(?:\\s+|$)`);
                          let match = remainingText.match(regex);
                          if (match) {
                              let textWithoutQty = match[1].replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ').trim();
                              let itemQty = parseInt(match[2], 10);
                              
                              textWithoutQty = textWithoutQty.replace(/^\s*\d+([.)\]]|\s+)(?=[^\d]|$)/, '').trim();
                              
                              parsedItems.push({ text: textWithoutQty, qty: itemQty });
                              
                              remainingText = remainingText.substring(match[0].length).trim();
                              currentItemNum++;
                          } else {
                              break;
                          }
                      }
                  } else {
                      while (remainingText.length > 0 && currentItemNum <= 20) {
                          let prefixRegexStr = `(?:^|\\s)${currentItemNum}(?:\\s*[.)\\]]\\s*|\\s+|(?=\\(|\\[))`;
                          let currentPrefixRegex = new RegExp(prefixRegexStr);
                          let currentMatch = remainingText.match(currentPrefixRegex);
                          
                          if (!currentMatch) break; 
                          
                          let nextPrefixRegex = new RegExp(`(?:^|\\s)${currentItemNum + 1}(?:\\s*[.)\\]]\\s*|\\s+|(?=\\(|\\[))`); 
                          let nextMatch = remainingText.match(nextPrefixRegex);
                          
                          if (nextMatch) {
                              let textAfterNext = remainingText.substring(nextMatch.index + nextMatch[0].length).trim();
                              let cleanAfter = textAfterNext.replace(/(?:ไม่ต้องเก็บเงิน|เก็บเงินปลายทาง|PICK[\s-]*UP|NDD|HOME|OFFICE|ROS)/gi, '').replace(/\b[A-Z0-9_-]+\b/gi, '').trim();
                              if (!/[a-zA-Zก-๙]/.test(cleanAfter) || cleanAfter.length < 5) {
                                  nextMatch = null; 
                              }
                          }

                          let itemStr = '';
                          if (nextMatch) {
                              itemStr = remainingText.substring(currentMatch.index + currentMatch[0].length, nextMatch.index);
                              remainingText = remainingText.substring(nextMatch.index);
                          } else {
                              itemStr = remainingText.substring(currentMatch.index + currentMatch[0].length);
                              remainingText = '';
                          }
                          
                          let textWithoutQty = itemStr.replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ').trim();
                          textWithoutQty = textWithoutQty.replace(/^\s*\d+([.)\]]|\s+)(?=[^\d]|$)/, '').trim();

                          let itemQty = 1;
                          let endDigitsMatch = textWithoutQty.match(/(\d+)\s*(?:หมายเหตุ|PICKUP|[Nn][Ss]|[-_]+)?\s*$/i);
                          if (endDigitsMatch) {
                              let prefixIdx = endDigitsMatch.index - 1;
                              let prefixChar = prefixIdx >= 0 ? textWithoutQty.charAt(prefixIdx) : ' ';
                              
                              if (/\s|[ก-๙]|\)|\]|\}/.test(prefixChar) || prefixIdx < 0) {
                                  itemQty = parseInt(endDigitsMatch[1], 10);
                                  textWithoutQty = textWithoutQty.substring(0, endDigitsMatch.index).trim();
                              }
                          }
                          
                          parsedItems.push({ text: textWithoutQty, qty: itemQty });
                          currentItemNum++;
                      }
                  }
                  }
              }

              if (parsedItems.length === 0 && platform !== 'TIKTOK' && !parserWarning) {
                  let itemStr = zone.trim();
                  
                  let textWithoutQty = itemStr.replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ').trim();
                  textWithoutQty = textWithoutQty.replace(/^\s*\d+([.)\]]|\s+)(?=[^\d]|$)/, '').trim();
                  
                  let itemQty = 1;
                  let endDigitsMatch = textWithoutQty.match(/(\d+)\s*(?:หมายเหตุ|PICKUP|[Nn][Ss]|[-_]+)?\s*$/i);
                  if (endDigitsMatch) {
                      let prefixIdx = endDigitsMatch.index - 1;
                      let prefixChar = prefixIdx >= 0 ? textWithoutQty.charAt(prefixIdx) : ' ';
                      
                      if (/\s|[ก-๙]|\)|\]|\}/.test(prefixChar) || prefixIdx < 0) {
                          itemQty = parseInt(endDigitsMatch[1], 10);
                          textWithoutQty = textWithoutQty.substring(0, endDigitsMatch.index).trim();
                      }
                  }
                  
                  parsedItems.push({ text: textWithoutQty, qty: itemQty });
              }

              const trackingMatch = fullText.match(/(TH\d{10,}|JT\d{10,}|SPX[A-Z0-9]+|KER[A-Z0-9]+|KA[A-Z0-9]+|66\d{10,}|82\d{10,}|\b\d{12}\b)/i);
              
              let currentOrderId = null;
              let orderMatch = fullText.match(/(?:Shopee\s*Order\s*No\.?|Order\s*ID)[\s:]*([A-Z0-9]+)/i);
              if (orderMatch) {
                  currentOrderId = orderMatch[1];
              }

              if (currentOrderId) {
                  let existingOrder = allNewOrders.find(o => o.orderId === currentOrderId && !o.isContinuation);
                  if (existingOrder) {
                      if (parsedItems.length > 0) {
                          existingOrder.parsedItems.push(...parsedItems);
                      }
                      if (Number.isFinite(declaredTotalQty)) existingOrder.declaredTotalQty = declaredTotalQty;
                      existingOrder.parserWarning = Boolean(existingOrder.parserWarning || parserWarning);
                      
                      if (!existingOrder.tracking || existingOrder.tracking.startsWith('PAGE-')) {
                          existingOrder.tracking = trackingMatch ? trackingMatch[0] : existingOrder.tracking;
                      }

                      allNewOrders.push({ 
                          id: `label-${Date.now()}-${allNewOrders.length}-${i}`, 
                          tracking: trackingMatch ? trackingMatch[0] : existingOrder.tracking, 
                          parsedItems: [], 
                          pdfImage, 
                          platform,
                          orderId: currentOrderId,
                          declaredTotalQty: null,
                          parserWarning: false,
                          isContinuation: true 
                      });
                      continue; 
                  }
              }

              allNewOrders.push({ 
                  id: `label-${Date.now()}-${allNewOrders.length}-${i}`, 
                  tracking: trackingMatch ? trackingMatch[0] : `PAGE-${i}`, 
                  parsedItems: parsedItems,
                  pdfImage, 
                  platform,
                  orderId: currentOrderId,
                  declaredTotalQty,
                  parserWarning
              });
            }
          }
          
          if (allNewOrders.length > 0) {
            setOrders(prev => [...prev, ...allNewOrders]); 
            setActiveTab('preview');
            showToast(`เพิ่มข้อมูลสำเร็จ ${allNewOrders.length} ใบ`, 'success');
          }
        } catch (err) {
          console.error(err);
          let errMsg = err.message || err.toString();
          setUploadError(`ระบบขัดข้อง: ${errMsg}`);
          showToast('อ่านไฟล์ไม่สำเร็จ', 'error');
        } finally {
          setLoadingStatus({ active: false, current: 0, total: 0 });
        }
        
        e.target.value = null; 
      };

      const MappedOrders = useMemo(() => orders.map(o => {
        if (o.parsedItems.length === 0) {
            if (o.isContinuation) return { ...o, displayItems: [], originalQty: 0, qtyWarning: false };
            const failedItems = o.parserWarning ? ['⚠️ ตรวจสอบ SKU', '⚠️ ตรวจสอบ Qty'] : [];
            return { ...o, displayItems: failedItems, originalQty: 0, qtyWarning: Boolean(o.parserWarning) };
        }

        const skuMap = new Map();
        let hasUnmatched = false;
        let hasAmbiguous = false;

        o.parsedItems.forEach(item => {
            const match = getMatchResult(item.text);
            if (match.status === 'matched' && match.rule) {
                const baseName = match.rule.shortName.trim().replace(/\u00A0/g, ' ');
                const current = skuMap.get(baseName) || { qty: 0, sourceKeyword: match.rule.keyword || '' };
                skuMap.set(baseName, {
                    qty: current.qty + item.qty,
                    sourceKeyword: current.sourceKeyword || match.rule.keyword || ''
                });
            } else if (match.status === 'ambiguous') {
                hasAmbiguous = true;
            } else {
                hasUnmatched = true;
            }
        });

        const finalDisplayItems = [];
        skuMap.forEach((entry, baseName) => {
            finalDisplayItems.push(`• ${getAggregatedShortName(baseName, entry.qty, entry.sourceKeyword)}`);
        });

        if (hasAmbiguous || o.parserWarning) finalDisplayItems.push('• ⚠️ ตรวจสอบ SKU');
        if (hasUnmatched) finalDisplayItems.push('• ยังไม่ตั้งชื่อ');

        const totalQty = o.parsedItems.reduce((sum, item) => sum + (parseInt(item.qty, 10) || 0), 0);
        const qtyWarning = hasQtyWarning(o.parsedItems, o.declaredTotalQty, o.parserWarning);
        if (qtyWarning) finalDisplayItems.push('• ⚠️ ตรวจสอบ Qty');

        if (finalDisplayItems.length === 0) {
            finalDisplayItems.push('ยังไม่ตั้งชื่อ (เพิ่มกฎ SKU)');
        }
        if (finalDisplayItems.length === 1 && finalDisplayItems[0].startsWith('• ')) {
            finalDisplayItems[0] = finalDisplayItems[0].substring(2);
        }

        return { ...o, displayItems: finalDisplayItems, originalQty: totalQty, qtyWarning };
      }), [orders, getMatchResult]);

      const getReviewFlags = useCallback((order) => {
        const outputText = (order.displayItems || []).join(' ');
        const hasSkuReview = outputText.includes('ตรวจสอบ SKU');
        const hasQtyReview = Boolean(order.qtyWarning || outputText.includes('ตรวจสอบ Qty'));
        const hasUnmapped = outputText.includes('ยังไม่ตั้งชื่อ');
        return {
          hasSkuReview,
          hasQtyReview,
          hasUnmapped,
          ready: !hasSkuReview && !hasQtyReview && !hasUnmapped
        };
      }, []);

      const reviewSummary = useMemo(() => {
        return MappedOrders.reduce((summary, order) => {
          const flags = getReviewFlags(order);
          summary.total += 1;
          if (flags.ready) summary.ready += 1;
          if (flags.hasSkuReview) summary.reviewSku += 1;
          if (flags.hasQtyReview) summary.reviewQty += 1;
          if (flags.hasUnmapped) summary.unmapped += 1;
          return summary;
        }, { total: 0, ready: 0, reviewSku: 0, reviewQty: 0, unmapped: 0 });
      }, [MappedOrders, getReviewFlags]);

      const FilteredOrders = useMemo(() => {
        const query = reviewSearch.trim().toLowerCase();
        return MappedOrders.filter(order => {
          if (reviewPlatform !== 'ALL' && order.platform !== reviewPlatform) return false;

          const flags = getReviewFlags(order);
          if (reviewStatus === 'READY' && !flags.ready) return false;
          if (reviewStatus === 'REVIEW_SKU' && !flags.hasSkuReview) return false;
          if (reviewStatus === 'REVIEW_QTY' && !flags.hasQtyReview) return false;
          if (reviewStatus === 'UNMAPPED' && !flags.hasUnmapped) return false;

          if (!query) return true;
          const searchArea = [
            order.tracking,
            order.orderId,
            order.platform,
            ...(order.displayItems || []),
            ...(order.parsedItems || []).map(item => item.text)
          ].filter(Boolean).join(' ').toLowerCase();
          return searchArea.includes(query);
        });
      }, [MappedOrders, reviewSearch, reviewPlatform, reviewStatus, getReviewFlags]);

      const handleExportPDF = async () => {
        if (MappedOrders.length === 0) return;
        setExportStatus({ active: true, current: 0, total: MappedOrders.length });
        
        await new Promise(resolve => setTimeout(resolve, 100));

        try {
          if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('โหลดระบบสร้าง PDF ไม่สำเร็จ');
          if (!window.html2canvas) throw new Error('โหลดระบบจับภาพใบปะหน้าไม่สำเร็จ');

          const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: [100, 150] });
          let exportedPages = 0;

          for (let i = 0; i < MappedOrders.length; i++) {
            const order = MappedOrders[i];
            setExportStatus(prev => ({ ...prev, current: i + 1 }));

            const element = document.getElementById(`render-target-${order.id}`);
            if (!element) {
              throw new Error(`ไม่พบหน้าสำหรับ Export ลำดับ ${i + 1}: ${order.id}`);
            }

            await waitForLabelRender(element, order, thermalMode);
            const canvas = await window.html2canvas(element, { scale: 3, useCORS: true, logging: false, backgroundColor: '#ffffff' });

            if (i > 0) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.98), 'JPEG', 0, 0, 100, 150);
            exportedPages++;
          }

          if (exportedPages !== MappedOrders.length) {
            throw new Error(`Export ไม่ครบ: ได้ ${exportedPages} จาก ${MappedOrders.length} หน้า`);
          }

          pdf.save(`PackMaster_Labels_${new Date().getTime()}.pdf`);
          showToast(`ดาวน์โหลด PDF เรียบร้อย ${exportedPages} หน้า`, 'success');
        } catch (err) {
          console.error('PackMaster PDF export failed:', err);
          showToast(err.message || 'สร้างไฟล์ PDF ล้มเหลว', 'error');
        } finally {
          setExportStatus({ active: false, current: 0, total: 0 });
        }
      };

      const handleExportRules = () => {
        if (skuRules.length === 0) return showToast('ไม่มีข้อมูลให้ส่งออก', 'error');
        const blob = new Blob([JSON.stringify(skuRules, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.href = url;
        dlAnchorElem.download = `packmaster_rules_${new Date().toISOString().split('T')[0]}.json`;
        dlAnchorElem.click();
        URL.revokeObjectURL(url);
        showToast('สำรองข้อมูลสำเร็จ', 'success');
      };

      const handleImportRules = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedRules = JSON.parse(event.target.result);
            if (!Array.isArray(importedRules)) {
              showToast('รูปแบบไฟล์ไม่ถูกต้อง', 'error');
              return;
            }

            const validRules = importedRules
              .map((rule, index) => sanitizeSkuRule(rule, `import-${Date.now()}-${index}`))
              .filter(Boolean);
            const skippedCount = importedRules.length - validRules.length;

            if (validRules.length === 0) {
              showToast('ไม่พบกฎ SKU ที่ใช้งานได้', 'error');
              return;
            }

            setSkuRules(prev => {
              const merged = [...validRules, ...prev];
              const deduped = new Map();
              merged.forEach(rule => deduped.set(normalizeRuleKeyword(rule.keyword), rule));
              return Array.from(deduped.values());
            });

            if (skippedCount > 0) {
              showToast(`นำเข้า ${validRules.length} ข้อ (ข้าม ${skippedCount} ข้อที่ไม่ถูกต้อง)`, 'success');
            } else {
              showToast(`นำเข้าสำเร็จ ${validRules.length} ข้อ`, 'success');
            }
          } catch (err) {
            console.error('นำเข้ากฎ SKU ไม่สำเร็จ', err);
            showToast('ไฟล์เสียหาย', 'error');
          }
        };
        reader.readAsText(file); e.target.value = null;
      };

      const handleSubmitRule = (e) => {
        e.preventDefault(); 
        if (!newRule.keyword.trim() || !newRule.shortName.trim()) return;
        
        if (editingId) {
            setSkuRules(prev => prev.map(r => r.id === editingId ? { ...newRule, id: editingId } : r));
            setEditingId(null);
            showToast('แก้ไขกฎสำเร็จ', 'success');
        } else {
            setSkuRules([{ ...newRule, id: Date.now() }, ...skuRules]);
            showToast('เพิ่มกฎใหม่สำเร็จ', 'success');
        }
        setNewRule({ keyword: '', shortName: '' });
      };

      const handleEditClick = (rule) => {
        setNewRule({ keyword: rule.keyword, shortName: rule.shortName });
        setEditingId(rule.id);
      };

      const cancelEdit = () => {
        setNewRule({ keyword: '', shortName: '' });
        setEditingId(null);
      };

      const testResult = useMemo(() => {
        if (!testInput) return null;
        const match = getMatchResult(testInput);
        const totalQty = parseInt(testQty, 10) || 1;
        if (match.status === 'ambiguous') return '⚠️ ตรวจสอบ SKU';
        if (match.status !== 'matched' || !match.rule) return 'ไม่พบคีย์เวิร์ด';
        const baseName = match.rule.shortName.trim().replace(/\u00A0/g, ' ');
        return getAggregatedShortName(baseName, totalQty);
      }, [testInput, testQty, getMatchResult]);

      const skuFilterOptions = [
        { id: 'ALL', label: 'ทั้งหมด' },
        { id: 'HOYA', label: 'HOYA' },
        { id: 'HAKU', label: 'HAKU' },
        { id: 'BUNDLE', label: 'Bundle' },
        { id: 'COOLING', label: 'Cooling' },
        { id: 'VALUE', label: 'Value Pack' }
      ];

      const filteredSkuRules = useMemo(() => {
        const query = skuSearch.trim().toLowerCase();
        return skuRules.filter(rule => {
          const searchArea = `${rule.keyword || ''} ${rule.shortName || ''}`.toLowerCase();
          if (query && !searchArea.includes(query)) return false;
          if (skuFilter === 'HOYA' && !searchArea.includes('hoya')) return false;
          if (skuFilter === 'HAKU' && !searchArea.includes('haku')) return false;
          if (skuFilter === 'BUNDLE' && !/(แถม|free|\d+\s*\+\s*\d+)/i.test(searchArea)) return false;
          if (skuFilter === 'COOLING' && !/(cooling|คูล|เย็น)/i.test(searchArea)) return false;
          if (skuFilter === 'VALUE' && !/(value\s*pack|valuepack|แวลู|แวล)/i.test(searchArea)) return false;
          return true;
        });
      }, [skuRules, skuSearch, skuFilter]);

      return (
        <div className="min-h-screen bg-[#f8fafc] text-blue-950 font-sans relative">
          {toast.show && <Toast message={toast.message} type={toast.type} onClose={() => setToast({ ...toast, show: false })} />}
          
          {exportStatus.active && (
            <div className="fixed inset-0 bg-blue-950/20 z-[9999] flex flex-col items-center justify-center no-print backdrop-blur-sm">
                <div className="bg-white p-12 rounded-[2rem] text-center shadow-2xl border border-blue-50 min-w-[360px]">
                    <span className="text-4xl animate-spin inline-block mb-4">⏳</span>
                    <h3 className="text-2xl font-black text-blue-950 mb-2">กำลังเตรียมไฟล์ PDF</h3>
                    <p className="text-blue-600/70 font-bold text-sm mb-8">หน้า {exportStatus.current} จาก {exportStatus.total}</p>
                    <div className="w-full bg-blue-50 rounded-full h-2.5 overflow-hidden"><div className="bg-blue-900 h-full transition-all duration-300 rounded-full" style={{ width: `${(exportStatus.current / exportStatus.total) * 100}%` }}></div></div>
                </div>
            </div>
          )}

          <div className="no-print flex h-screen overflow-hidden">
            <aside className="w-72 bg-white border-r border-blue-50 flex flex-col z-20 shadow-[4px_0_24px_rgba(23,37,84,0.02)]">
              <div className="p-8 border-b border-blue-50 flex items-center gap-4">
                <div className="bg-blue-950 p-2.5 rounded-[14px] text-white text-xl shadow-md shadow-blue-900/20">📦</div>
                <div><h1 className="font-black text-2xl tracking-tight text-blue-950 leading-none">PackMaster</h1><div className="mt-1.5"><span className="text-[9px] font-black text-blue-500 uppercase tracking-widest bg-blue-50 px-2 py-0.5 rounded-md">Local-first</span></div></div>
              </div>
              <nav className="flex-1 p-5 space-y-2 mt-4">
                <button onClick={() => setActiveTab('upload')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-300 border ${activeTab === 'upload' ? 'bg-blue-50/80 border-blue-100 text-blue-900 font-bold shadow-sm' : 'border-transparent text-blue-950/60 hover:bg-slate-50 hover:text-blue-900 font-semibold'}`}><span className="text-xl">☁️</span> <span className="text-[15px]">งานแพ็ก</span></button>
                <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-300 border ${activeTab === 'settings' ? 'bg-blue-50/80 border-blue-100 text-blue-900 font-bold shadow-sm' : 'border-transparent text-blue-950/60 hover:bg-slate-50 hover:text-blue-900 font-semibold'}`}><span className="text-xl">⚙️</span> <span className="text-[15px]">คลังคำศัพท์</span></button>
                <button onClick={() => setActiveTab('preview')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-300 border ${activeTab === 'preview' ? 'bg-blue-50/80 border-blue-100 text-blue-900 font-bold shadow-sm' : 'border-transparent text-blue-950/60 hover:bg-slate-50 hover:text-blue-900 font-semibold'}`}><span className="text-xl">📄</span> <span className="text-[15px]">รีวิว & พิมพ์</span> {orders.length > 0 && <span className="ml-auto bg-blue-900 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow-sm">{orders.length}</span>}</button>
              </nav>
            </aside>

            <main className="flex-1 overflow-y-auto relative z-10">
              {activeTab === 'upload' && (
                <div className="p-12 max-w-4xl mx-auto animate-in fade-in slide-in-from-bottom-8 duration-500">
                  <div className="mb-10 text-center"><h2 className="text-4xl font-black text-blue-950 mb-4 tracking-tight">จัดเตรียมใบปะหน้า</h2><p className="text-blue-950/60 text-lg font-medium">แปลงใบแพ็คของจาก Shopee และ TikTok ให้อ่านง่ายในคลิกเดียว</p></div>
                  <div className={`bg-white p-20 rounded-[3rem] border-2 transition-all duration-300 shadow-xl shadow-blue-900/5 ${loadingStatus.active ? 'border-blue-200 bg-blue-50/30' : 'border-blue-50 hover:border-blue-100'}`}>
                    {loadingStatus.active ? (
                      <div className="flex flex-col items-center py-4"><span className="text-6xl animate-spin inline-block mb-6">⏳</span><h3 className="text-xl font-black text-blue-950 mb-2">กำลังประมวลผล PDF</h3><p className="text-blue-900/60 font-bold text-sm">อ่านข้อมูลหน้าที่ {loadingStatus.current} (รวมหลายไฟล์)</p></div>
                    ) : (
                      <div className="text-center py-4">
                        <div className="w-24 h-24 bg-blue-50/80 rounded-3xl flex items-center justify-center mx-auto mb-8 border border-blue-100/50 text-4xl shadow-sm">☁️</div>
                        <h3 className="text-2xl font-black mb-3 text-blue-950">เลือกไฟล์ PDF ของคุณตรงนี้</h3>
                        <p className="text-blue-950/50 font-semibold text-sm mb-10">รองรับการอัปโหลดหลายไฟล์พร้อมกัน (สูงสุด 150 ใบ)</p>
                        <label className="bg-blue-950 hover:bg-blue-900 text-white px-10 py-4 rounded-2xl cursor-pointer font-bold text-sm transition-all inline-flex items-center gap-3 shadow-lg shadow-blue-900/20 active:scale-95"><span>📥</span> เลือกไฟล์ PDF <input type="file" accept=".pdf" multiple className="hidden" onChange={handleFileUpload} /></label>
                        {uploadError && <div className="mt-8 p-4 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center gap-2 border border-red-100 font-bold text-sm"><span>⚠️</span> {uploadError}</div>}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeTab === 'settings' && (
                <div className="p-12 max-w-6xl mx-auto animate-in fade-in slide-in-from-bottom-8 duration-500">
                  <div className="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
                    <div><h2 className="text-4xl font-black text-blue-950 mb-3 tracking-tight">คลังคำศัพท์</h2><p className="text-blue-950/60 text-base font-semibold">ตั้งค่าการแปลงชื่อสินค้า ระบบจะบันทึกอัตโนมัติ</p></div>
                    <div className="flex gap-3">
                      <label className="bg-white border-2 border-blue-50 text-blue-950 hover:border-blue-100 hover:bg-blue-50/30 px-5 py-3 rounded-2xl text-sm font-bold cursor-pointer transition-all flex items-center gap-2 shadow-sm"><span>📤</span> นำเข้า <input type="file" accept=".json" className="hidden" onChange={handleImportRules} /></label>
                      <button onClick={handleExportRules} className="bg-white border-2 border-blue-50 text-blue-950 hover:border-blue-100 hover:bg-blue-50/30 px-5 py-3 rounded-2xl text-sm font-bold transition-all flex items-center gap-2 shadow-sm"><span>💾</span> สำรองข้อมูล</button>
                    </div>
                  </div>
                  
                  <div className={`bg-white rounded-[2.5rem] shadow-xl border-2 overflow-hidden mb-10 transition-colors ${editingId ? 'shadow-blue-500/10 border-blue-200' : 'shadow-blue-900/5 border-blue-50'}`}>
                    <div className={`p-10 border-b-2 transition-colors ${editingId ? 'bg-blue-100/50 border-blue-200' : 'bg-blue-50/20 border-blue-50'}`}>
                      <form onSubmit={handleSubmitRule} className="flex flex-col md:flex-row gap-6 items-end">
                        <div className="flex-1 w-full"><label className="block text-[11px] font-black text-blue-950/50 mb-3 uppercase tracking-widest pl-2">1. คำที่ต้องการค้นหา (Keyword)</label><input type="text" value={newRule.keyword} onChange={(e) => setNewRule({...newRule, keyword: e.target.value})} placeholder="เช่น baby Wipes 10" className="w-full border-2 border-blue-100 bg-white px-6 py-4 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-900 outline-none transition-all text-base font-bold text-blue-950" /></div>
                        <div className="flex-1 w-full"><label className="block text-[11px] font-black text-blue-950/50 mb-3 uppercase tracking-widest pl-2">2. ชื่อย่อที่ต้องการ (1 ชิ้น)</label><input type="text" value={newRule.shortName} onChange={(e) => setNewRule({...newRule, shortName: e.target.value})} placeholder="เช่น เด้งม่วง 10" className="w-full border-2 border-blue-100 bg-white px-6 py-4 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-900 outline-none transition-all text-base font-bold text-blue-950" /></div>
                        <div className="flex gap-2">
                            <button type="submit" disabled={!newRule.keyword || !newRule.shortName} className={`${editingId ? 'bg-blue-600 hover:bg-blue-700 shadow-blue-600/20' : 'bg-blue-950 hover:bg-blue-900 shadow-blue-900/20'} disabled:opacity-50 text-white px-8 py-4 rounded-2xl font-bold transition-all shadow-lg h-[60px] flex items-center gap-2 active:scale-95`}><span>{editingId ? '💾' : '➕'}</span> {editingId ? 'บันทึก' : 'เพิ่ม'}</button>
                            {editingId && <button type="button" onClick={cancelEdit} className="bg-white border-2 border-blue-100 text-blue-900 hover:bg-blue-50 px-5 py-4 rounded-2xl font-bold transition-all h-[60px] flex items-center gap-2 active:scale-95">ยกเลิก</button>}
                        </div>
                      </form>
                    </div>
                    <div className="px-8 py-5 border-b-2 border-blue-50 bg-slate-50/60">
                      <div className="flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between">
                        <div className="relative flex-1 max-w-xl">
                          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-blue-950/30">🔎</span>
                          <input type="search" value={skuSearch} onChange={(e) => setSkuSearch(e.target.value)} placeholder="ค้นหา Keyword หรือ Base SKU..." className="w-full border-2 border-blue-100 bg-white pl-11 pr-4 py-3 rounded-2xl outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-900 text-sm font-bold text-blue-950" />
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {skuFilterOptions.map(option => (
                            <button key={option.id} type="button" onClick={() => setSkuFilter(option.id)} className={`px-4 py-2 rounded-xl text-xs font-black border transition-all ${skuFilter === option.id ? 'bg-blue-950 text-white border-blue-950 shadow-sm' : 'bg-white text-blue-950/60 border-blue-100 hover:border-blue-200 hover:text-blue-900'}`}>{option.label}</button>
                          ))}
                        </div>
                      </div>
                      <div className="mt-3 text-xs font-bold text-blue-950/40">แสดง {filteredSkuRules.length} จาก {skuRules.length} กฎ</div>
                    </div>
                    <div className="max-h-[460px] overflow-y-auto">
                        <table className="w-full text-left">
                        <thead><tr className="text-blue-950/40 text-[10px] font-black uppercase tracking-widest bg-blue-50/30 border-b-2 border-blue-50"><th className="px-10 py-5">No.</th><th className="px-10 py-5">Keyword</th><th className="px-10 py-5">Base SKU</th><th className="px-10 py-5 text-right"></th></tr></thead>
                        <tbody className="divide-y-2 divide-blue-50/50">{filteredSkuRules.map((rule, idx) => (<tr key={rule.id} className={`bg-white hover:bg-blue-50/40 transition-colors group ${editingId === rule.id ? 'opacity-30' : ''}`}><td className="px-10 py-5 text-sm font-black text-blue-950/30">{idx + 1}</td><td className="px-10 py-5 font-mono text-[15px] font-bold text-blue-950/80">{rule.keyword}</td><td className="px-10 py-5"><span className="text-blue-900 font-black text-[15px] bg-blue-100/50 border border-blue-200/50 px-4 py-1.5 rounded-xl">{rule.shortName}</span></td><td className="px-10 py-5 text-right flex justify-end gap-2"><button onClick={() => handleEditClick(rule)} className="text-blue-950/30 hover:text-blue-600 hover:bg-blue-50 p-2.5 rounded-xl transition-all"><span>✏️</span></button><button onClick={() => setSkuRules(skuRules.filter(r => r.id !== rule.id))} className="text-blue-950/30 hover:text-red-500 hover:bg-red-50 p-2.5 rounded-xl transition-all"><span>🗑️</span></button></td></tr>))}
                        {filteredSkuRules.length === 0 && <tr><td colSpan="4" className="p-20 text-center text-blue-950/30 text-sm font-bold">{skuRules.length === 0 ? 'ไม่มีข้อมูลคลังคำศัพท์' : 'ไม่พบกฎที่ตรงกับการค้นหา / ตัวกรอง'}</td></tr>}
                        </tbody>
                        </table>
                    </div>
                  </div>

                  <div className="bg-white border-2 border-blue-50 p-10 rounded-[2.5rem] shadow-xl shadow-blue-900/5 relative overflow-hidden">
                    <div className="relative z-10">
                      <h3 className="text-xl font-black mb-6 flex items-center gap-3 text-blue-950"><span>🧮</span> ทดสอบระบบคำนวณยอด</h3>
                      <div className="flex flex-col md:flex-row gap-5 mb-8">
                          <input type="text" value={testInput} onChange={(e) => setTestInput(e.target.value)} placeholder="วางชื่อสินค้าเต็มๆ เพื่อทดสอบ..." className="flex-1 border-2 border-blue-100 px-6 py-4 rounded-2xl outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-900 text-base font-bold text-blue-950 placeholder:text-blue-950/30 transition-all" />
                          <div className="flex items-center gap-4 border-2 border-blue-100 px-5 py-3 rounded-2xl bg-blue-50/30"><span className="text-[11px] font-black text-blue-500 uppercase tracking-widest">QTY</span><input type="number" min="1" value={testQty} onChange={(e) => setTestQty(e.target.value)} className="w-16 bg-transparent outline-none text-blue-950 text-center text-xl font-black" /></div>
                      </div>
                      <div className="bg-blue-50/50 border-2 border-blue-100 p-8 rounded-3xl flex items-center justify-between">
                        <span className="text-blue-950/40 font-black text-[11px] uppercase tracking-widest">Result</span>
                        {testInput ? (testResult !== 'ยังไม่ตั้งชื่อ (เพิ่มกฎ SKU)' && testResult !== 'ไม่พบคีย์เวิร์ด' && testResult !== '⚠️ ตรวจสอบ SKU' ? (<div className="flex items-center gap-4"><span className="text-4xl font-black text-blue-950 tracking-tight">{testResult}</span></div>) : (<div className="flex items-center gap-2"><span className="text-sm font-bold text-red-500 bg-red-50 px-4 py-2 rounded-xl">{testResult}</span></div>)) : <span className="text-4xl font-black text-blue-950/10">-</span>}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'preview' && (
                <div className="p-12 max-w-[1400px] mx-auto animate-in fade-in slide-in-from-bottom-8 duration-500">
                  <div className="flex flex-col xl:flex-row justify-between items-center mb-12 gap-8">
                    <div className="text-center xl:text-left"><h2 className="text-4xl font-black text-blue-950 mb-2 tracking-tight">รีวิวและพิมพ์</h2><p className="text-blue-950/60 text-base font-semibold">โฟกัสเฉพาะรายการที่ต้องตรวจ • ทั้งหมด {orders.length} รายการ</p></div>
                    <div className="flex flex-wrap justify-center items-center gap-4">
                        
                       <div onClick={() => setThermalMode(!thermalMode)} className="cursor-pointer bg-white border-2 border-blue-50 hover:border-blue-100 p-1.5 rounded-2xl flex items-center gap-3 shadow-sm transition-all mr-2 select-none active:scale-95">
                           <div className={`p-2 rounded-xl transition-colors ${thermalMode ? 'bg-blue-100/50' : 'bg-gray-50'}`}>
                               <span className="text-lg">{thermalMode ? '🖨️' : '🎨'}</span>
                           </div>
                           <div className="flex flex-col pr-3">
                               <span className="text-[11px] font-black text-blue-950 uppercase tracking-tight leading-none mb-1">โหมดเครื่องปริ้น</span>
                               <span className={`text-[10px] font-bold leading-none ${thermalMode ? 'text-green-600' : 'text-blue-950/40'}`}>{thermalMode ? 'ON (แก้โลโก้หาย)' : 'OFF (สีต้นฉบับ)'}</span>
                           </div>
                       </div>

                       <div className="bg-white border-2 border-blue-50 p-1.5 rounded-2xl flex gap-1 mr-2 shadow-sm">
                         <button onClick={() => setPreviewMode('table')} className={`px-6 py-2.5 rounded-[12px] font-bold text-sm transition-all ${previewMode === 'table' ? 'bg-blue-50 text-blue-900 shadow-sm border border-blue-100' : 'text-blue-950/50 hover:text-blue-900 border border-transparent'}`}>ตารางสรุป</button>
                         <button onClick={() => setPreviewMode('labels')} className={`px-6 py-2.5 rounded-[12px] font-bold text-sm transition-all ${previewMode === 'labels' ? 'bg-blue-50 text-blue-900 shadow-sm border border-blue-100' : 'text-blue-950/50 hover:text-blue-900 border border-transparent'}`}>ใบปะหน้า</button>
                       </div>
                       <button onClick={() => { setOrders([]); showToast('ล้างข้อมูลอัลบั้มสำเร็จ'); }} disabled={orders.length === 0} className="bg-white border-2 border-blue-50 hover:bg-red-50 hover:border-red-100 hover:text-red-600 text-blue-950/60 disabled:opacity-50 px-5 py-3 rounded-2xl font-bold text-sm shadow-sm flex items-center gap-2 transition-all"><span>🔄</span> ล้างข้อมูล</button>
                       <button onClick={handleExportPDF} disabled={exportStatus.active || orders.length === 0} className="bg-white border-2 border-blue-50 hover:border-blue-100 disabled:opacity-50 text-blue-900 px-6 py-3 rounded-2xl font-bold text-sm shadow-sm flex items-center gap-2 transition-all active:scale-95"><span>📥</span> Save PDF</button>
                       <button onClick={() => window.print()} disabled={orders.length === 0} className="bg-blue-950 hover:bg-blue-900 disabled:opacity-50 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-blue-900/20 flex items-center gap-2 transition-all active:scale-95"><span>🖨️</span> พิมพ์</button>
                    </div>
                  </div>

                  {orders.length > 0 && (
                    <>
                      <div className="grid grid-cols-2 xl:grid-cols-5 gap-4 mb-5">
                        <button onClick={() => setReviewStatus('ALL')} className={`text-left p-5 rounded-2xl border-2 transition-all ${reviewStatus === 'ALL' ? 'bg-blue-950 text-white border-blue-950 shadow-lg shadow-blue-900/10' : 'bg-white border-blue-50 hover:border-blue-100'}`}>
                          <div className={`text-xs font-black ${reviewStatus === 'ALL' ? 'text-blue-100' : 'text-blue-950/40'}`}>ทั้งหมด</div><div className="text-3xl font-black mt-1">{reviewSummary.total}</div>
                        </button>
                        <button onClick={() => setReviewStatus('READY')} className={`text-left p-5 rounded-2xl border-2 transition-all ${reviewStatus === 'READY' ? 'bg-green-600 text-white border-green-600 shadow-lg shadow-green-600/10' : 'bg-white border-green-100 hover:border-green-200'}`}>
                          <div className={`text-xs font-black ${reviewStatus === 'READY' ? 'text-green-50' : 'text-green-700/60'}`}>พร้อมพิมพ์</div><div className="text-3xl font-black mt-1">{reviewSummary.ready}</div>
                        </button>
                        <button onClick={() => setReviewStatus('REVIEW_SKU')} className={`text-left p-5 rounded-2xl border-2 transition-all ${reviewStatus === 'REVIEW_SKU' ? 'bg-amber-500 text-white border-amber-500 shadow-lg shadow-amber-500/10' : 'bg-white border-amber-100 hover:border-amber-200'}`}>
