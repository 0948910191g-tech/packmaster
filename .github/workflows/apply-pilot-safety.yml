name: Apply Pilot Safety Gates

on:
  push:
    branches:
      - pilot-print-safety-exception-fix

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety helper GREEN
        run: node tests/packmaster-pilot-safety.test.mjs

      - name: Confirm UI RED before patch when missing
        run: |
          if grep -Fq '<script src="./packmaster-pilot-safety.js"></script>' index.html; then
            echo "Safety UI already patched"
          else
            if node tests/packmaster-pilot-safety-ui.test.mjs; then
              echo "Expected UI safety guard to fail before implementation" >&2
              exit 1
            else
              echo "TDD RED confirmed for Print Safety / Exception Fix UI"
            fi
          fi

      - name: Apply minimal safety UI patch
        run: node tools/patch-pilot-safety.cjs

      - name: Safety tests GREEN
        run: |
          node tests/packmaster-pilot-safety.test.mjs
          node tests/packmaster-pilot-safety-ui.test.mjs

      - name: Existing PackMaster regressions
        run: |
          node tests/packmaster-smart-matcher.test.mjs
          node tests/packmaster-batch.test.mjs
          node tests/packmaster-workspace.test.mjs
          node tests/packmaster-workspace-validation.test.mjs
          node tests/packmaster-duplicate.test.mjs
          node tests/packmaster-duplicate-sidecar.test.mjs
          node tests/packmaster-phase3b-ui.test.mjs
          node tests/packmaster-exceptions.test.mjs
          node tests/packmaster-phase3c-ui.test.mjs
          node tests/packmaster-archive.test.mjs
          node tests/packmaster-phase3d-ui.test.mjs
          node tests/packmaster-storage-health.test.mjs
          node tests/packmaster-diagnostics.test.mjs
          node tests/packmaster-performance.test.mjs
          node tests/packmaster-phase3e-ui.test.mjs
          node tests/packmaster-pilot-ready.test.mjs
          node tests/packmaster-production-smoke-workflow.test.mjs
          node tests/packmaster-guardrails.test.mjs

      - name: Frozen persistence and print invariants
        run: |
          git diff --exit-code origin/main -- packmaster-batch.js
          grep -F 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -F '{MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
          grep -F 'const DB_VERSION = 1;' packmaster-batch.js
          git diff --check

      - name: Browser runtime smoke
        run: |
          python3 -m http.server 4173 >/tmp/packmaster-safety-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium not present; static regressions passed"
            exit 0
          fi
          timeout 45s "$chrome" --headless --disable-gpu --no-sandbox --dump-dom http://127.0.0.1:4173/ > /tmp/packmaster-safety-dom.html
          grep -F 'PackMaster' /tmp/packmaster-safety-dom.html
          grep -F 'งานแพ็ก' /tmp/packmaster-safety-dom.html

      - name: Commit generated index when changed
        run: |
          if git diff --quiet; then
            echo "No generated UI changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate pilot print safety gates"
          git push
