name: Temporary Apply Matcher Safety Reset

on:
  push:
    branches:
      - agent/matcher-safety-reset-20260827
    paths:
      - .github/workflows/temp-apply-matcher-safety-reset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          ref: agent/matcher-safety-reset-20260827
          fetch-depth: 0

      - name: Apply scoped matcher patch
        run: node scripts/apply-matcher-safety-reset.mjs

      - name: Verify only matcher file changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "index.html"
          git diff --check

      - name: Smart matcher regression tests
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Keyword Assistant regression tests
        run: node --test tests/packmaster-keyword-assistant.test.mjs

      - name: Commit verified matcher patch and remove temporary tooling
        run: |
          rm scripts/apply-matcher-safety-reset.mjs
          rm .github/workflows/temp-apply-matcher-safety-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html scripts/apply-matcher-safety-reset.mjs .github/workflows/temp-apply-matcher-safety-reset.yml
          git commit -m "fix: harden matcher identity gates"
          git push origin HEAD:agent/matcher-safety-reset-20260827
