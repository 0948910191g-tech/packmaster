name: Verify Phase 3D Archive RED

on:
  push:
    branches:
      - phase3d-archive-lifecycle

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm archive test fails before implementation
        run: |
          if node tests/packmaster-archive.test.mjs; then
            echo "Expected archive test to fail before implementation" >&2
            exit 1
          else
            echo "TDD RED confirmed: archive API is missing"
          fi
