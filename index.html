        dlAnchorElem.href = url;
        dlAnchorElem.download = `packmaster_rules_${new Date().toISOString().split('T')[0]}.json`;
        dlAnchorElem.click();
        URL.revokeObjectURL(url);
        showToast('สำรองข้อมูลสำเร็จ', 'success');
      };

      const handleImportRules = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedRules = JSON.parse(event.target.result);
            if (!Array.isArray(importedRules)) {
              showToast('รูปแบบไฟล์ไม่ถูกต้อง', 'error');
              return;
            }

            const validRules = importedRules
              .map((rule, index) => sanitizeSkuRule(rule, `import-${Date.now()}-${index}`))
              .filter(Boolean);
            const skippedCount = importedRules.length - validRules.length;

            if (validRules.length === 0) {
              showToast('ไม่พบกฎ SKU ที่ใช้งานได้', 'error');
              return;
            }

            setSkuRules(prev => {
              const merged = [...validRules, ...prev];
              const deduped = new Map();
              merged.forEach(rule => deduped.set(normalizeRuleKeyword(rule.keyword), rule));
              return Array.from(deduped.values());
            });

            if (skippedCount > 0) {
              showToast(`นำเข้า ${validRules.length} ข้อ (ข้าม ${skippedCount} ข้อที่ไม่ถูกต้อง)`, 'success');
            } else {
              showToast(`นำเข้าสำเร็จ ${validRules.length} ข้อ`, 'success');

            console.error('นำเข้ากฎ SKU ไม่สำเร็จ', err);
            showToast('ไฟล์เสียหาย', 'error');

        };
        reader.readAsText(file); e.target.value = null;

      const handleSubmitRule = (e) => {
        e.preventDefault(); 
        if (!newRule.keyword.trim() || !newRule.shortName.trim()) return;
        
        if (editingId) {
            setSkuRules(prev => prev.map(r => r.id === editingId ? { ...newRule, id: editingId } : r));

      const testResult = useMemo(() => {
        if (!testInput) return null;
        const match = getMatchResult(testInput);
        const totalQty = parseInt(testQty, 10) || 1;
        if (match.status === 'ambiguous') return '⚠️ ตรวจสอบ SKU';
        if (match.status !== 'matched' || !match.rule) return 'ไม่พบคีย์เวิร์ด';
        const baseName = match.rule.shortName.trim().replace(/\u00A0/g, ' ');
        return getAggregatedShortName(baseName, totalQty);
      }, [testInput, testQty, getMatchResult]);

      const skuFilterOptions = [
        { id: 'ALL', label: 'ทั้งหมด' },
        { id: 'HOYA', label: 'HOYA' },
        { id: 'HAKU', label: 'HAKU' },
        { id: 'BUNDLE', label: 'Bundle' },
        { id: 'COOLING', label: 'Cooling' },
        { id: 'VALUE', label: 'Value Pack' }
      ];

      const filteredSkuRules = useMemo(() => {
        const query = skuSearch.trim().toLowerCase();
        return skuRules.filter(rule => {
          const searchArea = `${rule.keyword || ''} ${rule.shortName || ''}`.toLowerCase();
          if (query && !searchArea.includes(query)) return false;
          if (skuFilter === 'HOYA' && !searchArea.includes('hoya')) return false;
          if (skuFilter === 'HAKU' && !searchArea.includes('haku')) return false;
          if (skuFilter === 'BUNDLE' && !/(แถม|free|\d+\s*\+\s*\d+)/i.test(searchArea)) return false;
          if (skuFilter === 'COOLING' && !/(cooling|คูล|เย็น)/i.test(searchArea)) return false;
          if (skuFilter === 'VALUE' && !/(value\s*pack|valuepack|แวลู|แวล)/i.test(searchArea)) return false;
          return true;
        });
      }, [skuRules, skuSearch, skuFilter]);

      const sortedSkuRules = useMemo(() => {
        const rows = [...filteredSkuRules];
        return rows.sort((a, b) => {
          if (skuSort === 'internal') return String(a.shortName || '').localeCompare(String(b.shortName || ''), 'th');
          return String(a.keyword || '').localeCompare(String(b.keyword || ''), 'th');
        });
      }, [filteredSkuRules, skuSort]);
      const skuPageCount = Math.max(1, Math.ceil(sortedSkuRules.length / skuPageSize));
      const visibleSkuRules = sortedSkuRules.slice((skuPage - 1) * skuPageSize, skuPage * skuPageSize);

      const reviewPageCount = Math.max(1, Math.ceil(FilteredOrders.length / reviewPageSize));
      const visibleReviewOrders = FilteredOrders.slice((reviewPage - 1) * reviewPageSize, reviewPage * reviewPageSize);
      useEffect(() => { setSkuPage(1); }, [skuSearch, skuFilter, skuSort]);
      useEffect(() => { setReviewPage(1); }, [reviewSearch, reviewPlatform, reviewStatus, previewMode, activeBatchId]);
      useEffect(() => { if (skuPage > skuPageCount) setSkuPage(skuPageCount); }, [skuPage, skuPageCount]);
      useEffect(() => { if (reviewPage > reviewPageCount) setReviewPage(reviewPageCount); }, [reviewPage, reviewPageCount]);

      const activeBatchRows = batches.filter(batch => !getBatchArchivedAt(batch));
      const batchDashboard = activeBatchRows.reduce((acc, batch) => {
        acc.orders += Number(batch.totalOrders) || 0;
        acc.ready += Number(batch.readyCount) || 0;
        acc.review += (Number(batch.reviewSkuCount) || 0) + (Number(batch.reviewQtyCount) || 0) + (Number(batch.unmappedCount) || 0);
        return acc;
      }, { batchCount: activeBatchRows.length, orders: 0, ready: 0, review: 0 });

      const uploadStep = !activeBatchId ? 1 : loadingStatus.active ? 3 : orders.length === 0 ? 2 : exceptionRows.length > 0 ? 4 : 5;

                      </div>

                      <div className="pm-card p-5">
                        <div className="flex items-start gap-3"><div className="pm-feature-icon"><PMIcon name="storage"/></div><div className="flex-1"><div className="pm-section-kicker">Browser Storage</div><h3 className="text-base font-black text-slate-900">Storage Health</h3><p className="text-xs font-semibold text-slate-400 mt-1">ตรวจการใช้พื้นที่แบบ Local และล้างเฉพาะภาพ Reprint ของ Archived Batch ที่เลือก</p></div></div>
                        <div className="mt-5 p-4 rounded-xl bg-slate-50 border border-slate-200">{storageHealth.supported===true?<><div className="flex items-end justify-between gap-3"><div><div className="text-[10px] font-black text-slate-400 uppercase">Used</div><div className="text-2xl font-black text-slate-900">{storageHealthApi?storageHealthApi.formatBytes(storageHealth.usage):'-'}</div></div><div className="text-xs font-black text-slate-500">{storageHealth.percent==null?'-':storageHealth.percent}% / {storageHealthApi?storageHealthApi.formatBytes(storageHealth.quota):'-'}</div></div><div className="h-2 bg-white rounded-full overflow-hidden mt-3"><div className={`h-full ${Number(storageHealth.percent)>80?'bg-red-500':Number(storageHealth.percent)>60?'bg-amber-400':'bg-blue-500'}`} style={{width:`${Math.min(100,Number(storageHealth.percent)||0)}%`}}></div></div></>:storageHealth.supported===false?<div className="text-xs font-bold text-slate-500">Browser นี้ไม่รายงาน Storage quota แต่ PackMaster ยังใช้งาน Local ได้</div>:<div className="text-xs font-bold text-slate-400">กำลังอ่านพื้นที่...</div>}</div>
                        <div className="flex flex-wrap gap-2 mt-4"><button onClick={refreshStorageHealth} disabled={storageHealthBusy} className="pm-secondary-btn"><PMIcon name="refresh"/> รีเฟรชพื้นที่</button>{selectedArchivedBatchIds.length>0?<button onClick={handleCleanupReprintImages} disabled={storageHealthBusy} className="pm-warning-btn">ล้างรูป Reprint ({selectedArchivedBatchIds.length})</button>:<button onClick={()=>{setBatchViewFilter('ARCHIVED');navigateView('batches');}} className="pm-ghost-btn">เลือก Archived Batch ก่อน Cleanup</button>}</div>
                      </div>

                      <div className="pm-card p-5 xl:col-span-2">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4"><div className="flex items-start gap-3"><div className="pm-feature-icon"><PMIcon name="activity"/></div><div><div className="pm-section-kicker">Pilot Diagnostics</div><h3 className="text-base font-black text-slate-900">Diagnostics แบบไม่รวมข้อมูลลูกค้า</h3><p className="text-xs font-semibold text-slate-400 mt-1">Export เฉพาะข้อมูล aggregate / capabilities สำหรับตรวจ Pilot และ Browser health</p></div></div><div className="flex gap-2"><button onClick={()=>handleDownloadDiagnostics('json')} className="pm-secondary-btn"><PMIcon name="download"/> JSON</button><button onClick={()=>handleDownloadDiagnostics('csv')} className="pm-secondary-btn"><PMIcon name="download"/> CSV</button></div></div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-5"><div className="pm-mini-stat"><span>Version</span><strong className="!text-sm">{PILOT_VERSION}</strong></div><div className="pm-mini-stat"><span>IndexedDB</span><strong className="!text-sm">{window.indexedDB?'พร้อม':'ไม่พร้อม'}</strong></div><div className="pm-mini-stat"><span>WebCrypto</span><strong className="!text-sm">{window.crypto&&window.crypto.subtle?'พร้อม':'ไม่พร้อม'}</strong></div><div className="pm-mini-stat"><span>Archived</span><strong>{archivedBatchCount}</strong></div></div>
                      </div>
                    </div>
                  </section>
                )}
              </main>
            </div>
          </div>


          <div className="fixed pointer-events-none opacity-0" style={{ top: 0, left: 0, width: '100mm', height: 0, overflow: 'hidden', zIndex: -100 }}>
            {MappedOrders.map((order) => (
              <div key={`render-arena-${order.id}`} id={`render-target-${order.id}`} style={{ position: 'relative', width: '100mm', height: '150mm', backgroundColor: 'white' }}>
                <LabelCard order={order} thermalMode={thermalMode} isExport={true} />
              </div>
            ))}
          </div>
          <div className="hidden print-area w-full text-black">
            {MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`} order={order} thermalMode={thermalMode} isExport={true} />))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
