name: Verify Frontend Usability Production

on:
  push:
    branches:
      - verify-frontend-usability-production
    paths:
      - .github/workflows/verify-frontend-usability-production.yml

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-frontend-usability-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for live usability build
        run: |
          set -euo pipefail
          URL='https://0948910191g-tech.github.io/packmaster/'
          for attempt in $(seq 1 24); do
            html="$(curl -fsSL --max-time 20 "${URL}?usability=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'data-pm-active-batch-bar' <<< "$html" \
              && grep -Fq 'data-pm-exception-mode' <<< "$html" \
              && grep -Fq 'data-pm-review-action-bar' <<< "$html" \
              && grep -Fq 'data-pm-quick-mapping' <<< "$html" \
              && grep -Fq 'data-pm-primary-nav' <<< "$html" \
              && grep -Fq 'เริ่มงานแพ็กใหม่' <<< "$html"; then
              echo 'Live Frontend usability assets are ready'
              exit 0
            fi
            sleep 10
          done
          echo 'Live Frontend usability build did not appear in time' >&2
          exit 1

      - name: Verify live frozen Batch adapter
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://0948910191g-tech.github.io/packmaster/packmaster-batch.js?verify=979b867' -o /tmp/live-packmaster-batch.js
          test "$(git hash-object /tmp/live-packmaster-batch.js)" = '941bddd557803aa27e58bd23372b9f51d6ca1605'

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Exercise live pre-pilot usability workflow
        run: |
          cat > verify-frontend-usability-production.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1536, height: 820 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          const url = 'https://0948910191g-tech.github.io/packmaster/?verify-usability=979b867';
          await page.goto(url, { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });

          // Fresh isolated browser context: clean local test data and start a real Batch through the UI.
          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            if (!api) throw new Error('PackMasterBatch unavailable');
            for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.removeItem('skuMappingRules');
          });
          await page.reload({ waitUntil: 'networkidle' });
          await page.locator('[data-pm-action="create-batch"]').click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });
          await page.locator('[data-pm-active-batch-bar]').waitFor({ state: 'visible' });

          // Seed sanitized synthetic workflow data through the existing local Batch API.
          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            const batches = await api.listBatches();
            const batch = batches[0];
            if (!batch) throw new Error('Created Batch not found');
            localStorage.setItem('skuMappingRules', JSON.stringify([
              { id: 'live-known', keyword: 'LIVE KNOWN SKU', shortName: 'เด้งม่วง5' }
            ]));
            const image = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200"><rect width="100%" height="100%" fill="white"/><text x="50" y="100" font-size="44">PACKMASTER LIVE PILOT</text></svg>');
            // Deliberately put Unmapped before Qty so Exception Mode priority is tested.
            const orders = [
              { id:'live-unmapped', tracking:'LIVE-UNMAPPED-0001', orderId:'LIVEUNMAPPEDORDER1', platform:'SHOPEE', parsedItems:[{text:'LIVE SAFE NEW SKU',qty:1}], declaredTotalQty:1, parserWarning:false, pdfImage:image },
              { id:'live-ready', tracking:'LIVE-READY-0001', orderId:'LIVEREADYORDER1', platform:'SHOPEE', parsedItems:[{text:'LIVE KNOWN SKU',qty:1}], declaredTotalQty:1, parserWarning:false, pdfImage:image },
              { id:'live-qty', tracking:'LIVE-QTY-0001', orderId:'LIVEQTYORDER1', platform:'TIKTOK', parsedItems:[{text:'LIVE KNOWN SKU',qty:1}], declaredTotalQty:2, parserWarning:false, pdfImage:image }
            ];
            const meta = api.buildBatchMeta(batch, { total:3, ready:1, reviewSku:0, reviewQty:1, unmapped:1 }, { now:new Date('2026-08-09T00:31:00+07:00') });
            await api.saveBatch(meta, orders);
          });

          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'เปิดงาน', exact: true }).first().click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });

          const activeBar = page.locator('[data-pm-active-batch-bar]');
          await activeBar.waitFor({ state: 'visible' });
          const exceptionCta = activeBar.locator('[data-pm-action="resolve-active-exceptions"]');
          await exceptionCta.waitFor({ state: 'visible' });
          assert((await exceptionCta.textContent()).includes('2'), 'Active Batch Bar must show two unresolved orders');

          // Exception Mode: unresolved only, priority Qty before Unmapped.
          await exceptionCta.click();
          await page.locator('[data-pm-view="review"]').waitFor({ state: 'visible' });
          await page.locator('[data-pm-exception-mode]').waitFor({ state: 'visible' });
          const cards = page.locator('[data-pm-review-preview-item]');
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 2);
          assert(await cards.count() === 2, 'Exception Mode must show only the two unresolved orders');
          await cards.nth(0).getByText('LIVE-QTY-0001', { exact: true }).waitFor();
          await cards.nth(1).getByText('LIVE-UNMAPPED-0001', { exact: true }).waitFor();
          assert(await page.getByText('LIVE-READY-0001', { exact: true }).count() === 0, 'Ready order must be hidden in Exception Mode');

          // Persistent action bar must stay viewport-fixed during a long Review scroll.
          const actionWrap = page.locator('.pm-review-action-wrap');
          await actionWrap.waitFor({ state: 'visible' });
          assert(await actionWrap.evaluate(el => getComputedStyle(el).position) === 'fixed', 'Review action wrapper must compute as fixed');
          const before = await actionWrap.boundingBox();
          await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
          await page.waitForTimeout(150);
          const after = await actionWrap.boundingBox();
          assert(before && after && Math.abs(before.y - after.y) < 4, `Fixed Review action bar moved with document: ${before?.y} -> ${after?.y}`);
          await page.evaluate(() => window.scrollTo(0, 0));

          // Exception Inbox real type filter wiring.
          const exceptionInbox = page.locator('.pm-card').filter({ hasText: 'รายการที่ต้องตรวจ' }).first();
          const exceptionSelect = exceptionInbox.locator('select').first();
          await exceptionSelect.selectOption('REVIEW_QTY');
          await exceptionInbox.getByText('1 รายการที่ต้องตัดสินใจ', { exact: true }).waitFor();
          await exceptionSelect.selectOption('REVIEW_SKU');
          await exceptionInbox.getByText('0 รายการที่ต้องตัดสินใจ', { exact: true }).waitFor();
          await exceptionSelect.selectOption('ALL');
          await exceptionInbox.getByText('2 รายการที่ต้องตัดสินใจ', { exact: true }).waitFor();

          // Inline Quick Mapping: safe seed only, no guessed internal name.
          const unmappedCard = cards.filter({ hasText: 'LIVE-UNMAPPED-0001' });
          await unmappedCard.getByRole('button', { name: 'ตั้งชื่อ SKU', exact: true }).click();
          const quickMap = page.locator('[data-pm-quick-mapping]');
          await quickMap.waitFor({ state: 'visible' });
          const keywordInput = quickMap.locator('input').nth(0);
          const shortInput = quickMap.getByPlaceholder('เช่น เด้งม่วง5');
          assert((await keywordInput.inputValue()).includes('LIVE SAFE NEW SKU'), 'Quick Mapping must use safe unresolved product identity');
          assert(await shortInput.inputValue() === '', 'Quick Mapping must never guess the internal short name');
          const saveButton = quickMap.getByRole('button', { name: 'บันทึกและใช้', exact: true });
          assert(await saveButton.isDisabled(), 'Quick Mapping save must remain disabled until an internal name is explicitly entered');
          await shortInput.fill('เด้งเขียว7');
          await saveButton.click();
          await quickMap.waitFor({ state: 'hidden' });
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 1);
          await cards.first().getByText('LIVE-QTY-0001', { exact: true }).waitFor();

          // Remaining Qty exception keeps full-Batch Print/Save locked.
          assert(await page.locator('[data-pm-action="print"]').isDisabled(), 'Print must remain locked while Qty exception exists');
          assert(await page.locator('[data-pm-action="save-pdf"]').isDisabled(), 'Save PDF must remain locked while Qty exception exists');
          const sticky = page.locator('[data-pm-review-action-bar]');
          assert((await sticky.textContent()).includes('ต้องตรวจ 1'), 'Persistent Review action bar must show the remaining Qty exception');

          // Exit Exception Mode and confirm full Review overview returns.
          await page.getByRole('button', { name: 'ออกจากโหมดตรวจปัญหา', exact: true }).click();
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 3);
          assert(await cards.count() === 3, 'Normal Review must restore all three orders');

          // Simplified primary nav = three workspaces; Upload/Safety remain reachable as secondary tools.
          const primaryNav = page.locator('[data-pm-primary-nav]');
          assert(await primaryNav.locator('button').count() === 3, 'Primary sidebar must contain exactly three workspace buttons');
          const secondaryNav = page.locator('[data-pm-secondary-nav]');
          await secondaryNav.getByRole('button', { name: 'อัปโหลดไฟล์', exact: true }).click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });
          await secondaryNav.getByRole('button', { name: 'เครื่องมือ / ความปลอดภัย', exact: true }).click();
          await page.locator('[data-pm-view="safety"]').waitFor({ state: 'visible' });

          // Persistence through reload uses existing local storage/IndexedDB pathways.
          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'เปิดงาน', exact: true }).first().click();
          await page.getByRole('button', { name: 'รีวิว & พิมพ์', exact: true }).first().click();
          await page.locator('[data-pm-view="review"]').waitFor({ state: 'visible' });
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 3);
          assert(await page.getByText('เด้งเขียว7', { exact: true }).count() >= 1, 'Quick Mapping rule must persist through reload via existing SKU storage');

          assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
          const relevantConsoleErrors = consoleErrors.filter(text => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(text));
          assert(relevantConsoleErrors.length === 0, `Console errors: ${relevantConsoleErrors.join(' | ')}`);

          // Clean isolated synthetic browser-local test data.
          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.removeItem('skuMappingRules');
          });
          await browser.close();
          console.log('PackMaster live Frontend usability Chromium verification passed');
          JS
          node verify-frontend-usability-production.mjs

      - name: Verify production source safety markers
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 'https://0948910191g-tech.github.io/packmaster/?verify-source=979b867')"
          grep -Fq 'for (let i = 0; i < MappedOrders.length; i++)' <<< "$html"
          grep -Fq 'MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' <<< "$html"
