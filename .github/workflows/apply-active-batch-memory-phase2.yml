name: Apply Active Batch Memory Phase 2

on:
  push:
    branches:
      - perf/active-batch-memory-phase2-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/active-batch-memory-phase2-20260811
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded production patch
        run: python tools/apply-active-batch-memory-phase2.py

      - name: Verify new memory guards
        run: |
          node tests/packmaster-pdf-import-memory.test.mjs
          node tests/packmaster-active-preview-memory.test.mjs

      - name: Verify related regression guards
        run: |
          node tests/packmaster-batch-memory-hardening.test.mjs
          node tests/packmaster-full-review-preview.test.mjs
          node tests/packmaster-guardrails.test.mjs

      - name: Commit production patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "perf: reduce Active Batch and PDF import memory"
          git push origin HEAD:perf/active-batch-memory-phase2-20260811
