name: Verify Collapsible Sidebar

on:
  push:
    branches:
      - frontend-collapsible-sidebar
    paths:
      - .github/workflows/verify-collapsible-sidebar.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-collapsible-sidebar

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Serve branch app
        run: |
          python3 -m http.server 4173 >/tmp/packmaster-sidebar-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/packmaster-sidebar-server.log
          exit 1

      - name: Exercise desktop and mobile sidebar
        run: |
          cat > verify-collapsible-sidebar.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1536, height: 820 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const near = (value, target, tolerance = 4) => Math.abs(value - target) <= tolerance;

          await page.goto('http://127.0.0.1:4173/?sidebar-branch=1', { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.evaluate(() => localStorage.removeItem('packmasterSidebarCollapsedV1'));
          await page.reload({ waitUntil: 'networkidle' });

          const sidebar = page.locator('[data-pm-sidebar]');
          const main = page.locator('.pm-main');
          const toggle = page.locator('[data-pm-sidebar-toggle]');
          const expandedBox = await sidebar.boundingBox();
          const mainBefore = await main.boundingBox();
          assert(expandedBox && near(expandedBox.width, 205), `Expected expanded sidebar ~205px, got ${expandedBox?.width}`);
          assert(await toggle.getAttribute('aria-expanded') === 'true', 'Expanded sidebar toggle must report aria-expanded=true');

          await toggle.click();
          await page.waitForTimeout(250);
          const collapsedBox = await sidebar.boundingBox();
          const mainAfter = await main.boundingBox();
          assert(collapsedBox && near(collapsedBox.width, 68), `Expected collapsed sidebar ~68px, got ${collapsedBox?.width}`);
          assert(mainBefore && mainAfter && mainAfter.width > mainBefore.width + 120, `Main workspace did not regain meaningful width: ${mainBefore?.width} -> ${mainAfter?.width}`);
          assert(await page.evaluate(() => localStorage.getItem('packmasterSidebarCollapsedV1')) === '1', 'Collapsed preference must persist as 1');
          const batchNav = sidebar.getByRole('button', { name: 'งานแพ็ก', exact: true });
          assert(await batchNav.getAttribute('title') === 'งานแพ็ก', 'Collapsed primary nav needs hover title');
          assert(await batchNav.isVisible(), 'Collapsed primary nav must remain visible/clickable');

          await page.reload({ waitUntil: 'networkidle' });
          await page.waitForTimeout(100);
          const persistedBox = await sidebar.boundingBox();
          assert(persistedBox && near(persistedBox.width, 68), `Reload must restore collapsed width, got ${persistedBox?.width}`);
          await toggle.click();
          await page.waitForTimeout(250);
          const reexpandedBox = await sidebar.boundingBox();
          assert(reexpandedBox && near(reexpandedBox.width, 205), `Expand must restore ~205px, got ${reexpandedBox?.width}`);
          assert(await page.evaluate(() => localStorage.getItem('packmasterSidebarCollapsedV1')) === '0', 'Expanded preference must persist as 0');

          // Existing navigation remains real.
          await sidebar.getByRole('button', { name: 'คลังคำศัพท์', exact: true }).click();
          await page.locator('[data-pm-view="sku"]').waitFor({ state: 'visible' });
          await sidebar.getByRole('button', { name: 'งานแพ็ก', exact: true }).click();
          await page.locator('[data-pm-view="batches"]').waitFor({ state: 'visible' });

          // Create an empty real local Batch, then verify Review fixed action bar did not regress.
          await page.locator('[data-pm-action="create-batch"]').click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });
          await sidebar.getByRole('button', { name: 'รีวิว & พิมพ์', exact: true }).click();
          await page.locator('[data-pm-view="review"]').waitFor({ state: 'visible' });
          const reviewAction = page.locator('.pm-review-action-wrap');
          if (await reviewAction.count()) {
            assert(await reviewAction.evaluate(el => getComputedStyle(el).position) === 'fixed', 'Review action bar must remain fixed');
          }

          // Persist collapsed desktop preference, then verify mobile still uses a full-width drawer.
          await page.evaluate(() => localStorage.setItem('packmasterSidebarCollapsedV1', '1'));
          await page.setViewportSize({ width: 390, height: 844 });
          await page.reload({ waitUntil: 'networkidle' });
          const mobileMenu = page.locator('[data-pm-mobile-menu]');
          await mobileMenu.waitFor({ state: 'visible' });
          let mobileBox = await sidebar.boundingBox();
          assert(mobileBox && mobileBox.width >= 200 && mobileBox.x < -100, `Mobile sidebar must start off-canvas at full drawer width, got ${JSON.stringify(mobileBox)}`);
          assert(await mobileMenu.getAttribute('aria-expanded') === 'false', 'Closed mobile menu must report aria-expanded=false');

          await mobileMenu.click();
          await page.waitForTimeout(220);
          mobileBox = await sidebar.boundingBox();
          assert(mobileBox && near(mobileBox.width, 205, 5) && mobileBox.x >= -2, `Mobile drawer must open at ~205px, got ${JSON.stringify(mobileBox)}`);
          assert(await mobileMenu.getAttribute('aria-expanded') === 'true', 'Open mobile menu must report aria-expanded=true');
          assert(await sidebar.locator('.pm-nav-label').first().isVisible(), 'Collapsed desktop preference must not hide mobile drawer labels');
          const backdrop = page.locator('[data-pm-sidebar-backdrop]');
          await backdrop.waitFor({ state: 'visible' });
          await backdrop.click({ position: { x: 380, y: 300 } });
          await page.waitForTimeout(220);
          mobileBox = await sidebar.boundingBox();
          assert(mobileBox && mobileBox.x < -100, 'Backdrop must close mobile drawer');

          await mobileMenu.click();
          await page.waitForTimeout(180);
          await sidebar.getByRole('button', { name: 'คลังคำศัพท์', exact: true }).click();
          await page.locator('[data-pm-view="sku"]').waitFor({ state: 'visible' });
          await page.waitForTimeout(180);
          mobileBox = await sidebar.boundingBox();
          assert(mobileBox && mobileBox.x < -100, 'Selecting a mobile navigation item must close the drawer');

          await mobileMenu.click();
          await page.waitForTimeout(180);
          await page.keyboard.press('Escape');
          await page.waitForTimeout(180);
          mobileBox = await sidebar.boundingBox();
          assert(mobileBox && mobileBox.x < -100, 'Escape must close the mobile drawer');
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
          assert(overflow <= 2, `Sidebar must not create horizontal document overflow on mobile: ${overflow}px`);

          assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
          const relevantConsoleErrors = consoleErrors.filter(text => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(text));
          assert(relevantConsoleErrors.length === 0, `Console errors: ${relevantConsoleErrors.join(' | ')}`);

          // Clean only synthetic browser-local data created by this smoke.
          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            if (api) for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.removeItem('packmasterSidebarCollapsedV1');
          });
          await browser.close();
          console.log('PackMaster collapsible sidebar Chromium verification passed');
          JS
          node verify-collapsible-sidebar.mjs

      - name: Verify frozen core scope
        run: |
          set -euo pipefail
          test "$(git hash-object packmaster-batch.js)" = '941bddd557803aa27e58bd23372b9f51d6ca1605'
          grep -Fq 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -Fq 'MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
