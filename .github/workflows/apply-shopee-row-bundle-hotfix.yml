name: Apply Shopee Row Bundle Hotfix

on:
  push:
    branches:
      - hotfix/shopee-row-isolation-bundle
    paths:
      - scripts/apply-shopee-row-bundle-hotfix.py
      - .github/workflows/apply-shopee-row-bundle-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/shopee-row-isolation-bundle
      - name: Apply hotfix patch
        run: python3 scripts/apply-shopee-row-bundle-hotfix.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Run regression tests before commit
        run: node tests/packmaster-smart-matcher.test.mjs
      - name: Commit patched index
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: isolate Shopee rows and aggregate bundle quantities"
          git push origin HEAD:hotfix/shopee-row-isolation-bundle
