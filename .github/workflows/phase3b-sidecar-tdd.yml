name: PackMaster Phase 3B Sidecar TDD

on:
  push:
    branches:
      - phase3b-sidecar-guardrail

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Duplicate sidecar guard test
        run: node tests/packmaster-duplicate-sidecar.test.mjs

      - name: Existing duplicate tests
        if: always()
        run: node tests/packmaster-duplicate.test.mjs

      - name: Existing exception tests
        if: always()
        run: node tests/packmaster-exceptions.test.mjs

      - name: Existing workspace tests
        if: always()
        run: |
          node tests/packmaster-workspace.test.mjs
          node tests/packmaster-workspace-validation.test.mjs

      - name: Existing core regressions
        if: always()
        run: |
          node tests/packmaster-batch.test.mjs
          node tests/packmaster-smart-matcher.test.mjs
