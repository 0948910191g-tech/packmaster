name: Show All Full Previews Branch Test

on:
  push:
    branches:
      - fix-review-show-all-full-previews

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/packmaster-full-review-preview.test.mjs
