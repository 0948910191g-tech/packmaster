name: PackMaster Regression Tests

on:
  push:
    branches:
      - main
      - agent/smart-matcher
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production smoke workflow contract first
        run: node tests/packmaster-production-smoke-workflow.test.mjs

      - name: Print override UI contract
        run: node tests/packmaster-print-override-ui.test.mjs

      - name: Smart matcher regression tests
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Local batch regression tests
        run: node tests/packmaster-batch.test.mjs

      - name: Batch source filename summary contract
        run: node --test tests/packmaster-batch-source-files.test.mjs

      - name: Workspace backup restore regression tests
        run: node tests/packmaster-workspace.test.mjs

      - name: Workspace strict validation tests
        run: node tests/packmaster-workspace-validation.test.mjs

      - name: Duplicate detection regression tests
        run: node tests/packmaster-duplicate.test.mjs

      - name: Duplicate sidecar guard
        run: node tests/packmaster-duplicate-sidecar.test.mjs

      - name: Duplicate upload UI guard
        run: node tests/packmaster-phase3b-ui.test.mjs

      - name: Exception Inbox regression tests
        run: node tests/packmaster-exceptions.test.mjs

      - name: Review acknowledgement status contract
        run: node --test tests/packmaster-review-acknowledgement-status.test.mjs

      - name: Exception Inbox UI guard
        run: node tests/packmaster-phase3c-ui.test.mjs

      - name: Batch archive lifecycle tests
        run: node tests/packmaster-archive.test.mjs

      - name: Batch archive UI guard
        run: node tests/packmaster-phase3d-ui.test.mjs

      - name: Storage health regression tests
        run: node tests/packmaster-storage-health.test.mjs

      - name: Diagnostics privacy tests
        run: node tests/packmaster-diagnostics.test.mjs

      - name: Synthetic high-volume performance guard
        run: node tests/packmaster-performance.test.mjs

      - name: Pilot hardening UI guard
        run: node tests/packmaster-phase3e-ui.test.mjs

      - name: Pilot readiness package guard
        run: node tests/packmaster-pilot-ready.test.mjs

      - name: Pilot print safety behavior tests
        run: node tests/packmaster-pilot-safety.test.mjs

      - name: Pilot print safety UI guard
        run: node tests/packmaster-pilot-safety-ui.test.mjs

      - name: Frontend V3 operational UI guard
        run: node tests/packmaster-frontend-v3-ui.test.mjs

      - name: Full review preview UI guard
        run: node tests/packmaster-full-review-preview.test.mjs

      - name: Active Batch context usability guard
        run: node tests/packmaster-active-batch-context.test.mjs

      - name: Review Exception Mode usability guard
        run: node tests/packmaster-review-exception-mode.test.mjs

      - name: Review Quick Mapping usability guard
        run: node tests/packmaster-review-quick-mapping.test.mjs

      - name: Review per-order override contract
        run: node --test tests/packmaster-review-overrides.test.mjs

      - name: Review confirmation contract
        run: node --test tests/packmaster-review-confirmation.test.mjs

      - name: Print scope contract
        run: node --test tests/packmaster-print-scope.test.mjs

      - name: Source reference contract
        run: node tests/packmaster-source-reference.test.mjs

      - name: Keyword Assistant helper guard
        run: node --test tests/packmaster-keyword-assistant.test.mjs

      - name: Review Keyword recommendation contract
        run: node --test tests/packmaster-review-keyword-suggestions.test.mjs

      - name: Keyword Assistant Quick Mapping UI guard
        run: node --test tests/packmaster-keyword-assistant-ui.test.mjs

      - name: Simplified navigation usability guard
        run: node tests/packmaster-navigation-usability.test.mjs

      - name: Collapsible sidebar UI guard
        run: node tests/packmaster-collapsible-sidebar.test.mjs

      - name: Layout V4 no-overlap guard
        run: node tests/packmaster-layout-v4.test.mjs

      - name: Existing guardrail tests when present
        run: |
          if [ -f tests/packmaster-guardrails.test.mjs ]; then
            node tests/packmaster-guardrails.test.mjs
          else
            echo "Guardrail test file is not on this branch yet"
          fi

      - name: Check whitespace errors
        run: git diff --check
