        persistRegistryAssignmentEvidence(platform, getRegistryRowEvidence(platform, row), internalName);

      const handleSaveQuickMapping = async () => {
        const order = quickMapState.row?.order;
        const item = Number.isInteger(quickMapState.itemIndex)
          ? (order?.parsedItems || [])[quickMapState.itemIndex]
          : (order?.parsedItems || []).find(entry => String(entry.text || '').trim() === String(quickMapState.sourceText || '').trim());
        if (!item || !order) {
          showToast('ไม่พบรายการใน Order กรุณาตรวจข้อมูลจากใบจริง', 'error');
          return;
        }
        try {
          await saveRegistryAssignment(order.platform, item, quickMapState.shortName);
          showToast('ผูก Seller SKU กับชื่อภายในแล้ว', 'success');
          setQuickMapState({ open: false, row: null, keyword: '', shortName: '' });
        } catch (error) {
          showToast('ยังบันทึกชื่อถาวรไม่ได้: ' + error.message + ' • ถ้าเป็นรายการเฉพาะใบ ให้เลือกใช้กับ Order นี้', 'error');
        }
      };

      const handleLinkNewRegistrySku = async () => {
        const selectedRow = registryNamingRows[registryLinkRowIndex] || null;
        const platform = marketplaceRegistryPlatformFilter;
        const sellerSku = registryLinkSellerSku.trim();
        const shortName = registryLinkShortName.trim();
        const productId = String(selectedRow?.productId || selectedRow?.itemId || '').trim();
        if (!selectedRow || !productId || !sellerSku || !shortName) {
          showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
          return;
        }
        const existingRowSku = String(selectedRow.sellerSku || '').trim();
        const candidateSellerSku = existingRowSku || sellerSku;
        const evidence = {
          status: 'found',
          identityType: 'seller_sku',
          sellerSku,
          requestedSellerSku: sellerSku,
          candidate: {
            platform,
            sellerSku: candidateSellerSku,
            productId,
            productName: String(selectedRow.productName || selectedRow.title || '').trim(),
            modelId: selectedRow.modelId || null,
            variantName: selectedRow.variantName || null,
            linkedSellerSkus: existingRowSku ? [existingRowSku] : []
          }
        };
        try {
          await persistRegistryAssignmentEvidence(platform, evidence, shortName);
          showToast('ผูก SKU ใหม่เข้าทะเบียนสำเร็จ', 'success');
          setRegistryLinkSellerSku('');
          setRegistryLinkShortName('');
        } catch (err) {
          showToast(err.message || 'บันทึกไม่สำเร็จ', 'error');
        }
      };

      const sortBatchRows = (rows) => [...rows].sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));

      const upsertBatchMeta = (meta) => {
        if (!meta || !meta.id) return;
        setBatches(prev => sortBatchRows([meta, ...prev.filter(batch => batch.id !== meta.id)]));
      };

      const getBatchStatusUi = (status) => {
        const map = {
          WAITING: { label: 'รออัปโหลด', className: 'bg-slate-100 text-slate-600 border-slate-200' },
          READY: { label: 'พร้อมพิมพ์', className: 'bg-green-50 text-green-700 border-green-200' },
          REVIEW: { label: 'ต้องตรวจ', className: 'bg-amber-50 text-amber-700 border-amber-200' },
          COMPLETED: { label: 'พิมพ์แล้ว', className: 'bg-blue-50 text-blue-800 border-blue-200' }
        };
        return map[status] || map.WAITING;
      };

      const getEffectiveBatchStatus = (batch) => pilotSafetyApi ? pilotSafetyApi.getEffectiveBatchStatus(batch) : batch.status;

      const formatBatchUpdated = (value) => {
        if (!value) return '-';
        try {
          return new Intl.DateTimeFormat('th-TH', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(value));
        } catch (err) {
          return String(value);
        }
      };

      const saveActiveBatchSnapshot = async (overrides = {}) => {
        if (!activeBatch || !batchApi) return true;
        const updated = batchApi.buildBatchMeta(activeBatch, reviewSummary, overrides);
        upsertBatchMeta(updated);

        if (!batchStorageReady) return false;

        try {
          const storedMeta = await batchApi.saveBatch(updated, orders);
          upsertBatchMeta(storedMeta);
          return true;
        } catch (err) {
          console.error('Save active batch failed', err);
          if (cloudMode) setCloudBatchError(err.message || 'Cloud Batch save failed');
          showToast('บันทึก Batch ไม่สำเร็จ — ยังไม่สลับงานเพื่อป้องกันข้อมูลหาย', 'error');
          return false;
        }
      };

      const runBatchTransition = async (transition) => {
        if (!batchTransitionCoordinator) {
          showToast('Batch transition safety module ยังไม่พร้อม', 'error');
          return false;
        }
        const result = await batchTransitionCoordinator.run({
          hasCurrent: Boolean(activeBatchId),
          saveCurrent: saveActiveBatchSnapshot,
          transition
        });
        if (!result.ok && result.reason === 'busy') showToast('กำลังบันทึก/สลับ Batch อยู่ กรุณารอให้รายการปัจจุบันเสร็จก่อน', 'error');
        return result.ok;
      };

      const handleCreateBatch = async () => {
        if (!batchApi) {
          showToast('Local Batch module ยังไม่พร้อม', 'error');
          return;
        }

        const nextBatch = batchApi.createBatchMeta(batches, new Date());
        setBatchLoading(true);

        try {
          await runBatchTransition(async () => {
            if (batchStorageReady) {
              await batchApi.saveBatch(nextBatch, []);
            } else {
              showToast('สร้าง Batch แบบ Session ชั่วคราว — Browser storage ยังไม่พร้อม', 'error');
            }

            upsertBatchMeta(nextBatch);
            setActiveBatchId(nextBatch.id);
            activeBatchIdRef.current = nextBatch.id;
            activeBatchTransitionVersionRef.current += 1;
            if (typeof window !== 'undefined') window.__pmActiveBatchId = nextBatch.id;
            setOrders([]);
            setReviewSearch('');
            setReviewPlatform('ALL');
            setReviewStatus('ALL');
            setUploadError('');
            setActiveTab('upload');
            setActiveView('upload');
          });
        } catch (err) {
          console.error('Create batch failed', err);
          showToast('สร้าง Batch ไม่สำเร็จ กรุณาลองใหม่', 'error');
        } finally {
          setBatchLoading(false);
        }
      };

      const handleOpenBatch = async (batch) => {
        if (!batch || !batch.id) return;
        if (!batchStorageReady || !batchApi) {
          showToast('Browser storage ยังไม่พร้อม จึงยังเปิด Batch เก่าไม่ได้', 'error');
          return;
        }

        setBatchLoading(true);
        try {
          await runBatchTransition(async () => {
            const stored = await batchApi.loadBatch(batch.id);
            if (!stored.meta) throw new Error('Batch metadata not found');
            upsertBatchMeta(stored.meta);
            setActiveBatchId(stored.meta.id);
            activeBatchIdRef.current = stored.meta.id;
            activeBatchTransitionVersionRef.current += 1;
            if (typeof window !== 'undefined') window.__pmActiveBatchId = stored.meta.id;
            setOrders(Array.isArray(stored.orders) ? stored.orders : []);
            setReviewSearch('');
            setReviewPlatform('ALL');
            setReviewStatus('ALL');
            setUploadError('');
            setActiveTab('upload');
            setActiveView('upload');
          });
        } catch (err) {
          console.error('Open batch failed', err);
          showToast('เปิด Batch ไม่สำเร็จ', 'error');
        } finally {
          setBatchLoading(false);
        }
      };

      const handleBackToBatchList = async () => {
        if (!activeBatchId) return;
        if (!batchStorageReady) {
          showToast('ยังสลับ Batch ไม่ได้ เพราะ Browser storage ไม่พร้อม — งานปัจจุบันยังอยู่ใน Session นี้', 'error');
          return;
        }

        await runBatchTransition(async () => {
          setActiveBatchId(null);
          activeBatchIdRef.current = null;
          activeBatchTransitionVersionRef.current += 1;
          if (typeof window !== 'undefined') window.__pmActiveBatchId = null;
          setOrders([]);
          setReviewSearch('');
          setReviewPlatform('ALL');
          setReviewStatus('ALL');
          setUploadError('');
          setActiveTab('upload');
          setActiveView('batches');
        });
      };

      const changeCloudBatchArchive = async (batch, archivedAt) => {
        if (activeBatchId === batch.id) {
          throw new Error('กรุณากลับไปหน้า Batch List และบันทึกงานที่เปิดอยู่ก่อน');
        }
        // Reload the authoritative Batch and orders before changing metadata.
        // The CAS write rejects another device's edit between load and save.
        const fresh = await batchApi.loadBatch(batch.id);
        if (!fresh.meta) throw new Error('Cloud Batch no longer exists');
        const updated = await batchApi.saveBatch({
          ...fresh.meta, archivedAt, updatedAt: new Date().toISOString()
        }, fresh.orders);
        upsertBatchMeta(updated);
      };
      const handleArchiveBatch = async (batch) => {
        if (!batch || !batch.id || (!cloudMode && !archiveApi)) { showToast('Archive module ยังไม่พร้อม', 'error'); return; }
        const unresolved = (batch.reviewSkuCount || 0) + (batch.reviewQtyCount || 0) + (batch.unmappedCount || 0);
        if (unresolved > 0 && !window.confirm(`Batch นี้ยังมี ${unresolved} รายการที่ต้องตรวจ\n\nต้องการเก็บเข้าคลังต่อหรือไม่?`)) return;
        try {
          if (cloudMode) await changeCloudBatchArchive(batch, new Date().toISOString());
          else archiveApi.archiveBatch(batch.id, new Date());
          setBatches(prev => [...prev]);
          setSelectedArchivedBatchIds(prev => prev.filter(id => id !== batch.id));
          showToast('เก็บ Batch เข้าคลังแล้ว', 'success');
        } catch (err) { console.error('Archive sidecar failed', err); showToast('เก็บ Batch เข้าคลังไม่สำเร็จ — ข้อมูล Batch เดิมยังอยู่', 'error'); }
      };

      const handleRestoreArchivedBatch = async (batch) => {
        if (!batch || !batch.id || (!cloudMode && !archiveApi)) { showToast('Archive module ยังไม่พร้อม', 'error'); return; }
        try {
          if (cloudMode) await changeCloudBatchArchive(batch, null);
          else archiveApi.restoreBatch(batch.id, new Date());
          setBatches(prev => [...prev]);
          setSelectedArchivedBatchIds(prev => prev.filter(id => id !== batch.id));
          showToast('นำ Batch กลับจากคลังแล้ว', 'success');
        } catch (err) { console.error('Restore archive sidecar failed', err); showToast('นำ Batch กลับไม่สำเร็จ — ข้อมูล Batch เดิมยังอยู่', 'error'); }
      };

      const toggleArchivedSelection = (batchId) => {
        setSelectedArchivedBatchIds(prev => prev.includes(batchId) ? prev.filter(id => id !== batchId) : [...prev, batchId]);
      };

      const downloadLocalText = (filename, mimeType, text) => {
        const blob = new Blob([text], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      };

      const buildLocalDiagnostics = () => {
        if (!diagnosticsApi) throw new Error('Diagnostics module is not available');
        const processedOrders = batches.reduce((sum, batch) => sum + (Number(batch.totalOrders) || 0), 0);
        const exceptionOrders = batches.reduce((sum, batch) => sum + (Number(batch.reviewSkuCount) || 0) + (Number(batch.reviewQtyCount) || 0) + (Number(batch.unmappedCount) || 0), 0);
        return diagnosticsApi.buildDiagnosticReport({
          appVersion: PILOT_VERSION,
          batches: batches.map(batch => ({ ...batch, archivedAt: getBatchArchivedAt(batch) })),
          storage: storageHealth.supported === null ? null : storageHealth,
          counters: {
            processedOrders,
            exceptionOrders,
            completedBatches: batches.filter(batch => batch.status === 'COMPLETED').length,
            archivedBatches: archivedBatchCount
          },
          capabilities: {
            indexedDB: Boolean(window.indexedDB),
            storageEstimate: Boolean(navigator.storage && typeof navigator.storage.estimate === 'function'),
            webCrypto: Boolean(window.crypto && window.crypto.subtle)
          },
          errors: [],
          now: new Date()
        });
      };

      const handleDownloadDiagnostics = (format = 'json') => {
        try {
          const report = buildLocalDiagnostics();
          const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16);
          if (format === 'csv') {
            downloadLocalText(`PackMaster_Diagnostics_${stamp}.csv`, 'text/csv;charset=utf-8', diagnosticsApi.toDiagnosticCsv(report));
          } else {
            downloadLocalText(`PackMaster_Diagnostics_${stamp}.json`, 'application/json', JSON.stringify(report, null, 2));
          }
          showToast('ดาวน์โหลด Diagnostics แบบไม่รวมข้อมูลลูกค้าแล้ว', 'success');
        } catch (err) {
          console.error('Diagnostics export failed', err);
          showToast('สร้าง Diagnostics ไม่สำเร็จ — ข้อมูลใน Browser ไม่ถูกลบ', 'error');
        }
      };

      const handleCleanupReprintImages = async () => {
        if (!storageHealthApi || !batchApi || !batchStorageReady || selectedArchivedBatchIds.length === 0) return;
        if (localMetadataHealth.status === 'degraded') {
          showToast('Local Safety Metadata เสีย — กรุณากู้หรือ Reset ก่อน Cleanup', 'error');
          return;
        }
        const confirmed = window.confirm(`ล้างเฉพาะรูปสำหรับ Reprint ของ Archived Batch ที่เลือก ${selectedArchivedBatchIds.length} รายการหรือไม่?\n\nParsed Orders / SKU / Qty / สถานะ Batch จะยังอยู่ แต่ Batch ที่ล้างแล้วจะไม่มีภาพใบปะหน้าเดิมสำหรับ Reprint`);
        if (!confirmed) return;

        setStorageHealthBusy(true);
        try {
          const result = await storageHealthApi.cleanupArchivedReprintImages(batchApi, selectedArchivedBatchIds, (meta) => archiveApi ? archiveApi.isArchived(meta.id, meta.archivedAt || null) : Boolean(meta.archivedAt));
          await refreshStorageHealth();
          showToast(`ล้างรูป Reprint แล้ว ${result.cleanedOrders} Orders จาก ${result.cleanedBatches} Batch • ข้อมูล Parsed ยังอยู่`, 'success');
        } catch (err) {
          console.error('Archived reprint cleanup failed', err);
          showToast('ล้างรูป Reprint ไม่สำเร็จ — ระบบไม่ลบ Parsed Data หรือ Batch อัตโนมัติ', 'error');
        } finally {
          setStorageHealthBusy(false);
        }
      };

      const handleDeleteSelectedArchived = async () => {
        if (!batchApi || !batchStorageReady || selectedArchivedBatchIds.length === 0) return;
        if (localMetadataHealth.status === 'degraded') {
          showToast('Local Safety Metadata เสีย — กรุณากู้หรือ Reset ก่อนลบ Batch', 'error');
          return;
        }
        const deletableIds = selectedArchivedBatchIds.filter(batchId => {
          const batch = batches.find(row => row.id === batchId);
          return batch && Boolean(getBatchArchivedAt(batch));
        });
        if (deletableIds.length === 0) { setSelectedArchivedBatchIds([]); return; }
        if (!window.confirm(`ลบ Batch ที่เก็บเข้าคลังแล้ว ${deletableIds.length} รายการถาวรจาก Browser นี้หรือไม่?\n\nการลบนี้ย้อนกลับไม่ได้ เว้นแต่มี Workspace Backup`)) return;
        const deletedIds = [];
        try {
          for (const batchId of deletableIds) {
            await batchApi.deleteBatch(batchId);
            if (batchSourceFilesApi) batchSourceFilesApi.forgetBatchSourceFiles(batchId);
            if (archiveApi) archiveApi.clearBatchArchive(batchId);
            if (duplicateApi) duplicateApi.clearBatchFingerprints(batchId);
            if (reprintSnapshotApi) reprintSnapshotApi.clearBatchSnapshot(batchId);
            deletedIds.push(batchId);
          }
          const removed = new Set(deletedIds);
          setBatches(prev => prev.filter(batch => !removed.has(batch.id)));
          setSelectedArchivedBatchIds([]);
          showToast(`ลบ Archived Batch แล้ว ${deletedIds.length} รายการ`, 'success');
        } catch (err) {
          if (deletedIds.length > 0) {
            const removed = new Set(deletedIds);
            setBatches(prev => prev.filter(batch => !removed.has(batch.id)));
            setSelectedArchivedBatchIds(prev => prev.filter(id => !removed.has(id)));
          }
          console.error('Delete archived batches failed', err);
          showToast(`ลบ Archived Batch ได้ ${deletedIds.length} รายการก่อนพบปัญหา — รายการที่ยังไม่ลบยังอยู่`, 'error');
        }
      };

      const handleDeleteBatch = async (batch) => {
        if (!batch || !batch.id || !batchApi) return;
        if (!batchStorageReady) {
          showToast('Browser storage ยังไม่พร้อม', 'error');
          return;
        }
        if (localMetadataHealth.status === 'degraded') {
          showToast('Local Safety Metadata เสีย — กรุณากู้หรือ Reset ก่อนลบ Batch', 'error');
          return;
        }
        if (!window.confirm(`ลบ ${batch.name} และข้อมูลใบปะหน้าที่เก็บในเครื่องนี้หรือไม่?`)) return;

        try {
          await batchApi.deleteBatch(batch.id);
          if (batchSourceFilesApi) batchSourceFilesApi.forgetBatchSourceFiles(batch.id);
          if (duplicateApi) {
            try { duplicateApi.clearBatchFingerprints(batch.id); }
            catch (fingerprintError) { console.warn('Clear duplicate fingerprint sidecar failed', fingerprintError); }
          }
          if (archiveApi) {
            try { archiveApi.clearBatchArchive(batch.id); }
            catch (archiveError) { console.warn('Clear archive sidecar failed', archiveError); }
          }
          if (reprintSnapshotApi) {
            try {
              reprintSnapshotApi.clearBatchSnapshot(batch.id);
              if (typeof cloudMode !== 'undefined' && cloudMode && typeof cloud !== 'undefined' && typeof cloud.saveDocument === 'function') {
                cloud.saveDocument('reprintSnapshots', reprintSnapshotApi.exportStore()).catch(err => console.warn('Sync reprintSnapshots to Cloud failed', err));
              }
            }
            catch (snapshotError) { console.warn('Clear resolved snapshot sidecar failed', snapshotError); }
          }
          setBatches(prev => prev.filter(item => item.id !== batch.id));
          showToast('ลบ Batch เรียบร้อย', 'success');
        } catch (err) {
          console.error('Delete batch failed', err);
          showToast('ลบ Batch ไม่สำเร็จ', 'error');
        }
      };

      const resetActiveBatchCompletion = async () => {
        if (!activeBatch || !activeBatch.printedAt || !batchApi) return true;
        if (!batchStorageReady) {
          showToast('ไม่สามารถยกเลิกสถานะ Completed ได้ เพราะ Batch storage ยังไม่พร้อม', 'error');
          return false;
        }
        const resetMeta = batchApi.buildBatchMeta(activeBatch, reviewSummary, {
          printedAt: null, resolvedSnapshot: null, now: new Date()
        });
        try {
          const savedMeta = await batchApi.saveBatch(resetMeta, orders);
          upsertBatchMeta(savedMeta || resetMeta);
          if (reprintSnapshotApi) {
            try { reprintSnapshotApi.clearBatchSnapshot(activeBatch.id); }
            catch (snapshotError) { console.warn('Clear legacy resolved snapshot failed', snapshotError); }
          }
          return true;
        } catch (err) {
          console.error('Reset completed batch failed', err);
          try {
            const current = await batchApi.loadBatch(activeBatch.id);
            if (current?.meta && !current.meta.printedAt && current.meta.resolvedSnapshot == null) {
              upsertBatchMeta(current.meta);
              if (reprintSnapshotApi) {
                try { reprintSnapshotApi.clearBatchSnapshot(activeBatch.id); }
                catch (snapshotError) { console.warn('Clear legacy resolved snapshot after reset reconciliation failed', snapshotError); }
              }
              const ordersMatch = Array.isArray(current.orders) &&
                JSON.stringify(current.orders) === JSON.stringify(orders);
              if (!ordersMatch) {
                // A 409 may reveal another client's newer Orders. Hydrate them
                // and stop the pending edit so it cannot autosave stale data.
                if (Array.isArray(current.orders)) setOrders(current.orders);
                showToast('Batch มีข้อมูลใหม่จากอีกหน้าต่าง โหลดข้อมูลล่าสุดแล้ว กรุณาตรวจและทำรายการอีกครั้ง', 'error');
                return false;
              }
              return true;
            }
          } catch (reconcileError) {
            console.warn('Could not reconcile Batch reset after save error', reconcileError);
          }
          showToast('ยกเลิก Completed ไม่สำเร็จหรือยังยืนยันสถานะไม่ได้ — ประวัติที่แสดงยังคงเดิม กรุณาโหลด Batch ล่าสุดแล้วลองอีกครั้ง', 'error');
          return false;
        }
      };

      const markActiveBatchPrinted = async () => {
        if (!activeBatch || !batchApi || !batchStorageReady || !reprintSnapshotApi) {
          showToast('ยังบันทึก Snapshot สำหรับ Reprint ไม่ได้ จึงยังไม่พิมพ์แบบ Completed', 'error');
          return false;
        }
        let snapshot = activeBatch.resolvedSnapshot || null;
        if (activeBatch.printedAt) {
          if (!snapshot) {
            try { snapshot = reprintSnapshotApi.getBatchSnapshot(activeBatch.id); }
            catch (snapshotError) { console.error('Read legacy resolved snapshot failed', snapshotError); }
          }
          if (!snapshot) {
            showToast('ไม่พบประวัติผลพิมพ์เดิม — ตรวจสอบก่อน Reprint', 'error');
            return false;
          }
        } else {
          const printedAt = new Date().toISOString();
          try {
            snapshot = reprintSnapshotApi.validateSnapshot({
              batchId: activeBatch.id,
              completedAt: printedAt,
              orders: MappedOrders.map(order => ({ ...order, resolvedAudit: order.resolvedAudit || [] }))
            });
          } catch (snapshotError) {
            console.error('Build resolved print snapshot failed', snapshotError);
            showToast('สร้าง Snapshot สำหรับ Reprint ไม่สำเร็จ — Batch ยังไม่ Completed', 'error');
            return false;
          }
        }
        const completedMeta = batchApi.buildBatchMeta(activeBatch, reviewSummary, {
          printedAt: snapshot.completedAt, resolvedSnapshot: snapshot, now: new Date()
        });
        try {
          const savedMeta = await batchApi.saveBatch(completedMeta, orders);
          upsertBatchMeta(savedMeta || completedMeta);
          return true;
        } catch (err) {
          // A response can be lost after the Cloud revision commits. Read the
          // authoritative Batch and reconcile only when both fields match.
          try {
            const current = await batchApi.loadBatch(activeBatch.id);
            if (current?.meta?.printedAt === completedMeta.printedAt &&
                JSON.stringify(current.meta.resolvedSnapshot) === JSON.stringify(snapshot)) {
              upsertBatchMeta(current.meta);
              return true;
            }
          } catch (reconcileError) {
            console.warn('Could not reconcile Batch completion after save error', reconcileError);
          }
          console.error('Mark batch completed with snapshot failed', err);
          showToast('บันทึกผลสำหรับ Reprint ไม่สำเร็จ — Batch ยังไม่ยืนยันเป็น Completed', 'error');
          return false;
        }
      };

      const handleClearActiveBatch = async () => {
        if (orders.length === 0) return;
        if (!window.confirm('ล้าง Orders ใน Batch นี้หรือไม่? ตัว Batch จะยังอยู่')) return;

        if (activeBatch && batchApi) {
          const clearingBatchId = activeBatch.id;
          const startingRevision = activeBatch.cloudRevision;
          const transitionVersion = activeBatchTransitionVersionRef.current;
          if (!batchStorageReady) {
            showToast('ยังล้าง Orders ไม่ได้ เพราะ Batch storage ยังไม่พร้อม', 'error');
            return;
          }
          const emptySummary = { total: 0, ready: 0, reviewSku: 0, reviewQty: 0, unmapped: 0 };
          const clearOperationId = crypto.randomUUID();
          const resetMeta = batchApi.buildBatchMeta(activeBatch, emptySummary, {
            printedAt: null, resolvedSnapshot: null, clearOperationId, now: new Date()
          });
          try {
            const savedMeta = await batchApi.saveBatch(resetMeta, []);
            if (activeBatchIdRef.current === clearingBatchId &&
                activeBatchTransitionVersionRef.current === transitionVersion) {
              setOrders([]);
              upsertBatchMeta(savedMeta || resetMeta);
            }
          } catch (err) {
            console.error('Clear active batch save failed', err);
            let current = null;
            try { current = await batchApi.loadBatch(clearingBatchId); }
            catch (reconcileError) {
              console.warn('Could not reconcile Batch clear after save error', reconcileError);
            }
            const revisionAdvanced = Number.isSafeInteger(startingRevision)
              ? Number.isSafeInteger(current?.meta?.cloudRevision) && current.meta.cloudRevision === startingRevision + 1
              : true;
            const clearWasCommitted = Boolean(current?.meta && current.meta.id === clearingBatchId &&
              revisionAdvanced && current.meta.clearOperationId === clearOperationId &&
              !current.meta.printedAt && current.meta.resolvedSnapshot == null &&
              Array.isArray(current.orders) && current.orders.length === 0);
            if (!clearWasCommitted) {
              showToast('ยืนยันผลการล้างไม่ได้ — ข้อมูลอาจเปลี่ยนจากอีกหน้าต่าง กรุณาโหลด Batch ล่าสุดก่อนทำรายการต่อ', 'error');
              return;
            }
            if (activeBatchIdRef.current === clearingBatchId &&
                activeBatchTransitionVersionRef.current === transitionVersion) {
              setOrders([]);
              upsertBatchMeta(current.meta);
            }
          }
          if (duplicateApi) {
            try { duplicateApi.clearBatchFingerprints(clearingBatchId); }
            catch (fingerprintError) { console.warn('Clear duplicate fingerprint sidecar failed', fingerprintError); }
          }
          if (reprintSnapshotApi) {
            try { reprintSnapshotApi.clearBatchSnapshot(clearingBatchId); }
            catch (snapshotError) { console.warn('Clear resolved snapshot sidecar failed', snapshotError); }
          }
        } else {
          setOrders([]);
        }
        if (!(activeBatch && batchApi)) {
          if (duplicateApi && activeBatchId) {
            try { duplicateApi.clearBatchFingerprints(activeBatchId); }
            catch (fingerprintError) { console.warn('Clear duplicate fingerprint sidecar failed', fingerprintError); }
          }
          if (reprintSnapshotApi && activeBatchId) {
            try { reprintSnapshotApi.clearBatchSnapshot(activeBatchId); }
            catch (snapshotError) { console.warn('Clear resolved snapshot sidecar failed', snapshotError); }
          }
        }
        showToast('ล้าง Orders ใน Batch เรียบร้อย', 'success');
      };

      const handlePrint = async (mode = 'FULL_BATCH') => {
        const scopedOrders = printScopeApi
          ? printScopeApi.selectPrintOrders(MappedOrders, mode, order => getReviewFlags(order).ready)
          : (mode === 'READY_ONLY' ? MappedOrders.filter(order => getReviewFlags(order).ready) : MappedOrders);
        if (scopedOrders.length === 0) {
          showToast('ไม่มีรายการพร้อมพิมพ์ใน Scope นี้', 'error');
          return;
        }
        setPrintScopeMode(mode);
        setPrintRenderActive(true);
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        try {
          await waitForPrintRender(document.querySelector('.print-area'), scopedOrders, thermalMode);
          if (mode === 'FULL_BATCH') {
            const completed = await markActiveBatchPrinted();
            if (!completed) return;
          }
          window.print();
        } catch (err) {
          console.error('PackMaster print preparation failed:', err);
          showToast(err.message || 'เตรียมหน้าพิมพ์ไม่สำเร็จ', 'error');
        } finally {
          setPrintRenderActive(false);
        }
      };

      useEffect(() => {
        if (!activeBatchId || !activeBatch || !batchApi || !batchStorageReady || batchLoading || (cloudMode && loadingStatus.active)) return;

        const timer = setTimeout(async () => {
          try {
            const updated = batchApi.buildBatchMeta(activeBatch, reviewSummary, { printedAt: activeBatch.printedAt, now: new Date() });
            const storedMeta = await batchApi.saveBatch(updated, orders);
            upsertBatchMeta(storedMeta);
          } catch (err) {
            console.error('Auto-save batch failed', err);
            if (cloudMode) setCloudBatchError(err.message || 'Cloud Batch auto-save failed');
            showToast('Auto-save Batch ไม่สำเร็จ กรุณาอย่าเพิ่งสลับงาน', 'error');
          }
        }, 600);

        return () => clearTimeout(timer);
      }, [
        activeBatchId,
        orders,
        reviewSummary.total,
        reviewSummary.ready,
        reviewSummary.reviewSku,
        reviewSummary.reviewQty,
        reviewSummary.unmapped,
        activeBatch && activeBatch.printedAt,
        batchStorageReady,
        batchLoading,
        cloudMode,
        loadingStatus.active
      ]);

      const resetRestorePreview = () => {
        setRestorePreview(null);
        setRestoreFileName('');
      };

      const handleMarketplaceRegistryImport = async (event, expectedPlatform) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (marketplaceRegistryBusy) { event.target.value = ''; return; }
        setMarketplaceRegistryBusy(true);
        try {
          if (!marketplaceRegistryApi) throw new Error('โมดูลทะเบียน Marketplace ยังไม่พร้อม');
          const importedRegistry = marketplaceRegistryApi.validatePlatformRegistry(JSON.parse(await file.text()), expectedPlatform);
          let currentStore = marketplaceRegistry || marketplaceRegistryApi.createEmptyStore();
          if (marketplaceRegistryLoadError) {
            const rebuild = window.confirm('ข้อมูลทะเบียนเดิมอ่านไม่ได้ การนำเข้านี้จะสร้างทะเบียน Marketplace ใหม่และแทนข้อมูลที่เสีย โดยข้อมูล Batch และ SKU Mapping จะไม่เปลี่ยน ต้องการดำเนินการต่อหรือไม่?');
            if (!rebuild) return;
            currentStore = marketplaceRegistryApi.createEmptyStore();
          } else if (currentStore.platforms[expectedPlatform]) {
            const replace = window.confirm('มีข้อมูล ' + expectedPlatform + ' อยู่แล้ว ต้องการแทนด้วยไฟล์ ' + file.name + ' หรือไม่? แพลตฟอร์มอีกฝั่งจะคงเดิม');
            if (!replace) return;
          }
          const nextStore = marketplaceRegistryApi.replacePlatformRegistry(currentStore, importedRegistry);
          if (cloudMode) {
            if (!cloudRegistryLoaded) throw new Error('Cloud Registry has not finished loading');
            await cloud.saveRegistry(expectedPlatform, importedRegistry);
          } else {
            marketplaceRegistryApi.saveStore(window.localStorage, nextStore);
            const completedAssignments = localRegistryBootstrapApi.ensureRegistryAssignments(
              nextStore,
              registryAssignments || registryMatcherApi.newAssignments(),
              marketplaceRegistryApi,
              registryMatcherApi,
              registryIdentityApi
            );
            registryMatcherApi.saveLocalAssignments(window.localStorage, completedAssignments);
            setRegistryAssignments(completedAssignments);
            setRegistryAssignmentsLoaded(true);
          }
          setMarketplaceRegistry(nextStore);
          setMarketplaceRegistryLoadError('');
          setMarketplaceRegistrySearch('');
          setMarketplaceRegistryPage(1);
          showToast('นำเข้า ' + expectedPlatform + ' แล้ว • สินค้า ' + importedRegistry.summary.listedProductCount + ' • แถว SKU/ตัวเลือก ' + importedRegistry.summary.skuModelRowCount, 'success');
        } catch (err) {
          console.error('Marketplace registry import failed', err);
          if (cloudMode && err.status === 409) setCloudRegistryError('ทะเบียนกลางถูกแก้จากอีกเครื่อง กรุณาโหลด Cloud ใหม่ก่อนแก้ไข');
          showToast('นำเข้าทะเบียนไม่สำเร็จ: ' + (err.message || 'รูปแบบไฟล์ไม่ถูกต้อง'), 'error');
        } finally {
          event.target.value = '';
          setMarketplaceRegistryBusy(false);
        }
      };
      const handleWorkspaceBackup = async () => {
        if (!workspaceApi || !batchApi) {
          showToast('โมดูล Workspace Backup ยังไม่พร้อม', 'error');
          return;
        }
        if (!batchStorageReady) {
          showToast('Browser storage ยังไม่พร้อม จึงยังสำรอง Workspace ไม่ได้', 'error');
          return;
        }

        setWorkspaceBusy(true);
        try {
          if (activeBatchId) {
            const saved = await saveActiveBatchSnapshot();
            if (!saved) throw new Error('บันทึก Active Batch ล่าสุดไม่สำเร็จ');
          }

          const payload = await workspaceApi.collectBackupPayload({
            batchApi,
            skuRules,
            settings: {
              thermalMode,
              duplicateFingerprints: duplicateApi ? duplicateApi.exportFingerprintStore() : {},
              archiveState: archiveApi ? archiveApi.exportArchiveStore() : {},
              marketplaceRegistry: marketplaceRegistryLoadError ? null : marketplaceRegistry,
              reprintSnapshots: reprintSnapshotApi ? reprintSnapshotApi.exportStore() : {},
              registryAssignments: registryAssignments || null
            },
            appVersion: document.title
          });
          const backup = workspaceApi.createBackup(payload, new Date());
          const summary = workspaceApi.getBackupSummary(backup);
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16);
          link.href = url;
          link.download = `PackMaster_Backup_${stamp}.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 0);
          showToast(`สำรอง Workspace แล้ว • ทะเบียนชื่อ ${summary.registryAssignments} • SKU ${summary.skuRules} • Batch ${summary.batches} • Orders ${summary.orders}`, 'success');
        } catch (err) {
          console.error('Workspace backup failed', err);
          showToast(err.message || 'สำรอง Workspace ไม่สำเร็จ', 'error');
        } finally {
          setWorkspaceBusy(false);
        }
      };

      const handleWorkspaceRestoreFile = async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        setWorkspaceBusy(true);
        try {
          if (!workspaceApi) throw new Error('โมดูล Workspace Backup ยังไม่พร้อม');
          const raw = await file.text();
          const parsed = JSON.parse(raw);
          const backup = workspaceApi.validateBackup(parsed);
          if (backup.settings.registryAssignments != null) {
            if (!registryMatcherApi) throw new Error('โมดูลทะเบียน SKU ไม่พร้อม');
            registryMatcherApi.validateAssignments(backup.settings.registryAssignments);
          }
          if (duplicateApi) duplicateApi.validateFingerprintStore(backup.settings.duplicateFingerprints || {});
          if (archiveApi) archiveApi.validateArchiveStore(backup.settings.archiveState || {});
          const restoredMarketplaceRegistry = backup.settings.marketplaceRegistry == null
            ? null
            : marketplaceRegistryApi.validateStore(backup.settings.marketplaceRegistry);
          const preparedRules = prepareSkuRules(backup.skuRules, `restore-${Date.now()}`);
          if (preparedRules.report.conflicts.length > 0) {
            throw new Error(`Backup มี SKU conflict ${preparedRules.report.conflicts.length} กลุ่ม ต้องให้ผู้ใช้ตัดสินใจก่อน Restore`);
          }
          const safeBackup = { ...backup, skuRules: preparedRules.rules };
          if (restoredMarketplaceRegistry) safeBackup.settings = { ...backup.settings, marketplaceRegistry: restoredMarketplaceRegistry };
          const summary = workspaceApi.getBackupSummary(safeBackup);
          const marketplaceSummary = restoredMarketplaceRegistry ? marketplaceRegistryApi.getSummary(restoredMarketplaceRegistry) : null;
          setRestorePreview({ backup: safeBackup, summary, marketplaceSummary, skuIntegrityReport: preparedRules.report });
          setRestoreFileName(file.name);
          const integrityNote = preparedRules.report.rekeyed.length > 0
            ? ` • จะ Re-key Rule ID ${preparedRules.report.rekeyed.length} รายการโดยไม่เปลี่ยน Keyword/ชื่อภายใน`
            : '';
          showToast(`ตรวจไฟล์ Backup ผ่านแล้ว กรุณาตรวจ Summary ก่อน Replace${integrityNote}`, 'success');
        } catch (err) {
          console.error('Workspace restore file validation failed', err);
          resetRestorePreview();
          showToast(`ไฟล์ Backup ใช้งานไม่ได้: ${err.message || 'รูปแบบไม่ถูกต้อง'}`, 'error');
        } finally {
          event.target.value = '';
          setWorkspaceBusy(false);
        }
      };

      const handleConfirmWorkspaceRestore = async () => {
        if (cloudMode) {
          showToast('Cloud Mode ยังไม่รองรับการ Replace Workspace กรุณาใช้เครื่องมือย้ายข้อมูลที่ตรวจสอบแล้ว', 'error');
          return;
        }
        if (!restorePreview || !restorePreview.backup || !workspaceApi || !batchApi) return;
        if (!batchStorageReady) {
          showToast('Browser storage ยังไม่พร้อม จึงยัง Replace Workspace ไม่ได้', 'error');
          return;
        }

        const { backup, summary, skuIntegrityReport } = restorePreview;
        const integrityPreview = skuIntegrityReport
          ? `\nSKU Integrity: Re-key ID ${skuIntegrityReport.rekeyed.length} • Same-output duplicate ${skuIntegrityReport.sameOutputDuplicates.length}`
          : '';
        const confirmed = window.confirm(
          `Replace Workspace ปัจจุบันด้วยไฟล์ Backup นี้หรือไม่?\n\nSKU ${summary.skuRules} • Batch ${summary.batches} • Orders ${summary.orders}${integrityPreview}\n\nข้อมูล Local ปัจจุบันจะถูกแทนที่ แต่ระบบจะสร้าง Safety Snapshot ในหน่วยความจำก่อนเริ่มกู้คืน`
        );
        if (!confirmed) return;

        setWorkspaceBusy(true);
        const previousSkuRules = JSON.parse(JSON.stringify(skuRules));
        const previousThermalMode = thermalMode;
        const previousDuplicateFingerprints = duplicateApi ? duplicateApi.exportFingerprintStore() : {};
        const previousArchiveState = archiveApi ? archiveApi.exportArchiveStore() : {};
        const previousMarketplaceRegistry = marketplaceRegistry;
        const previousMarketplaceRegistryLoadError = marketplaceRegistryLoadError;
        const previousReprintSnapshots = reprintSnapshotApi ? reprintSnapshotApi.exportStore() : {};
        const previousRegistryAssignments = registryAssignments;
        const previousRegistryAssignmentsError = registryAssignmentsError;
        const previousRegistryAssignmentsRaw = !cloudMode && registryMatcherApi
          ? window.localStorage.getItem(registryMatcherApi.LOCAL_ASSIGNMENTS_KEY) : null;
        let previousMarketplaceRegistryRaw = null;
        try { previousMarketplaceRegistryRaw = window.localStorage.getItem(marketplaceRegistryApi.STORAGE_KEY); } catch (error) {}
        let safetyBackup = null;
        let rollbackSucceeded = false;

        try {
          if (activeBatchId) {
            const saved = await saveActiveBatchSnapshot();
            if (!saved) throw new Error('บันทึก Active Batch ล่าสุดไม่สำเร็จ จึงยกเลิก Restore');
          }

          const restoredRules = backup.skuRules.map((rule, index) => sanitizeSkuRule(rule, `restore-${Date.now()}-${index}`));
          if (restoredRules.some(rule => !rule)) throw new Error('Backup มี SKU rule ที่ไม่ถูกต้อง');

          const safetyPayload = await workspaceApi.collectBackupPayload({
            batchApi,
            skuRules: previousSkuRules,
            settings: {
              thermalMode: previousThermalMode,
              duplicateFingerprints: previousDuplicateFingerprints,
              archiveState: previousArchiveState,
              marketplaceRegistry: previousMarketplaceRegistryLoadError ? null : previousMarketplaceRegistry,
              reprintSnapshots: previousReprintSnapshots,
              registryAssignments: previousRegistryAssignments || null
            },
            appVersion: document.title
          });
          safetyBackup = workspaceApi.createBackup(safetyPayload, new Date());

          await workspaceApi.replaceWorkspaceBatches(backup, batchApi);
          if (duplicateApi) duplicateApi.replaceFingerprintStore(backup.settings.duplicateFingerprints || {});
          if (archiveApi) archiveApi.replaceArchiveStore(backup.settings.archiveState || {});
          if (reprintSnapshotApi && backup.settings.reprintSnapshots) {
            reprintSnapshotApi.replaceStore(backup.settings.reprintSnapshots);
          }
          const restoredAssignments = backup.settings.registryAssignments != null
            ? (registryMatcherApi
                ? registryMatcherApi.validateAssignments(backup.settings.registryAssignments)
                : backup.settings.registryAssignments)
            : (registryMatcherApi ? registryMatcherApi.newAssignments() : { schema: 'packmaster-registry-sku-assignments', version: 1, updatedAt: null, entries: [] });
          if (!cloudMode && registryMatcherApi) {
            registryMatcherApi.saveLocalAssignments(window.localStorage, restoredAssignments);
          }
          setRegistryAssignments(restoredAssignments);
          setRegistryAssignmentsError('');
          if (cloudMode && typeof cloud?.saveRegistryAssignments === 'function') {
            try {
              await cloud.saveRegistryAssignments(restoredAssignments);
            } catch (cloudRegErr) {
              console.warn('Sync restored registryAssignments to Cloud failed', cloudRegErr);
            }
          }
          if (backup.settings.marketplaceRegistry != null) {
            marketplaceRegistryApi.saveStore(window.localStorage, backup.settings.marketplaceRegistry);
            setMarketplaceRegistry(backup.settings.marketplaceRegistry);
            setMarketplaceRegistryLoadError('');
          }

          setSkuRules(restoredRules);
          if (typeof backup.settings.thermalMode === 'boolean') {
            setThermalMode(backup.settings.thermalMode);
          }

          const restoredBatches = await batchApi.listBatches();
          setBatches(restoredBatches);
          setActiveBatchId(null);
          activeBatchIdRef.current = null;
          activeBatchTransitionVersionRef.current += 1;
          if (typeof window !== 'undefined') window.__pmActiveBatchId = null;
          setOrders([]);
          setReviewSearch('');
          setReviewPlatform('ALL');
          setReviewStatus('ALL');
          setUploadError('');
          resetRestorePreview();
          setActiveTab('upload');
          setActiveView('batches');
          showToast(`กู้คืน Workspace สำเร็จ • Batch ${summary.batches} • Orders ${summary.orders}`, 'success');
        } catch (err) {
          console.error('Workspace replace failed', err);

          if (safetyBackup) {
            try {
              await workspaceApi.replaceWorkspaceBatches(safetyBackup, batchApi);
              if (duplicateApi) duplicateApi.replaceFingerprintStore(previousDuplicateFingerprints);
              if (archiveApi) archiveApi.replaceArchiveStore(previousArchiveState);
              if (reprintSnapshotApi && previousReprintSnapshots) reprintSnapshotApi.replaceStore(previousReprintSnapshots);
              if (!cloudMode && registryMatcherApi) {
                if (previousRegistryAssignmentsRaw === null) window.localStorage.removeItem(registryMatcherApi.LOCAL_ASSIGNMENTS_KEY);
                else window.localStorage.setItem(registryMatcherApi.LOCAL_ASSIGNMENTS_KEY, previousRegistryAssignmentsRaw);
                setRegistryAssignmentsError(previousRegistryAssignmentsError);
              }
              setRegistryAssignments(previousRegistryAssignments);
              if (previousRegistryAssignments && cloudMode && typeof cloud?.saveRegistryAssignments === 'function') {
                try { await cloud.saveRegistryAssignments(previousRegistryAssignments); } catch (e) {}
              }
              if (previousMarketplaceRegistryRaw == null) window.localStorage.removeItem(marketplaceRegistryApi.STORAGE_KEY);
              else window.localStorage.setItem(marketplaceRegistryApi.STORAGE_KEY, previousMarketplaceRegistryRaw);
              setMarketplaceRegistry(previousMarketplaceRegistry);
              setMarketplaceRegistryLoadError(previousMarketplaceRegistryLoadError);
              const previousBatches = await batchApi.listBatches();
              setBatches(previousBatches);
              setSkuRules(previousSkuRules);
              setThermalMode(previousThermalMode);
              rollbackSucceeded = true;
            } catch (rollbackErr) {
              console.error('Workspace rollback failed', rollbackErr);
            }
          }

          showToast(
            rollbackSucceeded
              ? `กู้คืนไม่สำเร็จ แต่คืน Workspace เดิมแล้ว: ${err.message || 'Restore failed'}`
              : `กู้คืนไม่สำเร็จและคืนข้อมูลอัตโนมัติไม่ครบ กรุณาอย่าปิดหน้านี้และใช้ไฟล์ Backup ล่าสุด: ${err.message || 'Restore failed'}`,
            'error'
          );
        } finally {
          setWorkspaceBusy(false);
        }
      };

      const handleExportPDF = async (mode = 'FULL_BATCH') => {
        if (MappedOrders.length === 0) return;
        const ordersToExport = printScopeApi
          ? printScopeApi.selectPrintOrders(MappedOrders, mode, order => getReviewFlags(order).ready)
          : (mode === 'READY_ONLY' ? MappedOrders.filter(order => getReviewFlags(order).ready) : MappedOrders);
        if (ordersToExport.length === 0) {
          showToast('ไม่มีรายการพร้อมสำหรับ Save PDF ใน Scope นี้', 'error');
          return;
        }
        setExportStatus({ active: true, current: 0, total: ordersToExport.length });

        await new Promise(resolve => setTimeout(resolve, 100));

        try {
          if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('โหลดระบบสร้าง PDF ไม่สำเร็จ');
          if (!window.html2canvas) throw new Error('โหลดระบบจับภาพใบปะหน้าไม่สำเร็จ');

          const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: [100, 150] });
          let exportedPages = 0;

          for (let i = 0; i < ordersToExport.length; i++) {
            const order = ordersToExport[i];
            setExportStatus(prev => ({ ...prev, current: i + 1 }));

            setExportRenderOrder(order);
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

            const element = document.getElementById(`render-target-${order.id}`);
            if (!element) {
              throw new Error(`ไม่พบหน้าสำหรับ Export ลำดับ ${i + 1}: ${order.id}`);
            }

            await waitForLabelRender(element, order, thermalMode);
            const canvas = await window.html2canvas(element, { scale: 3, useCORS: true, logging: false, backgroundColor: '#ffffff' });

            if (i > 0) pdf.addPage();
            const exportedImage = canvas.toDataURL('image/jpeg', 0.98);
            pdf.addImage(exportedImage, 'JPEG', 0, 0, 100, 150);
            canvas.width = 1;
            canvas.height = 1;
            exportedPages++;
          }

          if (exportedPages !== ordersToExport.length) {
            throw new Error(`Export ไม่ครบ: ได้ ${exportedPages} จาก ${ordersToExport.length} หน้า`);
          }

          pdf.save(`PackMaster_Labels_${new Date().getTime()}.pdf`);
          let printMarkSucceeded = true;
          if (mode === 'FULL_BATCH') {
            printMarkSucceeded = await markActiveBatchPrinted();
          }
          if (printMarkSucceeded) {
            showToast(`ดาวน์โหลด PDF เรียบร้อย ${exportedPages} หน้า`, 'success');
          } else {
            showToast(`ดาวน์โหลด PDF แล้ว ${exportedPages} หน้า แต่บันทึกสถานะพิมพ์ไม่สำเร็จ`, 'error');
          }
        } catch (err) {
          console.error('PackMaster PDF export failed:', err);
          showToast(err.message || 'สร้างไฟล์ PDF ล้มเหลว', 'error');
        } finally {
          setExportRenderOrder(null);
          setExportStatus({ active: false, current: 0, total: 0 });
        }
      };

      const prepareSkuRules = (rules, idPrefix = 'rule') => {
        if (!skuIntegrityApi) throw new Error('SKU Integrity module ยังไม่พร้อม');
        return skuIntegrityApi.prepareRules(rules, { normalize: normalizeMatchText, idPrefix });
      };

      const handleAuditSkuRules = () => {
        try {
          const prepared = prepareSkuRules(skuRules, 'migrate');
          if (prepared.report.conflicts.length > 0) {
            showToast(`พบ Mapping conflict ${prepared.report.conflicts.length} กลุ่ม — ยังไม่แก้หรือเลือกแทนให้อัตโนมัติ`, 'error');
            return;
          }
          const preview = `Audit SKU Library\n\nDuplicate ID: ${prepared.report.duplicateIds.length}\nNormalized same-output: ${prepared.report.sameOutputDuplicates.length}\nRe-key ID: ${prepared.report.rekeyed.length}\n\nระบบจะ Backup dictionary ปัจจุบันก่อน Apply และจะไม่ลบ alias อัตโนมัติ`;
          if (!window.confirm(preview)) return;
          localStorage.setItem(SKU_INTEGRITY_BACKUP_KEY, JSON.stringify(skuRules));
          setSkuRules(prepared.rules);
          showToast(`Integrity migration สำเร็จ • Re-key ${prepared.report.rekeyed.length} ID`, 'success');
        } catch (err) {
          showToast(err.message || 'Audit SKU Library ไม่สำเร็จ', 'error');
        }
      };

      const handleRollbackSkuMigration = () => {
        try {
          const raw = localStorage.getItem(SKU_INTEGRITY_BACKUP_KEY);
          if (!raw) return showToast('ยังไม่มี Integrity backup ให้ย้อนกลับ', 'error');
          const backupRules = JSON.parse(raw);
          if (!Array.isArray(backupRules)) throw new Error('Integrity backup ใช้งานไม่ได้');
          if (!window.confirm('ย้อนกลับ SKU Library ไปยัง snapshot ก่อน Integrity migration หรือไม่?')) return;
          setSkuRules(backupRules.map((rule, index) => sanitizeSkuRule(rule, `rollback-${index}`)).filter(Boolean));
          showToast('ย้อนกลับ SKU Library จาก Integrity backup แล้ว', 'success');
        } catch (err) {
          showToast(err.message || 'Rollback SKU Library ไม่สำเร็จ', 'error');
        }
      };

      const handleExportRules = () => {
        if (skuRules.length === 0) return showToast('ไม่มีข้อมูลให้ส่งออก', 'error');
        const blob = new Blob([JSON.stringify(skuRules, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.href = url;
        dlAnchorElem.download = `packmaster_rules_${new Date().toISOString().split('T')[0]}.json`;
        dlAnchorElem.click();
        URL.revokeObjectURL(url);
        showToast('สำรองข้อมูลสำเร็จ', 'success');
      };

      const handleImportRules = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedRules = JSON.parse(event.target.result);
            if (!Array.isArray(importedRules)) {
              showToast('รูปแบบไฟล์ไม่ถูกต้อง', 'error');
              return;
            }

            const validRules = importedRules
              .map((rule, index) => sanitizeSkuRule(rule, `import-${Date.now()}-${index}`))
              .filter(Boolean);
            const skippedCount = importedRules.length - validRules.length;

            if (validRules.length === 0) {
              showToast('ไม่พบกฎ SKU ที่ใช้งานได้', 'error');
              return;
            }

            const prepared = prepareSkuRules([...validRules, ...skuRules], `import-${Date.now()}`);
            if (prepared.report.conflicts.length > 0) {
              showToast(`นำเข้าไม่ได้: พบ Mapping conflict ${prepared.report.conflicts.length} กลุ่ม ต้องให้ผู้ใช้ตัดสินใจก่อน`, 'error');
              return;
            }
            const integrityChanges = prepared.report.rekeyed.length + prepared.report.sameOutputDuplicates.length;
            if (integrityChanges > 0) {
              const preview = `Import SKU Library\n\nRe-key ID: ${prepared.report.rekeyed.length}\nNormalized same-output: ${prepared.report.sameOutputDuplicates.length}\n\nระบบจะไม่ลบ alias อัตโนมัติ ต้องการ Apply หรือไม่?`;
              if (!window.confirm(preview)) return;
            }
            setSkuRules(prepared.rules);

            if (skippedCount > 0) {
              showToast(`นำเข้า ${validRules.length} ข้อ (ข้าม ${skippedCount} ข้อที่ไม่ถูกต้อง)`, 'success');
            } else {
              showToast(`นำเข้าสำเร็จ ${validRules.length} ข้อ`, 'success');
            }
          } catch (err) {
            console.error('นำเข้ากฎ SKU ไม่สำเร็จ', err);
            showToast('ไฟล์เสียหาย', 'error');
          }
        };
        reader.readAsText(file); e.target.value = null;
      };

      const saveSkuRule = ({ keyword, shortName }, options = {}) => {
        const cleanKeyword = String(keyword || '').trim();
        const cleanShortName = String(shortName || '').trim();
        if (!cleanKeyword || !cleanShortName || !skuIntegrityApi) return false;
        const targetEditingId = options.editingId || null;
        const idCounts = new Map();
        skuRules.forEach(rule => {
          const key = String(rule.id);
          idCounts.set(key, (idCounts.get(key) || 0) + 1);
        });
        if (Array.from(idCounts.values()).some(count => count > 1)) {
          showToast('พบ Rule ID ซ้ำในคลังเดิม — กรุณา Audit Integrity ก่อน Add/Edit เพื่อป้องกันแก้หลาย alias พร้อมกัน', 'error');
          return false;
        }

        let candidateRules;
        if (targetEditingId) {
          candidateRules = skuRules.map(rule => rule.id === targetEditingId
            ? { ...rule, keyword: cleanKeyword, shortName: cleanShortName }
            : rule);
        } else {
          const usedIds = new Set(skuRules.map(rule => String(rule.id)));
          const id = skuIntegrityApi.nextUniqueId(usedIds, `rule-${Date.now()}`);
          candidateRules = [{ keyword: cleanKeyword, shortName: cleanShortName, id }, ...skuRules];
        }
        const prepared = prepareSkuRules(candidateRules, `rule-${Date.now()}`);
        if (prepared.report.conflicts.length > 0) {
          showToast('บันทึกไม่ได้: Keyword เดียวกันหลัง normalize ชี้ไปคนละชื่อภายใน', 'error');
          return false;
        }
        if (prepared.report.sameOutputDuplicates.length > 0 && !window.confirm('พบ normalized duplicate ที่ให้ผลลัพธ์เดียวกัน ระบบจะเก็บทั้งสอง alias และไม่ลบอัตโนมัติ ต้องการบันทึกต่อหรือไม่?')) return false;
        setSkuRules(prepared.rules);
        showToast(options.successMessage || (targetEditingId ? 'แก้ไขกฎสำเร็จ' : 'เพิ่มกฎใหม่สำเร็จ'), 'success');
        return true;
      };

      const handleSubmitRule = (e) => {
        e.preventDefault();
        if (!newRule.keyword.trim() || !newRule.shortName.trim()) return;
        const saved = saveSkuRule(newRule, { editingId });
        if (!saved) return;
        setEditingId(null);
        setNewRule({ keyword: '', shortName: '' });
      };

      const handleEditClick = (rule) => {
        const sharedIdCount = skuRules.filter(candidate => String(candidate.id) === String(rule.id)).length;
        if (sharedIdCount > 1) return showToast('Rule ID นี้ถูกใช้ร่วมกับ alias อื่น — กรุณา Audit Integrity ก่อนแก้ไข', 'error');
        setNewRule({ keyword: rule.keyword, shortName: rule.shortName });
        setEditingId(rule.id);
      };

      const handleDeleteSkuRule = (rule) => {
        const sharedIdCount = skuRules.filter(candidate => String(candidate.id) === String(rule.id)).length;
        if (sharedIdCount > 1) return showToast('Rule ID นี้ถูกใช้ร่วมกับ alias อื่น — กรุณา Audit Integrity ก่อนลบ', 'error');
        if (window.confirm(`ลบกฎ ${rule.keyword} หรือไม่?`)) setSkuRules(prev => prev.filter(candidate => String(candidate.id) !== String(rule.id)));
      };

      const cancelEdit = () => {
        setNewRule({ keyword: '', shortName: '' });
        setEditingId(null);
      };

      const testResult = useMemo(() => {
        if (!testInput) return null;
        const match = getMatchResult(testInput, testPlatform);
        const totalQty = parseInt(testQty, 10) || 1;
        if (match.status === 'ambiguous') return '⚠️ ตรวจสอบ SKU';
        if (match.status !== 'matched' || !match.rule) return 'ไม่พบคีย์เวิร์ด';
        const baseName = match.rule.shortName.trim().replace(/\u00A0/g, ' ');
        return getAggregatedShortName(baseName, totalQty);
      }, [testInput, testQty, testPlatform, getMatchResult]);

      const skuFilterOptions = [
        { id: 'ALL', label: 'ทั้งหมด' },
        { id: 'HOYA', label: 'HOYA' },
        { id: 'HAKU', label: 'HAKU' },

                        <div className="flex items-start gap-3"><div className="pm-feature-icon"><PMIcon name="database"/></div><div className="flex-1"><div className="pm-section-kicker">Workspace Backup</div><h3 className="text-base font-black text-slate-900">ความปลอดภัย Workspace</h3><p className="text-xs font-semibold text-slate-400 mt-1 leading-5">{cloudMode ? 'ส่งออก Batch/Orders จาก Cloud พร้อมข้อมูล sidecar ที่อยู่ใน Browser นี้เป็น JSON' : 'สำรองคลังคำศัพท์, Settings และ Batch เป็น JSON ในเครื่อง ก่อนย้ายเครื่องหรือล้าง Browser'}</p></div></div>
                        <div className="flex flex-wrap gap-2 mt-5"><button data-pm-action="workspace-backup" onClick={handleWorkspaceBackup} disabled={workspaceBusy||!batchStorageReady} className="pm-primary-btn"><PMIcon name="download"/> สำรอง Workspace</button>{!cloudMode ? <label className={`pm-secondary-btn cursor-pointer ${workspaceBusy||!batchStorageReady?'opacity-50 pointer-events-none':''}`}><PMIcon name="upload"/> กู้คืน Workspace<input type="file" accept=".json,application/json" disabled={workspaceBusy||!batchStorageReady} className="hidden" onChange={handleWorkspaceRestoreFile}/></label> : <div data-pm-cloud-restore-unavailable className="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-bold text-amber-800">Cloud Replace Workspace ยังไม่รองรับ — ไฟล์ส่งออกจากหน้านี้กู้คืน Cloud ไม่ได้</div>}</div>
                        <div className="mt-4 rounded-xl bg-amber-50 border border-amber-200 px-3 py-3 text-[11px] font-semibold leading-5 text-amber-800">Backup อาจมีข้อมูลที่อ่านจากใบออเดอร์ ควรเก็บเป็นข้อมูลภายในร้านและไม่อัปโหลดไฟล์จริงขึ้น Public GitHub</div>

                        {restorePreview&&<div className="mt-4 rounded-xl border-2 border-blue-200 bg-blue-50/50 p-4"><div className="text-[10px] font-black text-blue-600">ตรวจไฟล์ผ่านแล้ว • {restoreFileName||'Backup JSON'}</div>{restorePreview.marketplaceSummary&&<div className="mt-2 text-xs font-bold text-blue-800">Marketplace Registry: TikTok {restorePreview.marketplaceSummary.TIKTOK.productCount} สินค้า • Shopee {restorePreview.marketplaceSummary.SHOPEE.productCount} สินค้า</div>}<div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3"><div className="pm-mini-stat"><span>Registry Names</span><strong>{restorePreview.summary.registryAssignments}</strong></div><div className="pm-mini-stat"><span>SKU Rules</span><strong>{restorePreview.summary.skuRules}</strong></div><div className="pm-mini-stat"><span>Batches</span><strong>{restorePreview.summary.batches}</strong></div><div className="pm-mini-stat"><span>Orders</span><strong>{restorePreview.summary.orders}</strong></div></div><div className="flex items-center justify-between gap-2 mt-4 pt-3 border-t border-blue-200"><span className="text-[10px] font-bold text-red-600">Replace Workspace จะแทนข้อมูล Local ปัจจุบัน</span><div className="flex gap-2"><button onClick={resetRestorePreview} className="pm-ghost-btn">ยกเลิก</button><button onClick={handleConfirmWorkspaceRestore} disabled={workspaceBusy} className="pm-danger-btn">Replace Workspace</button></div></div></div>}
                      </div>

                      <div className="pm-card p-5">
                        <div className="flex items-start gap-3"><div className="pm-feature-icon"><PMIcon name="storage"/></div><div className="flex-1"><div className="pm-section-kicker">Browser Storage</div><h3 className="text-base font-black text-slate-900">Storage Health</h3><p className="text-xs font-semibold text-slate-400 mt-1">ตรวจการใช้พื้นที่แบบ Local และล้างเฉพาะภาพ Reprint ของ Archived Batch ที่เลือก</p></div></div>
                        <div className="mt-5 p-4 rounded-xl bg-slate-50 border border-slate-200">{storageHealth.supported===true?<><div className="flex items-end justify-between gap-3"><div><div className="text-[10px] font-black text-slate-400 uppercase">Used</div><div className="text-2xl font-black text-slate-900">{storageHealthApi?storageHealthApi.formatBytes(storageHealth.usage):'-'}</div></div><div className="text-xs font-black text-slate-500">{storageHealth.percent==null?'-':storageHealth.percent}% / {storageHealthApi?storageHealthApi.formatBytes(storageHealth.quota):'-'}</div></div><div className="h-2 bg-white rounded-full overflow-hidden mt-3"><div className={`h-full ${Number(storageHealth.percent)>80?'bg-red-500':Number(storageHealth.percent)>60?'bg-amber-400':'bg-blue-500'}`} style={{width:`${Math.min(100,Number(storageHealth.percent)||0)}%`}}></div></div></>:storageHealth.supported===false?<div className="text-xs font-bold text-slate-500">Browser นี้ไม่รายงาน Storage quota แต่ PackMaster ยังใช้งาน Local ได้</div>:<div className="text-xs font-bold text-slate-400">กำลังอ่านพื้นที่...</div>}</div>
                        <div className="flex flex-wrap gap-2 mt-4"><button onClick={refreshStorageHealth} disabled={storageHealthBusy} className="pm-secondary-btn"><PMIcon name="refresh"/> รีเฟรชพื้นที่</button>{selectedArchivedBatchIds.length>0?<button onClick={handleCleanupReprintImages} disabled={storageHealthBusy} className="pm-warning-btn">ล้างรูป Reprint ({selectedArchivedBatchIds.length})</button>:<button onClick={()=>{setBatchViewFilter('ARCHIVED');navigateView('batches');}} className="pm-ghost-btn">เลือก Archived Batch ก่อน Cleanup</button>}</div>
                      </div>

                      <div className="pm-card p-5 xl:col-span-2">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4"><div className="flex items-start gap-3"><div className="pm-feature-icon"><PMIcon name="activity"/></div><div><div className="pm-section-kicker">Pilot Diagnostics</div><h3 className="text-base font-black text-slate-900">Diagnostics แบบไม่รวมข้อมูลลูกค้า</h3><p className="text-xs font-semibold text-slate-400 mt-1">Export เฉพาะข้อมูล aggregate / capabilities สำหรับตรวจ Pilot และ Browser health</p></div></div><div className="flex gap-2"><button onClick={()=>handleDownloadDiagnostics('json')} className="pm-secondary-btn"><PMIcon name="download"/> JSON</button><button onClick={()=>handleDownloadDiagnostics('csv')} className="pm-secondary-btn"><PMIcon name="download"/> CSV</button></div></div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-5"><div className="pm-mini-stat"><span>Version</span><strong className="!text-sm">{PILOT_VERSION}</strong></div><div className="pm-mini-stat"><span>IndexedDB</span><strong className="!text-sm">{window.indexedDB?'พร้อม':'ไม่พร้อม'}</strong></div><div className="pm-mini-stat"><span>WebCrypto</span><strong className="!text-sm">{window.crypto&&window.crypto.subtle?'พร้อม':'ไม่พร้อม'}</strong></div><div className="pm-mini-stat"><span>Archived</span><strong>{archivedBatchCount}</strong></div></div>
                      </div>
                    </div>
                  </section>
                )}
              </main>
            </div>
          </div>


          {exportRenderOrder && <div className="fixed pointer-events-none opacity-0" style={{ top: 0, left: 0, width: '100mm', height: 0, overflow: 'hidden', zIndex: -100 }}>
            <div key={`render-arena-${exportRenderOrder.id}`} id={`render-target-${exportRenderOrder.id}`} style={{ position: 'relative', width: '100mm', height: '150mm', backgroundColor: 'white' }}>
              <LabelCard order={exportRenderOrder} thermalMode={thermalMode} isExport={true} />
            </div>
          </div>}
          {printRenderActive && <div className="hidden print-area w-full text-black">
            {PrintScopedOrders.map((order) => (<LabelCard key={`print-${order.id}`} order={order} thermalMode={thermalMode} isExport={true} />))}
          </div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
