name: PackMaster Production Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify pilot markers
        env:
          PROD_URL: https://0948910191g-tech.github.io/packmaster/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Production smoke attempt ${attempt}/18"
            html="$(curl -fsSL --max-time 20 "${PROD_URL}?smoke=${GITHUB_SHA}" || true)"
            if grep -Fq 'PackMaster Pilot' <<< "$html" \
              && grep -Fq 'href="./registry-sync.html"' <<< "$html" \
              && grep -Fq './packmaster-registry-identity.js' <<< "$html" \
              && grep -Fq './packmaster-cross-tab.js' <<< "$html" \
              && grep -Fq 'data-pm-registry-cloud-sync' <<< "$html" \
              && grep -Fq 'data-pm-registry-evidence' <<< "$html" \
              && grep -Fq './packmaster-storage-health.js' <<< "$html" \
              && grep -Fq './packmaster-diagnostics.js' <<< "$html" \
              && grep -Fq './packmaster-pilot-safety.js' <<< "$html" \
              && grep -Fq './packmaster-review-overrides.js' <<< "$html" \
              && grep -Fq './packmaster-manual-items.js' <<< "$html" \
              && grep -Fq './packmaster-upload-session.js' <<< "$html" \
              && grep -Fq './packmaster-review-keyword-suggestions.js' <<< "$html" \
              && grep -Fq './packmaster-batch-source-files.js' <<< "$html" \
              && grep -Fq './packmaster-print-scope.js' <<< "$html" \
              && grep -Fq './packmaster-print-flow.js' <<< "$html" \
              && grep -Fq 'ใช้กับ Order นี้' <<< "$html" \
              && grep -Fq "handleExportPDF('FULL_BATCH')" <<< "$html" \
              && grep -Fq "handlePrint('FULL_BATCH')" <<< "$html" \
              && grep -Fq 'data-pm-view="review"' <<< "$html" \
              && grep -Fq 'data-pm-review-layout="hybrid-grid"' <<< "$html" \
              && grep -Fq 'data-pm-batch-source-files' <<< "$html" \
              && grep -Fq 'data-pm-review-original-pdf' <<< "$html" \
              && grep -Fq 'data-pm-review-confirm-sku' <<< "$html" \
              && grep -Fq 'data-pm-review-confirm-qty' <<< "$html" \
              && grep -Fq 'data-pm-review-qty-override' <<< "$html" \
              && grep -Fq 'บันทึกชื่อจาก SKU ที่ตรงทะเบียน' <<< "$html" \
              && grep -Fq 'ยืนยันและผูกคู่ SKU/ข้อความใน Local' <<< "$html" \
              && grep -Fq 'data-pm-brand-chip' <<< "$html"; then
              echo "Production smoke passed"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose the expected PackMaster Review Confirmation UX V2 build within the retry window" >&2
          exit 1
