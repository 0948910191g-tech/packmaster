name: Verify PackMaster Phase 2 Browser

on:
  push:
    branches:
      - phase2-local-batch
    paths:
      - index.html
      - packmaster-batch.js
      - .github/workflows/verify-phase2-browser.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local PackMaster
        run: |
          python3 -m http.server 8080 >/tmp/packmaster-http.log 2>&1 &
          echo $! >/tmp/packmaster-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/packmaster-http.log
          exit 1

      - name: Create reload switch and delete batches in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });

            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch));
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor();

            await page.getByRole('button', { name: /สร้าง Batch/ }).first().click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const firstName = (await page.locator('h2').filter({ hasText: 'Batch #' }).first().textContent()).trim();
            assert.match(firstName, /Batch #001/);

            let stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 1, 'first batch should persist to IndexedDB');

            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor();
            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor();
            await page.getByText(firstName, { exact: true }).waitFor();

            await page.getByRole('button', { name: /สร้าง Batch ใหม่/ }).click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const secondName = (await page.locator('h2').filter({ hasText: 'Batch #' }).first().textContent()).trim();
            assert.match(secondName, /Batch #002/);
            assert.notEqual(secondName, firstName);

            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 2, 'two batches should coexist');

            await page.getByRole('button', { name: 'เปิดงาน' }).first().click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const openedName = (await page.locator('h2').filter({ hasText: 'Batch #' }).first().textContent()).trim();
            assert.equal(openedName, stored[0].name, 'opening newest card should load its own batch');

            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            page.once('dialog', dialog => dialog.accept());
            await page.locator('button[title="ลบ Batch"]').first().click();
            await page.waitForTimeout(300);
            stored = await page.evaluate(() => window.PackMasterBatch.listBatches());
            assert.equal(stored.length, 1, 'delete should remove only selected batch');

            if (errors.length) {
              throw new Error(`Browser errors detected:\n${errors.join('\n')}`);
            }

            console.log('PackMaster Phase 2 browser smoke passed');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
