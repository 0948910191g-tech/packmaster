name: Apply PackMaster Phase 3A Workspace UI

on:
  push:
    branches:
      - phase3-local-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3-local-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded index patch
        run: python3 .github/scripts/apply-phase3a-workspace.py

      - name: Workspace backup restore regression tests
        run: node tests/packmaster-workspace.test.mjs

      - name: Existing Smart Matcher regression tests
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Existing Local Batch regression tests
        run: node tests/packmaster-batch.test.mjs

      - name: JSX compile check
        run: |
          npm install --no-save --no-package-lock @babel/core @babel/preset-react
          node <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script type="text\/babel">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Babel application script not found');
          babel.transformSync(match[1], { presets: ['@babel/preset-react'] });
          console.log('JSX compile passed');
          NODE

      - name: Safety invariants
        run: |
          grep -F 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -F '{MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
          grep -F "const DB_VERSION = 1;" packmaster-batch.js
          git diff --check

      - name: Commit patched UI
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: integrate workspace backup restore UI"
          git push origin HEAD:phase3-local-hardening
