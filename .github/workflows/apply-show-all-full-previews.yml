name: Apply Show All Full Previews

on:
  push:
    branches:
      - fix-review-show-all-full-previews
    paths:
      - tools/apply-show-all-full-previews.py
      - .github/workflows/apply-show-all-full-previews.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-review-show-all-full-previews
          fetch-depth: 0
      - name: Apply targeted UI patch
        run: python tools/apply-show-all-full-previews.py
      - name: Verify contract before commit
        run: node tests/packmaster-full-review-preview.test.mjs
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: show every filtered order as a full preview"
          git push origin HEAD:fix-review-show-all-full-previews
