name: Apply Review Qty Resolution Fix

on:
  push:
    branches:
      - feature/review-confirmation-ux-v2
    paths:
      - scripts/apply-review-qty-resolution-fix.py
      - .github/workflows/apply-review-qty-resolution-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/review-confirmation-ux-v2
          fetch-depth: 1

      - name: Apply guarded Qty review patch
        run: python3 scripts/apply-review-qty-resolution-fix.py

      - name: Verify only index changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ "$changed" != "index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: resolve corrected Qty in Review"
          git push origin HEAD:feature/review-confirmation-ux-v2
