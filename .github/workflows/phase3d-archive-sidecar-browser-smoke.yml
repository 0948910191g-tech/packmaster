name: PackMaster Phase 3D Archive Sidecar Browser Smoke

on:
  push:
    branches:
      - phase3d-archive-sidecar-current-main
    paths:
      - .github/workflows/phase3d-archive-sidecar-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/packmaster-http.log 2>&1 &
          echo $! >/tmp/packmaster-http.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/packmaster-http.log
          exit 1

      - name: Exercise archive sidecar, legacy compatibility and cleanup
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Workspace restore file validation failed')) return;
              errors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch && window.PackMasterArchive && window.PackMasterStorageHealth), null, { timeout: 60000 });
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor({ timeout: 60000 });

            // New Batch metadata must stay on the frozen Phase 2 shape.
            await page.getByRole('button', { name: /สร้าง Batch/ }).first().click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const batchId = await page.evaluate(async () => (await window.PackMasterBatch.listBatches())[0].id);
            let loaded = await page.evaluate(id => window.PackMasterBatch.loadBatch(id), batchId);
            assert.equal(Object.prototype.hasOwnProperty.call(loaded.meta, 'archivedAt'), false, 'new Batch metadata must not gain archivedAt');
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();

            // Archive through real UI: state goes to localStorage sidecar only.
            await page.getByRole('button', { name: 'เก็บเข้าคลัง' }).first().click();
            let record = await page.evaluate(id => window.PackMasterArchive.getArchiveRecord(id), batchId);
            assert.ok(record && record.archivedAt, 'archive action must write sidecar');
            loaded = await page.evaluate(id => window.PackMasterBatch.loadBatch(id), batchId);
            assert.equal(Object.prototype.hasOwnProperty.call(loaded.meta, 'archivedAt'), false, 'archive action must not mutate IndexedDB Batch metadata');

            await page.getByRole('button', { name: /Archived/ }).click();
            await page.getByRole('button', { name: 'นำกลับ' }).waitFor();

            // Seed sanitized reprint payload while the Batch is closed, select it and run safe cleanup.
            await page.evaluate(async id => {
              const row = await window.PackMasterBatch.loadBatch(id);
              await window.PackMasterBatch.saveBatch(row.meta, [{
                id: 'sanitized-reprint-order', tracking: 'SANITIZED-TRACK', orderId: 'SANITIZED-ORDER', platform: 'TIKTOK',
                parsedItems: [], displayItems: ['SANITIZED OUTPUT'], originalQty: 1, qtyWarning: false, parserWarning: false,
                pdfImage: 'data:image/jpeg;base64,SANITIZED-HEAVY'
              }]);
            }, batchId);
            await page.locator('input[type="checkbox"]').first().check();
            page.once('dialog', dialog => dialog.accept());
            await page.getByRole('button', { name: /ล้างเฉพาะรูปสำหรับ Reprint/ }).click();
            await page.waitForTimeout(500);
            loaded = await page.evaluate(id => window.PackMasterBatch.loadBatch(id), batchId);
            assert.equal(Object.prototype.hasOwnProperty.call(loaded.orders[0], 'pdfImage'), false, 'safe cleanup must remove only reprint image');
            assert.equal(Object.prototype.hasOwnProperty.call(loaded.meta, 'archivedAt'), false);

            // Diagnostics must report effective archive state from the sidecar.
            const diagPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: 'ดาวน์โหลด Diagnostics' }).click();
            const diagDownload = await diagPromise;
            const diag = JSON.parse(fs.readFileSync(await diagDownload.path(), 'utf8'));
            assert.equal(diag.batches.filter(row => row.archived).length, 1);

            // Restore through UI writes an explicit null override to sidecar.
            await page.getByRole('button', { name: 'นำกลับ' }).click();
            record = await page.evaluate(id => window.PackMasterArchive.getArchiveRecord(id), batchId);
            assert.equal(record.archivedAt, null);
            loaded = await page.evaluate(id => window.PackMasterBatch.loadBatch(id), batchId);
            assert.equal(Object.prototype.hasOwnProperty.call(loaded.meta, 'archivedAt'), false);

            // Simulate a legacy Batch produced during the brief PR13 window.
            await page.evaluate(async id => {
              window.PackMasterArchive.clearBatchArchive(id);
              const row = await window.PackMasterBatch.loadBatch(id);
              await window.PackMasterBatch.saveBatch({ ...row.meta, archivedAt: '2026-08-08T12:00:00.000Z' }, row.orders);
            }, batchId);
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch && window.PackMasterArchive));
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor();
            await page.getByRole('button', { name: /Archived/ }).click();
            await page.getByRole('button', { name: 'นำกลับ' }).waitFor();
            await page.getByRole('button', { name: 'นำกลับ' }).click();
            record = await page.evaluate(id => window.PackMasterArchive.getArchiveRecord(id), batchId);
            assert.equal(record.archivedAt, null, 'sidecar null must override legacy archivedAt without migration');
            loaded = await page.evaluate(id => window.PackMasterBatch.loadBatch(id), batchId);
            assert.equal(loaded.meta.archivedAt, '2026-08-08T12:00:00.000Z', 'legacy metadata must remain read-only, not mass-migrated');
            await page.getByRole('button', { name: /^Active/ }).click();
            await page.getByRole('button', { name: 'เก็บเข้าคลัง' }).waitFor();

            // Archive again, back it up, mutate sidecar, then restore Backup through UI.
            await page.getByRole('button', { name: 'เก็บเข้าคลัง' }).click();
            await page.getByRole('button', { name: /คลังคำศัพท์/ }).click();
            await page.getByRole('heading', { name: 'คลังคำศัพท์' }).waitFor();
            const backupPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: /สำรอง Workspace/ }).click();
            const backupDownload = await backupPromise;
            const backupText = fs.readFileSync(await backupDownload.path(), 'utf8');
            const backup = JSON.parse(backupText);
            assert.ok(backup.settings.archiveState[batchId].archivedAt);

            await page.evaluate(id => window.PackMasterArchive.restoreBatch(id, new Date('2026-08-08T16:00:00.000Z')), batchId);
            const restoreInput = page.locator('input[type="file"][accept=".json,application/json"]');
            await restoreInput.setInputFiles({ name: 'archive-backup.json', mimeType: 'application/json', buffer: Buffer.from(backupText) });
            await page.getByText(/พร้อมกู้คืนจาก archive-backup.json/).waitFor();
            page.once('dialog', dialog => dialog.accept());
            await page.getByRole('button', { name: 'Replace Workspace' }).click();
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor({ timeout: 30000 });
            assert.ok(await page.evaluate(id => window.PackMasterArchive.getArchivedAt(id, null), batchId));

            // Malformed archive sidecar must be rejected during preview before any workspace write.
            await page.getByRole('button', { name: /คลังคำศัพท์/ }).click();
            const invalid = JSON.parse(backupText);
            invalid.settings.archiveState = { [batchId]: { archivedAt: 'not-a-date', touchedAt: 'bad' } };
            await page.locator('input[type="file"][accept=".json,application/json"]').setInputFiles({
              name: 'invalid-archive.json', mimeType: 'application/json', buffer: Buffer.from(JSON.stringify(invalid))
            });
            await page.getByText(/ไฟล์ Backup ใช้งานไม่ได้/).waitFor();
            assert.ok(await page.evaluate(id => window.PackMasterArchive.getArchivedAt(id, null), batchId));

            if (errors.length) throw new Error(`Unexpected browser errors:\n${errors.join('\n')}`);
            console.log('PackMaster archive sidecar browser smoke passed');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Stop local app
        if: always()
        run: |
          if [ -f /tmp/packmaster-http.pid ]; then kill $(cat /tmp/packmaster-http.pid) || true; fi
