name: Production Smoke Marker Branch Test

on:
  push:
    branches:
      - fix-production-smoke-review-marker

permissions:
  contents: read

jobs:
  marker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/packmaster-production-smoke-workflow.test.mjs
