name: PackMaster Phase 3A TDD

on:
  push:
    branches:
      - phase3-local-hardening

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Workspace backup restore tests
        run: node tests/packmaster-workspace.test.mjs

      - name: Smart matcher regression tests
        if: always()
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Local batch regression tests
        if: always()
        run: node tests/packmaster-batch.test.mjs
