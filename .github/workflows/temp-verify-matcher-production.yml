name: Temporary Verify Matcher Safety Production

on:
  push:
    branches:
      - agent/matcher-safety-reset-20260827
    paths:
      - .github/workflows/temp-verify-matcher-production.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed matcher and keyword safety markers
        env:
          PROD_URL: https://0948910191g-tech.github.io/packmaster/
          EXPECTED_SHA: 9cc7e1f7ebec259f2d929a005e274425c50f9aa1
        run: |
          set -euo pipefail
          index_html="$(curl -fsSL --max-time 30 "${PROD_URL}?verify=${EXPECTED_SHA}")"
          keyword_js="$(curl -fsSL --max-time 30 "${PROD_URL}packmaster-keyword-assistant.js?verify=${EXPECTED_SHA}")"

          grep -Fq 'const BRAND_CONCEPTS' <<< "$index_html"
          grep -Fq "reasons.push('brand-conflict')" <<< "$index_html"
          grep -Fq "reasons.push('pack-vs-sheet-conflict')" <<< "$index_html"
          grep -Fq 'exact-weak-identity:' <<< "$index_html"
          grep -Fq 'weak-identity:' <<< "$index_html"

          grep -Fq 'const assessStaticKeywordSafety' <<< "$keyword_js"
          grep -Fq "reason: 'long-title-review'" <<< "$keyword_js"
          grep -Fq "reason: 'brand-generic-only'" <<< "$keyword_js"

          echo "Deployed Matcher Safety Reset markers verified on GitHub Pages"
