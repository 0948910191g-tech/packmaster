name: PackMaster Full Review Preview Chromium Smoke

on:
  push:
    branches:
      - frontend-v3-full-review-preview
    paths:
      - index.html
      - .github/workflows/full-review-preview-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-v3-full-review-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/packmaster-full-preview-server.log 2>&1 &
          echo $! >/tmp/packmaster-full-preview-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/packmaster-full-preview-server.log
          exit 1
      - name: Exercise full review preview
        run: |
          cat > full-review-preview-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[];
          const consoleErrors=[];
          page.on('pageerror', e=>pageErrors.push(String(e)));
          page.on('console', msg=>{if(msg.type()==='error') consoleErrors.push(msg.text());});
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg);};

          await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          await page.locator('[data-pm-shell="v3"]').waitFor();
          await page.waitForTimeout(500);

          await page.evaluate(async () => {
            localStorage.setItem('skuMappingRules', JSON.stringify([{id:'smoke-rule',keyword:'SMOKE SKU',shortName:'smoke5'}]));
            const api = window.PackMasterBatch;
            const meta = api.createBatchMeta([], new Date('2026-08-08T15:30:00Z'));
            const img = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200"><rect width="100%" height="100%" fill="white"/><text x="60" y="120" font-size="50" fill="black">SMOKE LABEL</text><rect x="50" y="180" width="700" height="800" fill="none" stroke="black" stroke-width="8"/></svg>');
            const orders = [1,2].map(i => ({
              id:`smoke-order-${i}`,
              tracking:`SMOKE-ORDER-00${i}`,
              parsedItems:[{text:'SMOKE SKU',qty:i}],
              pdfImage:img,
              platform:i===1?'SHOPEE':'TIKTOK',
              orderId:`SMOKE00${i}`,
              declaredTotalQty:null,
              parserWarning:false
            }));
            const savedMeta = api.buildBatchMeta(meta, {total:2,ready:2,reviewSku:0,reviewQty:0,unmapped:0}, {now:new Date('2026-08-08T15:30:00Z')});
            await api.saveBatch(savedMeta, orders);
          });

          await page.reload({waitUntil:'networkidle'});
          await page.getByRole('button',{name:'เปิดงาน',exact:true}).first().click();
          await page.locator('[data-pm-view="upload"]').waitFor();
          await page.getByRole('button',{name:'รีวิว & พิมพ์',exact:true}).first().click();
          await page.locator('[data-pm-review-preview="full"]').waitFor();
          await page.getByText('เห็น Label จริงก่อนพิมพ์ • 1 / 2',{exact:true}).waitFor();
          await page.getByText('SMOKE-ORDER-001',{exact:true}).waitFor();
          assert(await page.locator('[data-pm-action="review-preview-prev"]').isDisabled(),'Previous must be disabled on first order');
          assert(!(await page.locator('[data-pm-action="review-preview-next"]').isDisabled()),'Next must be enabled on first order');
          console.log('STEP 1 full preview default passed');

          await page.locator('[data-pm-action="review-preview-next"]').click();
          await page.getByText('SMOKE-ORDER-002',{exact:true}).waitFor();
          await page.getByText('เห็น Label จริงก่อนพิมพ์ • 2 / 2',{exact:true}).waitFor();
          assert(await page.locator('[data-pm-action="review-preview-next"]').isDisabled(),'Next must be disabled on last order');
          await page.locator('[data-pm-action="review-preview-prev"]').click();
          await page.getByText('SMOKE-ORDER-001',{exact:true}).waitFor();
          console.log('STEP 2 previous/next passed');

          const search = page.getByPlaceholder('ค้นหา Order / SKU / ชื่อภายใน');
          await search.fill('SMOKE-ORDER-002');
          await page.getByText('เห็น Label จริงก่อนพิมพ์ • 1 / 1',{exact:true}).waitFor();
          await page.getByText('SMOKE-ORDER-002',{exact:true}).waitFor();
          assert(await page.locator('[data-pm-action="review-preview-prev"]').isDisabled(),'Filtered previous must be disabled');
          assert(await page.locator('[data-pm-action="review-preview-next"]').isDisabled(),'Filtered next must be disabled');
          console.log('STEP 3 filtered preview/reset passed');

          await search.fill('NO-SUCH-ORDER');
          await page.getByText('ไม่พบรายการที่ตรงกับตัวกรอง',{exact:true}).waitFor();
          await search.fill('');
          await page.locator('[data-pm-review-preview="full"]').waitFor();
          console.log('STEP 4 empty state recovery passed');

          await page.getByRole('button',{name:'มุมมองรายการ',exact:true}).click();
          await page.getByText('SMOKE-ORDER-001',{exact:true}).waitFor();
          await page.getByRole('button',{name:'พรีวิวเต็มหน้า',exact:true}).click();
          await page.locator('[data-pm-review-preview="full"]').waitFor();
          await page.keyboard.press('ArrowRight');
          await page.getByText('SMOKE-ORDER-002',{exact:true}).waitFor();
          console.log('STEP 5 list toggle + keyboard navigation passed');

          assert(pageErrors.length===0,`Page errors: ${pageErrors.join(' | ')}`);
          const relevant=consoleErrors.filter(x=>!/favicon/i.test(x));
          assert(relevant.length===0,`Console errors: ${relevant.join(' | ')}`);
          await browser.close();
          console.log('PackMaster full review preview Chromium smoke passed');
          JS
          node full-review-preview-smoke.mjs
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/packmaster-full-preview-server.pid ]; then kill "$(cat /tmp/packmaster-full-preview-server.pid)" || true; fi

# rerun after declaration-order repair
