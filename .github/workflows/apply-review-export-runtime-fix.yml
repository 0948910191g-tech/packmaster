name: Apply Review Export Runtime Fix

on:
  push:
    branches:
      - fix/review-quick-mapping-print-override

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[review-export-runtime-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-quick-mapping-print-override
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime fix
        run: node scripts/fix-review-export-runtime.mjs
      - name: Verify targeted regression
        run: |
          node tests/packmaster-print-override-ui.test.mjs
          node tests/packmaster-review-quick-mapping.test.mjs
          node tests/packmaster-source-reference.test.mjs
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: review export scope runtime and copy [review-export-runtime-generated]"
          git push origin HEAD:fix/review-quick-mapping-print-override
