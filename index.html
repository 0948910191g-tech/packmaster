<body class="bg-[#f8fafc] text-blue-950 selection:bg-blue-200">
  <div id="root"></div>

  <script type="text/babel">
    if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => { const timer = setTimeout(() => onClose(), 3000); return () => clearTimeout(timer); }, [onClose]);
      return (
        <div className={`fixed top-6 right-6 z-[99999] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl border animate-in slide-in-from-right-8 duration-300 ${type === 'success' ? 'bg-white border-green-100 text-green-700' : 'bg-white border-red-100 text-red-600'}`}>
          <span className="text-xl">{type === 'success' ? '✅' : '❌'}</span>
          <span className="font-bold text-sm tracking-wide">{message}</span>
        </div>
      );
    };

    const thermalImagePromiseCache = new Map();

    const acquireThermalImage = (pdfImage) => {
      if (!pdfImage) return Promise.resolve('');
      let entry = thermalImagePromiseCache.get(pdfImage);
      if (!entry) {
        const promise = new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            try {
              const cvs = document.createElement('canvas');
              cvs.width = img.width;
              cvs.height = img.height;
              const ctx = cvs.getContext('2d');
              ctx.filter = 'grayscale(100%) brightness(80%) contrast(200%)';
              ctx.drawImage(img, 0, 0);
              const thermalImage = cvs.toDataURL('image/jpeg', 0.9);
              cvs.width = 1;
              cvs.height = 1;
              resolve(thermalImage);
            } catch (error) {
              thermalImagePromiseCache.delete(pdfImage);
              reject(error);
            }
          };
          img.onerror = () => {
            thermalImagePromiseCache.delete(pdfImage);
            reject(new Error('แปลงภาพ Thermal ไม่สำเร็จ'));
          };
          img.src = pdfImage;
        });
        entry = { refs: 0, promise };
        thermalImagePromiseCache.set(pdfImage, entry);
      }
      entry.refs += 1;
      return entry.promise;
    };

    const releaseThermalImage = (pdfImage) => {
      const entry = thermalImagePromiseCache.get(pdfImage);
      if (!entry) return;
      entry.refs = Math.max(0, (entry.refs || 0) - 1);
      if (entry.refs === 0) thermalImagePromiseCache.delete(pdfImage);
    };

    const LabelCard = ({ order, isExport = false, thermalMode = true }) => {
      const [displayImg, setDisplayImg] = useState(order.pdfImage);
      const shouldBakeThermal = Boolean(thermalMode && isExport);

      useEffect(() => {
        if (!order || !order.pdfImage) return;
        if (!shouldBakeThermal) {
          setDisplayImg(order.pdfImage);
          return;
        }

        let cancelled = false;
        setDisplayImg(order.pdfImage);
        acquireThermalImage(order.pdfImage)
          .then((thermalImage) => {
            if (!cancelled) setDisplayImg(thermalImage);
          })
          .catch((error) => {
            console.warn('Thermal preview fallback to original image', error);
            if (!cancelled) setDisplayImg(order.pdfImage);
          });

        return () => {
          cancelled = true;
          releaseThermalImage(order.pdfImage);
        };
      }, [order.pdfImage, shouldBakeThermal]);

      if (!order || !order.pdfImage) return null;

      const itemCount = order.displayItems ? order.displayItems.length : 0;
      let maxLen = itemCount > 0 ? Math.max(...order.displayItems.map(t => t.length), 0) : 0;

      let fontSize = '42pt';
      let lineHeight = 1.2;

      if (itemCount === 1) {
          fontSize = maxLen > 20 ? '18pt' : maxLen > 12 ? '24pt' : maxLen > 8 ? '32pt' : '40pt';
          lineHeight = 1.1;
      } else if (itemCount === 2) {
          fontSize = maxLen > 22 ? '13pt' : maxLen > 15 ? '16pt' : maxLen > 10 ? '20pt' : '22pt';
          lineHeight = 1.1;
      } else if (itemCount === 3) {
          fontSize = maxLen > 20 ? '11pt' : '13pt';
          lineHeight = 1.1;
      } else {
          fontSize = '10pt';
          lineHeight = 1.0;
      }

      return (
        <div className={`shrink-0 box-border ${isExport ? '' : 'border-2 border-blue-50 shadow-xl shadow-blue-900/5 rounded-2xl'}`} style={{ width: '100mm', height: '150mm', backgroundColor: '#ffffff', position: 'relative', overflow: 'hidden', pageBreakAfter: 'always', margin: 0, display: 'block', isolation: 'isolate' }}>
          <img src={displayImg} alt="Label Base" loading={isExport ? 'eager' : 'lazy'} decoding={isExport ? 'sync' : 'async'} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'fill', zIndex: 0, filter: thermalMode && !isExport ? 'grayscale(100%) brightness(80%) contrast(200%)' : 'none' }} />

          {order.displayItems && order.displayItems.length > 0 && (
            <div className="label-overlay" style={{ position: 'absolute', zIndex: 10, boxSizing: 'border-box', bottom: '24px', left: '16px', right: '16px', height: '18%', border: '4px dashed #172554', borderRadius: '14px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '8px', gap: '4px', backgroundColor: 'rgba(255,255,255,0.90)', backdropFilter: 'blur(2px)', overflow: 'hidden' }}>
              {order.displayItems.map((text, idx) => (
                <p key={idx} className="label-overlay-text" style={{ fontFamily: '"Noto Sans Thai", sans-serif', fontWeight: 800, color: '#172554', lineHeight: lineHeight, margin: 0, textAlign: 'center', wordBreak: 'break-word', width: '100%', letterSpacing: '-0.02em', fontSize: fontSize, textShadow: '3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 2px 4px 8px rgba(23, 37, 84, 0.15)' }}>
                  {text}
                </p>
              ))}
            </div>
          )}
        </div>
      );
    };

    const normalizeRuleKeyword = (value) => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');

    const normalizeMatchText = (str) => String(str || '').toLowerCase()
        .replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ')
        .replace(/[\uF700-\uF71A]/g, '')
        .replace(/\u0E33/g, 'า')
        .replace(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g, '')
        .replace(/[!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\bbb\b/g, 'baby');

    const COMMON_MATCH_TERMS = new Set(['baby', 'wipes', 'wipe', 'ทชชเปยก', 'ผาเปยก']);
    const BRAND_CONCEPTS = {
      HOYA: ['hoya', 'โฮย่า'],
      HAKU: ['haku', 'ฮากุ'],
      EXCARE: ['excare', 'เอ็กซ์แคร์'],
      NONO: ['nono', 'นอนโน่'],
      SOULSI: ['soulsi', 'โซลซี่']
    };
    const BRAND_MATCH_TERMS = new Set(
      Object.values(BRAND_CONCEPTS).flat().map(alias => normalizeMatchText(alias)).filter(Boolean)
    );
    const RULE_UNIT_TOKENS = new Set(['หอ', 'แพค', 'pack', 'packs', 'ลัง', 'case', 'x', 'ชน', 'ชิ้น', 'แผน']);
    const VARIANT_CONCEPTS = {
      VALUE_PACK: ['value pack', 'valuepack', 'แวลู', 'แวล'],
      PLUS: ['plus', 'พลส', 'พลัส'],
      COOLING: ['cooling', 'คูลลิง', 'คูลลิ่ง', 'สูตรเย็น', 'เย็นติดแอร', 'ติดแอร'],
      EXTRA: ['extra', 'เอ็กซตรา', 'เอกซตรา', 'เอ็กซ์ตร้า'],
      MENTHOL: ['menthol', 'เมนทอล'],
      LAVENDER: ['lavender', 'ลาเวนเดอร'],
      JASMINE: ['jasmine', 'มะลิ'],
      MIX: ['mix', 'คละ'],
      PURPLE: ['สีม่วง', 'เด้งม่วง'],
      PINK: ['สีชมพู', 'ชมพู', 'เด้งชม'],
      NONO: ['nono'],
      ALCOHOL: ['alcohol', 'alc', 'แอลกอฮอล']
    };
    const HARD_VARIANT_CONCEPTS = new Set(['VALUE_PACK', 'PLUS', 'EXTRA', 'MENTHOL', 'LAVENDER', 'JASMINE', 'MIX']);
    const STRUCTURED_COLOR_CONCEPTS = new Set(['PURPLE', 'PINK']);

    const getVariantConcepts = (value) => {
      const text = normalizeMatchText(value);
      const concepts = new Set();
      Object.entries(VARIANT_CONCEPTS).forEach(([concept, aliases]) => {
        if (aliases.some(alias => text.includes(normalizeMatchText(alias)))) concepts.add(concept);
      });
      return concepts;
    };

    const extractPackTokens = (value) => {
      const text = normalizeMatchText(value);
      const tokens = new Set();
      const regex = /(\d{1,3})\s*(หอ|แพค|packs?|ลัง|case)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const unit = /ลัง|case/.test(match[2]) ? 'case' : 'pack';
        tokens.add(`${parseInt(match[1], 10)}:${unit}`);
      }
      return tokens;
    };

    const extractSheetNumbers = (value) => {
      const text = normalizeMatchText(value);
      const numbers = new Set();
      const regex = /(\d{1,3})\s*(แผน|sheets?)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const amount = parseInt(match[1], 10);
        if (Number.isFinite(amount)) numbers.add(amount);
      }
      return numbers;
    };

    const tokenMatchesSearch = (token, searchArea) => {
      if (!token) return false;
      if (/^\d{1,4}$/.test(token)) {
        const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`(^|\\D)${escaped}(?!\\d)`).test(searchArea);
      }
      if (/^[a-z0-9]+$/.test(token)) {
        const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`(^|[^a-z0-9])${escaped}(?![a-z0-9])`).test(searchArea);
      }
      return searchArea.includes(token);
    };

    const getBrandConcepts = (value) => {
      const text = normalizeMatchText(value);
      const brands = new Set();
      Object.entries(BRAND_CONCEPTS).forEach(([brand, aliases]) => {
        if (aliases.some(alias => tokenMatchesSearch(normalizeMatchText(alias), text))) brands.add(brand);
      });
      return brands;
    };

    const extractRulePackNumbers = (value) => {
      const clean = normalizeMatchText(value);
      const explicit = extractPackTokens(clean);
      if (explicit.size > 0) {
        return new Set([...explicit].map(token => parseInt(token.split(':')[0], 10)).filter(Number.isFinite));
      }
      const trailing = clean.match(/(?:^|\s)(\d{1,3})\s*$/);
      return trailing ? new Set([parseInt(trailing[1], 10)]) : new Set();
    };

    const extractTextPackNumbers = (value) => new Set(
      [...extractPackTokens(value)].map(token => parseInt(token.split(':')[0], 10)).filter(Number.isFinite)
    );

    const extractBundleSignature = (value) => {
      const compact = normalizeMatchText(value).replace(/\s+/g, '');
      const match = compact.match(/(\d{1,3})(?:แถม|free)(\d{1,3})/i);
      return match ? `${parseInt(match[1], 10)}+${parseInt(match[2], 10)}` : null;
    };

    const bundleCompatible = (ruleText, searchText) => {
      const ruleBundle = extractBundleSignature(ruleText);
      const textBundle = extractBundleSignature(searchText);
      if (textBundle) return ruleBundle === textBundle;
      return !ruleBundle;
    };

    const scoreSkuRule = (rule, textToSearch, allRules = [], options = {}) => {
      const searchArea = normalizeMatchText(textToSearch);
      const cleanKw = normalizeMatchText(rule && rule.keyword);
      if (!searchArea || !cleanKw) return { rule, score: -Infinity, hardConflict: true, reason: 'empty' };

      let score = 0;
      let hardConflict = false;
      const reasons = [];
      const ruleTokens = cleanKw.split(' ').filter(Boolean);
      const matchedTokens = ruleTokens.filter(token => tokenMatchesSearch(token, searchArea));
      const coverage = ruleTokens.length ? matchedTokens.length / ruleTokens.length : 0;
      const textConcepts = getVariantConcepts(searchArea);
      const ruleConcepts = getVariantConcepts(cleanKw);
      if (options && options.includeOutputVariantConcepts) {
        getVariantConcepts(rule && rule.shortName).forEach(concept => ruleConcepts.add(concept));
      }
      const textBrands = getBrandConcepts(searchArea);
      const ruleBrands = getBrandConcepts(cleanKw);
      const sharedBrand = [...ruleBrands].some(brand => textBrands.has(brand));
      const hasBrandIdentity = ruleBrands.size > 0 && textBrands.size > 0 && sharedBrand;
      const textBundle = extractBundleSignature(searchArea);
      const ruleBundle = extractBundleSignature(cleanKw);

      if (ruleBrands.size > 0 && textBrands.size > 0 && !sharedBrand) {
        score -= 320;
        hardConflict = true;
        reasons.push('brand-conflict');
      }

      if (options && options.includeOutputVariantConcepts) {
        const textColors = [...STRUCTURED_COLOR_CONCEPTS].filter(concept => textConcepts.has(concept));
        const ruleColors = [...STRUCTURED_COLOR_CONCEPTS].filter(concept => ruleConcepts.has(concept));
        if (textColors.length > 0 && ruleColors.length > 0 && !ruleColors.some(concept => textConcepts.has(concept))) {
          score -= 240;
          hardConflict = true;
          reasons.push('seller-color-conflict');
        }
      }

      if (textBundle || ruleBundle) {
        if (textBundle && ruleBundle === textBundle) {
          score += 180;
          reasons.push(`bundle:${textBundle}`);
        } else {
          score -= 240;
          hardConflict = true;
          reasons.push(textBundle ? 'bundle-mismatch' : 'missing-bundle');
        }
      }

      if (searchArea.includes(cleanKw)) {
        score += 140;
        reasons.push('exact');
      }
      if (coverage === 1) {
        score += 70;
        reasons.push('all-terms');
      } else if (coverage >= 0.75) {
        score += 25;
        reasons.push('partial-terms');
      }

      const specificTokens = ruleTokens.filter(token =>
        !/^\d{1,4}$/.test(token) &&
        !COMMON_MATCH_TERMS.has(token) &&
        !BRAND_MATCH_TERMS.has(token) &&
        !RULE_UNIT_TOKENS.has(token)
      );
      const matchedSpecific = specificTokens.filter(token => tokenMatchesSearch(token, searchArea));
      const hasConceptIdentity = [...ruleConcepts].some(concept => textConcepts.has(concept));
      if (specificTokens.length > 0 && matchedSpecific.length === 0 && !hasConceptIdentity) {
        score -= 220;
        hardConflict = true;
        reasons.push('identity-miss');
      }

      matchedTokens.forEach(token => {
        if (COMMON_MATCH_TERMS.has(token)) {
          score += 4;
          return;
        }
        if (/^\d{1,4}$/.test(token)) {
          score += 8;
          return;
        }
        const frequency = (Array.isArray(allRules) ? allRules : []).filter(candidate =>
          tokenMatchesSearch(token, normalizeMatchText(candidate && candidate.keyword))
        ).length;
        score += frequency <= 1 ? 18 : 9;
      });

      const textPackNumbers = extractTextPackNumbers(searchArea);
      const textSheetNumbers = extractSheetNumbers(searchArea);
      const rulePackNumbers = extractRulePackNumbers(cleanKw);
      let hasPackIdentity = false;
      if (rulePackNumbers.size > 0 && textPackNumbers.size > 0) {
        const packMatch = [...rulePackNumbers].some(number => textPackNumbers.has(number));
        if (packMatch) {
          hasPackIdentity = true;
          score += 50;
          reasons.push('pack');
        } else {
          score -= 200;
          hardConflict = true;
          reasons.push('pack-conflict');
        }
      } else if (rulePackNumbers.size > 0 && [...rulePackNumbers].some(number => textSheetNumbers.has(number))) {
        score -= 220;
        hardConflict = true;
        reasons.push('pack-vs-sheet-conflict');
      }

      ruleConcepts.forEach(concept => {
        if (textConcepts.has(concept)) {
          score += 40;
          reasons.push(`concept:${concept}`);
        } else {
          score -= HARD_VARIANT_CONCEPTS.has(concept) ? 160 : 35;
          if (HARD_VARIANT_CONCEPTS.has(concept)) hardConflict = true;
          reasons.push(`missing:${concept}`);
        }
      });

      HARD_VARIANT_CONCEPTS.forEach(concept => {
        if (textConcepts.has(concept) && !ruleConcepts.has(concept)) {
          score -= 200;
          hardConflict = true;
          reasons.push(`unexpected:${concept}`);
        }
      });

      const coolingFamilyConcepts = new Set(['MENTHOL', 'LAVENDER', 'JASMINE', 'EXTRA', 'MIX']);
      if (textConcepts.has('COOLING') && !ruleConcepts.has('COOLING') &&
          ![...ruleConcepts].some(concept => coolingFamilyConcepts.has(concept)) &&
          ruleTokens.includes('haku')) {
        score -= 180;
        hardConflict = true;
        reasons.push('cooling-generic-conflict');
      }

      const numericRuleTokens = ruleTokens.filter(token => /^\d{1,4}$/.test(token));
      if (numericRuleTokens.some(token => tokenMatchesSearch(token, searchArea)) &&
          [...ruleConcepts].every(concept => textConcepts.has(concept))) {
        score += 20;
        reasons.push('concept-number');
      }

      const hasCommonFamilyIdentity = matchedTokens.some(token => token === 'baby');
      const strongIdentity = Boolean(
        (textBundle && ruleBundle === textBundle) ||
        hasConceptIdentity ||
        matchedSpecific.length > 0 ||
        (hasBrandIdentity && hasCommonFamilyIdentity && hasPackIdentity)
      );

      return { rule, score, hardConflict, strongIdentity, reason: reasons.join(',') || 'weak' };
    };

    const normalizeOutputIdentity = (value) => normalizeMatchText(value).replace(/\s+/g, '');

    const getStructuredMarketplaceIdentity = (textToSearch) => {
      const raw = String(textToSearch || '');
      if (!raw.includes('|')) return '';

      const parts = raw.split('|').map(part => part.trim()).filter(Boolean);
      if (parts.length < 2) return '';

      const productText = parts[0];
      const identityParts = parts.slice(1);
      const productConcepts = getVariantConcepts(productText);
      const productPackTokens = extractPackTokens(productText);
      const bundleSignature = extractBundleSignature(productText);
      const identityBrands = getBrandConcepts(identityParts.join(' '));
      const productBrands = getBrandConcepts(productText);
      const structuredParts = [...identityParts];

      if (identityBrands.size === 0) {
        productBrands.forEach(brand => {
          const aliases = BRAND_CONCEPTS[brand];
          if (Array.isArray(aliases) && aliases[0]) structuredParts.push(aliases[0]);
        });
      }

      productPackTokens.forEach(token => {
        const [amount, unit] = token.split(':');
        if (!amount) return;
        structuredParts.push(`${amount} ${unit === 'case' ? 'ลัง' : 'ห่อ'}`);
      });

      productConcepts.forEach(concept => {
        const aliases = VARIANT_CONCEPTS[concept];
        if (Array.isArray(aliases) && aliases[0]) structuredParts.push(aliases[0]);
      });

      if (bundleSignature) {
        const [left, right] = bundleSignature.split('+');
        if (left && right) structuredParts.push(`${left}แถม${right}`);
      }

      return structuredParts.join(' ').trim();
    };

    const getConfidentStructuredMatch = (textToSearch, rules) => {
      const structuredIdentity = getStructuredMarketplaceIdentity(textToSearch);
      if (!structuredIdentity) return null;

      const candidates = (Array.isArray(rules) ? rules : [])
        .map(rule => scoreSkuRule(rule, structuredIdentity, rules, { includeOutputVariantConcepts: true }))
        .filter(candidate => Number.isFinite(candidate.score))
        .sort((a, b) => b.score - a.score);
      if (candidates.length === 0) return null;

      const best = candidates[0];
      const runnerUp = candidates[1] || null;
      const runnerUpScore = runnerUp ? runnerUp.score : -Infinity;
      if (best.hardConflict || !best.strongIdentity || best.score < 120) return null;

      if (runnerUp && !runnerUp.hardConflict &&
          normalizeOutputIdentity(runnerUp.rule && runnerUp.rule.shortName) !== normalizeOutputIdentity(best.rule && best.rule.shortName) &&
          best.score - runnerUp.score < 20) {
        return { status: 'ambiguous', rule: null, score: best.score, runnerUpScore, reason: 'structured-score-gap' };
      }

      return {
        status: 'matched',
        rule: best.rule,
        score: best.score,
        runnerUpScore,
        reason: `structured-field-identity:${best.reason}`
      };
    };

    const matchSkuRule = (textToSearch, rules) => {
      const searchArea = normalizeMatchText(textToSearch);
      const normalizedRules = (Array.isArray(rules) ? rules : [])
        .map(rule => ({ rule, cleanKw: normalizeMatchText(rule && rule.keyword) }))
        .filter(entry => entry.cleanKw);

      const exactMatches = normalizedRules
        .filter(entry => searchArea.includes(entry.cleanKw) && bundleCompatible(entry.cleanKw, searchArea))
        .sort((a, b) => b.cleanKw.length - a.cleanKw.length);

      if (exactMatches.length > 0) {
        const longestLength = exactMatches[0].cleanKw.length;
        const longest = exactMatches.filter(entry => entry.cleanKw.length === longestLength);
        const outputs = new Set(longest.map(entry => normalizeOutputIdentity(entry.rule && entry.rule.shortName)));
        if (outputs.size > 1) {
          return { status: 'ambiguous', rule: null, score: 1000, runnerUpScore: 1000, reason: 'exact-conflict' };
        }

        const exactRule = longest[0].rule;
        const structuredMatch = getConfidentStructuredMatch(textToSearch, rules);
        if (structuredMatch && structuredMatch.status === 'ambiguous') return structuredMatch;
        if (structuredMatch && structuredMatch.status === 'matched' &&
            normalizeOutputIdentity(structuredMatch.rule && structuredMatch.rule.shortName) !== normalizeOutputIdentity(exactRule && exactRule.shortName)) {
          return structuredMatch;
        }

        const structuredIdentity = getStructuredMarketplaceIdentity(textToSearch);
        const exactSafetyText = structuredIdentity || textToSearch;
        const exactSafetyScore = scoreSkuRule(
          exactRule,
          exactSafetyText,
          rules,
          { includeOutputVariantConcepts: true }
        );
        if (exactSafetyScore.hardConflict) {
          const failClosedToUnmatched = /brand-conflict|pack-vs-sheet-conflict/.test(exactSafetyScore.reason);
          return {
            status: failClosedToUnmatched ? 'unmatched' : 'ambiguous',
            rule: null,
            score: exactSafetyScore.score,
            runnerUpScore: structuredMatch ? structuredMatch.runnerUpScore : 0,
            reason: 'structured-exact-conflict:' + exactSafetyScore.reason
          };
        }
        if (!exactSafetyScore.strongIdentity) {
          return {
            status: 'unmatched',
            rule: null,
            score: exactSafetyScore.score,
            runnerUpScore: structuredMatch ? structuredMatch.runnerUpScore : 0,
            reason: 'exact-weak-identity:' + exactSafetyScore.reason
          };
        }

        return { status: 'matched', rule: exactRule, score: 1000, runnerUpScore: 0, reason: 'exact-longest' };
      }

      const candidates = normalizedRules
        .map(entry => scoreSkuRule(entry.rule, textToSearch, rules))
        .filter(candidate => Number.isFinite(candidate.score))
        .sort((a, b) => b.score - a.score);

      if (candidates.length === 0) {
        return { status: 'unmatched', rule: null, score: 0, runnerUpScore: 0, reason: 'no-rules' };
      }

      const best = candidates[0];
      const runnerUp = candidates[1] || null;
      const runnerUpScore = runnerUp ? runnerUp.score : -Infinity;

      if (best.hardConflict || !best.strongIdentity || best.score < 80) {
        const reason = !best.hardConflict && !best.strongIdentity ? `weak-identity:${best.reason}` : best.reason;
        return { status: 'unmatched', rule: null, score: best.score, runnerUpScore, reason };
      }

      if (runnerUp && !runnerUp.hardConflict &&
          normalizeOutputIdentity(runnerUp.rule && runnerUp.rule.shortName) !== normalizeOutputIdentity(best.rule && best.rule.shortName) &&
          best.score - runnerUp.score < 20) {
        return { status: 'ambiguous', rule: null, score: best.score, runnerUpScore, reason: 'score-gap' };
      }

      return { status: 'matched', rule: best.rule, score: best.score, runnerUpScore, reason: best.reason };
    };

    const parseExplicitTotalQty = (fullText, platform) => {
      const text = String(fullText || '');
      if (platform === 'TIKTOK') {
        const match = text.match(/Qty\s*Total\s*:\s*(\d{1,4})/i);
        return match ? parseInt(match[1], 10) : null;
      }
      const shopeeFooter = text.match(/Shopee\s*Order\s*No\.?\s*[A-Z0-9]+\s+(\d{1,4})\s*$/i);
      return shopeeFooter ? parseInt(shopeeFooter[1], 10) : null;
    };

    const toPositionedPdfItems = (textContent) => (textContent && Array.isArray(textContent.items) ? textContent.items : [])
      .map((item, index) => ({
        text: String(item && item.str || '').trim(),
        x: Number(item && item.transform && item.transform[4]) || 0,
        y: Number(item && item.transform && item.transform[5]) || 0,
        index
      }))
      .filter(item => item.text);

    const parseTikTokPositionedItems = (rawItems, declaredTotalQty = null) => {
      const entries = (Array.isArray(rawItems) ? rawItems : []).map((item, index) => ({
        text: String(item && (item.text ?? item.str) || '').trim(),
        x: Number(item && (item.x ?? (item.transform && item.transform[4]))) || 0,
        y: Number(item && (item.y ?? (item.transform && item.transform[5]))) || 0,
        index: Number.isFinite(item && item.index) ? item.index : index
      })).filter(item => item.text);

      const hasTableSignal = normalizeMatchText(entries.map(item => item.text).join(' ')).includes('product name');
      const qtyHeaders = entries.filter(item => normalizeMatchText(item.text) === 'qty');
      let header = null;

      for (const qtyHeader of qtyHeaders) {
        const sameLine = entries.filter(item => Math.abs(item.y - qtyHeader.y) <= 5);
        const lineText = normalizeMatchText(sameLine.map(item => item.text).join(' '));
        const sellerHeader = sameLine.find(item => normalizeMatchText(item.text).includes('seller'));
        const skuHeaders = sameLine
          .filter(item => /(^|\s)sku($|\s)/.test(normalizeMatchText(item.text)))
          .sort((a, b) => a.x - b.x);
        const firstSkuHeader = sellerHeader
          ? (skuHeaders.find(item => item.x < sellerHeader.x - 1) || skuHeaders[0])
          : skuHeaders[0];

        if (lineText.includes('product name') && firstSkuHeader && sellerHeader && qtyHeader.x > sellerHeader.x) {
          header = {
            y: qtyHeader.y,
            qtyX: qtyHeader.x,
            firstSkuX: firstSkuHeader.x,
            sellerX: sellerHeader.x
          };
          break;
        }
      }

      if (!header) {
        return { items: [], declaredTotalQty, parserWarning: hasTableSignal, reason: hasTableSignal ? 'header-not-found' : 'no-table' };
      }

      const qtyMarkers = entries.filter(item =>
        /^\d{1,4}$/.test(item.text) && Math.abs(item.x - header.qtyX) <= 14 && Math.abs(item.y - header.y) > 5
      );
      if (qtyMarkers.length === 0) {
        return { items: [], declaredTotalQty, parserWarning: true, reason: 'qty-column-empty' };
      }

      const nearest = [...qtyMarkers].sort((a, b) => Math.abs(a.y - header.y) - Math.abs(b.y - header.y))[0];
      const direction = Math.sign(nearest.y - header.y) || 1;
      const distance = item => (item.y - header.y) * direction;
      const markers = qtyMarkers
        .filter(item => distance(item) > 4)
        .sort((a, b) => distance(a) - distance(b));

      const items = [];
      let parserWarning = false;
      markers.forEach((marker, markerIndex) => {
        const currentDistance = distance(marker);
        const previousDistance = markerIndex > 0 ? distance(markers[markerIndex - 1]) : 4;
        const nextDistance = markerIndex < markers.length - 1 ? distance(markers[markerIndex + 1]) : Infinity;
        const lower = markerIndex === 0 ? 4 : (previousDistance + currentDistance) / 2;
        const upper = Number.isFinite(nextDistance) ? (currentDistance + nextDistance) / 2 : Infinity;

        const rowEntries = entries.filter(item => {
          const d = distance(item);
          return d >= lower && d < upper && item.index !== marker.index;
        });
        const productParts = rowEntries.filter(item => item.x < header.firstSkuX - 2).sort((a, b) => a.index - b.index);
        const skuParts = rowEntries.filter(item => item.x >= header.firstSkuX - 2 && item.x < header.sellerX - 2).sort((a, b) => a.index - b.index);
        const sellerParts = rowEntries.filter(item => item.x >= header.sellerX - 2 && item.x < header.qtyX - 5).sort((a, b) => a.index - b.index);
        const productText = productParts.map(item => item.text).join(' ').trim();
        const skuText = skuParts.map(item => item.text).join(' ').trim();
        const sellerText = window.PackMasterSkuNormalization.cleanPdfSellerSku(
          sellerParts.map(item => item.text).join(' '));
        const text = [productText, skuText, sellerText].filter(Boolean).join(' | ');
        const qty = parseInt(marker.text, 10);

        if (!text || !Number.isFinite(qty) || qty < 1) {
          parserWarning = true;
          return;
        }
        items.push({ text, qty, ...(sellerText ? { sellerSku: sellerText } : {}) });
      });

      if (items.length !== markers.length) parserWarning = true;
      return { items, declaredTotalQty, parserWarning, reason: parserWarning ? 'partial-row-parse' : 'positioned-columns' };
    };

    const parseShopeePositionedItems = (rawItems, declaredTotalQty = null) => {
      const entries = (Array.isArray(rawItems) ? rawItems : []).map((item, index) => ({
        text: String(item && (item.text ?? item.str) || '').trim(),
        x: Number(item && (item.x ?? (item.transform && item.transform[4]))) || 0,
        y: Number(item && (item.y ?? (item.transform && item.transform[5]))) || 0,
        index: Number.isFinite(item && item.index) ? item.index : index
      })).filter(item => item.text);

      const hashHeaders = entries.filter(item => item.text.trim() === '#');
      let header = null;

      for (const hashHeader of hashHeaders) {
        const sameLine = entries.filter(item => Math.abs(item.y - hashHeader.y) <= 6).sort((a, b) => a.x - b.x);
        const lineText = normalizeMatchText(sameLine.map(item => item.text).join(' '));
        if (!lineText.includes('ชอสนคา') || !lineText.includes('จานวน')) continue;

        const nonHash = sameLine.filter(item => item.index !== hashHeader.index);
        const productHeader = nonHash.find(item => normalizeMatchText(item.text).includes('ชอสนคา')) || nonHash[0];
        const qtyHeader = [...nonHash].reverse().find(item => normalizeMatchText(item.text).includes('จานวน')) || nonHash[nonHash.length - 1];
        if (!productHeader || !qtyHeader || qtyHeader.x <= productHeader.x) continue;

        header = {
          y: hashHeader.y,
          rowX: hashHeader.x,
          productX: productHeader.x,
          qtyX: qtyHeader.x
        };
        break;
      }

      const hasTableSignal = entries.some(item => item.text.trim() === '#') &&
        normalizeMatchText(entries.map(item => item.text).join(' ')).includes('ชอสนคา');

      if (!header) {
        return { items: [], declaredTotalQty, parserWarning: hasTableSignal, reason: hasTableSignal ? 'header-not-found' : 'no-table' };
      }

      const rowCandidates = entries.filter(item =>
        /^\d{1,2}$/.test(item.text) && Math.abs(item.x - header.rowX) <= 16 && Math.abs(item.y - header.y) > 5
      );
      if (rowCandidates.length === 0) {
        return { items: [], declaredTotalQty, parserWarning: true, reason: 'row-index-empty' };
      }

      const nearest = [...rowCandidates].sort((a, b) => Math.abs(a.y - header.y) - Math.abs(b.y - header.y))[0];
      const direction = Math.sign(nearest.y - header.y) || 1;
      const distance = item => (item.y - header.y) * direction;
      const sortedRows = rowCandidates.filter(item => distance(item) > 4).sort((a, b) => distance(a) - distance(b));
      const rowMarkers = [];
      let expected = 1;
      for (const candidate of sortedRows) {
        const rowNumber = parseInt(candidate.text, 10);
        if (rowNumber === expected) {
          rowMarkers.push(candidate);
          expected += 1;
        }
      }

      if (rowMarkers.length === 0) {
        return { items: [], declaredTotalQty, parserWarning: true, reason: 'row-sequence-empty' };
      }

      const footerDistances = entries
        .filter(item => {
          const normalized = normalizeMatchText(item.text);
          return normalized.includes('shopee order') || normalized.includes('powered by');
        })
        .map(distance)
        .filter(value => value > distance(rowMarkers[rowMarkers.length - 1]));
      const footerDistance = footerDistances.length ? Math.min(...footerDistances) : Infinity;

      const items = [];
      let parserWarning = false;

      rowMarkers.forEach((rowMarker, rowIndex) => {
        const currentDistance = distance(rowMarker);
        const previousDistance = rowIndex > 0 ? distance(rowMarkers[rowIndex - 1]) : 4;
        const nextDistance = rowIndex < rowMarkers.length - 1 ? distance(rowMarkers[rowIndex + 1]) : footerDistance;
        const lower = rowIndex === 0 ? 4 : (previousDistance + currentDistance) / 2;
        const upper = rowIndex < rowMarkers.length - 1
          ? (currentDistance + nextDistance) / 2
          : (Number.isFinite(footerDistance) ? footerDistance : Infinity);
        const rowEntries = entries.filter(item => {
          const d = distance(item);
          return d >= lower && d < upper && item.index !== rowMarker.index;
        });

        const qtyCandidates = rowEntries.filter(item =>
          /^\d{1,4}$/.test(item.text) && Math.abs(item.x - header.qtyX) <= 22
        ).sort((a, b) => {
          const aDistance = Math.abs(distance(a) - currentDistance) + Math.abs(a.x - header.qtyX) / 10;
          const bDistance = Math.abs(distance(b) - currentDistance) + Math.abs(b.x - header.qtyX) / 10;
          return aDistance - bDistance;
        });
        const qtyItem = qtyCandidates[0] || null;
        const qty = qtyItem ? parseInt(qtyItem.text, 10) : NaN;

        const productParts = rowEntries
          .filter(item => item.index !== (qtyItem && qtyItem.index) && item.x >= header.productX - 6 && item.x < header.qtyX - 8)
          .sort((a, b) => distance(a) - distance(b) || a.x - b.x || a.index - b.index);
        const productText = productParts.map(item => item.text).join(' ').trim();

        if (!productText || !Number.isFinite(qty) || qty < 1) {
          parserWarning = true;
          return;
        }
        items.push({ text: productText, qty });
      });

      if (items.length !== rowMarkers.length) parserWarning = true;
      return { items, declaredTotalQty, parserWarning, reason: parserWarning ? 'partial-row-parse' : 'positioned-columns' };
    };

    const hasQtyWarning = (items, declaredTotalQty, parserWarning = false) => {
      if (parserWarning) return true;
      if (!Number.isFinite(declaredTotalQty)) return false;
      const sum = (Array.isArray(items) ? items : []).reduce((total, item) => total + (parseInt(item && item.qty, 10) || 0), 0);
      return sum !== declaredTotalQty;

    const sanitizeSkuRule = (rule, fallbackId) => {
      if (!rule || typeof rule !== 'object') return null;
      if (typeof rule.keyword !== 'string' || typeof rule.shortName !== 'string') return null;

    const getAggregatedShortName = (baseName, qty, sourceKeyword = '') => {
      const cleanBaseName = String(baseName || '').trim().replace(/\u00A0/g, ' ');
      const normalizedQty = Math.max(1, parseInt(qty, 10) || 1);
      if (normalizedQty <= 1) return cleanBaseName;

      const numberMatches = Array.from(cleanBaseName.matchAll(/\d+/g));
      if (numberMatches.length === 0) return cleanBaseName;

      const isModelTarget = (match) => {
        const before = cleanBaseName.substring(0, match.index);
        return /(?:^|[\s/_-])(?:hoya|v|gen|air|pro|max|mini|plus|model|ver|version|type|ซีรีส์|รุ่น)[\s/_-]*$/i.test(before) || /[a-zA-Z]+$/.test(before);
      };

      const bundleSignature = extractBundleSignature(sourceKeyword) || extractBundleSignature(cleanBaseName);
      if (bundleSignature) {
        const componentQtys = bundleSignature.split('+').map(value => parseInt(value, 10)).filter(Number.isFinite);
        if (componentQtys.length > 0 && numberMatches.length >= componentQtys.length) {
          const targets = numberMatches.slice(-componentQtys.length);
          const aligned = targets.every((match, index) => parseInt(match[0], 10) === componentQtys[index]);
          if (aligned) {
            let result = cleanBaseName;
            for (let index = targets.length - 1; index >= 0; index--) {
              const target = targets[index];
              const replacement = String(componentQtys[index] * normalizedQty);
              result = `${result.substring(0, target.index)}${replacement}${result.substring(target.index + target[0].length)}`;
            }
            return result;
          }
        }
      }

      const words = cleanBaseName.split(/\s+/);
      const isModelWord = (w) => /^(?:hoya|v|gen|air|pro|max|mini|plus|model|ver|version|type|ซีรีส์|รุ่น)\s*\d+$/i.test(w) || /^[a-zA-Z]+\d+$/i.test(w);

      if (words.length >= 2 && words.every(w => /^[^\d\s]+\d+$/.test(w) && !isModelWord(w))) {
        return words.map(w => {
          const match = w.match(/^([^\d\s]+)(\d+)$/);
          return `${match[1]}${parseInt(match[2], 10) * normalizedQty}`;
        }).join(' ');
      }

      const isModelPair = (w1) => /(?:^|[\s/_-])(?:hoya|v|gen|air|pro|max|mini|plus|model|ver|version|type|ซีรีส์|รุ่น)$/i.test(w1);
      if (words.length >= 4 && words.length % 2 === 0 && words.every((w, i) => i % 2 === 0 ? /^[^\d\s]+$/.test(w) : /^\d+$/.test(w))) {
        let hasModel = false;
        for (let i = 0; i < words.length; i += 2) {
          if (isModelPair(words[i])) hasModel = true;
        }
        if (!hasModel) {
          const result = [];
          for (let i = 0; i < words.length; i += 2) {
            result.push(`${words[i]} ${parseInt(words[i + 1], 10) * normalizedQty}`);
          }
          return result.join(' ');
        }
      }

      const qtyMatches = numberMatches.filter(m => !isModelTarget(m));
      if (qtyMatches.length === 0) return cleanBaseName;

      const target = qtyMatches[qtyMatches.length - 1];
      const perItemQty = parseInt(target[0], 10);
      if (!Number.isFinite(perItemQty)) return cleanBaseName;

      const aggregatedQty = perItemQty * normalizedQty;
      return `${cleanBaseName.substring(0, target.index)}${aggregatedQty}${cleanBaseName.substring(target.index + target[0].length)}`;
    };

              const tableStartRegex = /(?:ชื่[\s\u200B]*อ[\s\u200B]*สิ[\s\u200B]*น[\s\u200B]*ค้[\s\u200B]*า|P[\s\u200B]*r[\s\u200B]*o[\s\u200B]*d[\s\u200B]*u[\s\u200B]*c[\s\u200B]*t|#\s*ชื่[\s\u200B]*อ)/i;
              const tableStartMatch = zone.match(tableStartRegex);

              if (tableStartMatch) {
                  zone = zone.substring(tableStartMatch.index);
                  zone = zone.replace(/(?:ชื่[\s\u200B]*อ[\s\u200B]*สิ[\s\u200B]*น[\s\u200B]*ค้[\s\u200B]*า|P[\s\u200B]*r[\s\u200B]*o[\s\u200B]*d[\s\u200B]*u[\s\u200B]*c[\s\u200B]*t[\s\u200B]*N[\s\u200B]*a[\s\u200B]*m[\s\u200B]*e|#\s*ชื่[\s\u200B]*อ)/gi, '');
                  zone = zone.replace(/(?:ตั[\s\u200B]*ว[\s\u200B]*เ[\s\u200B]*ลื[\s\u200B]*อ[\s\u200B]*ก|จ[\s\u200B]*[ำํา]+[\s\u200B]*น[\s\u200B]*ว[\s\u200B]*น|S[\s\u200B]*K[\s\u200B]*U|S[\s\u200B]*e[\s\u200B]*l[\s\u200B]*l[\s\u200B]*e[\s\u200B]*r|Q[\s\u200B]*t[\s\u200B]*y)/gi, '');

                  const footerRegex = /(?:[Ss]hopee\s*Order|[Oo]rder\s*No|[Pp]rint\s*Date|[Pp]age\s*\d|[Pp]owered\s*by|ผู้รับ\s*\(TO\)|[Tt]ikTok\s*Shop|[Oo]rder\s*ID|[Hh]opee|[Rr]der\s*No|[Rr]int\s*Date|[Aa]ge\s*\d|[Oo]wered|[Ii]kTok)/i;
                  const footerMatch = zone.match(footerRegex);
                  if (footerMatch) {
                      zone = zone.substring(0, footerMatch.index);
                  }
              }

              zone = zone.replace(/\b2\d{5}[A-Z0-9]{8,}\b/gi, '');
              zone = zone.replace(/\b12160\b/g, '');

              zone = zone.replace(/(?:ไม่ต้องเก็บเงิน|เก็บเงินปลายทาง|PICK[\s-]*UP|NDD|HOME|OFFICE|ROS|SUB|CON|LGN|DROP|Bulky)/gi, '');
              zone = zone.replace(/\b[A-Z0-9]{1,4}-\([A-Z0-9.]+\)/gi, '');
              zone = zone.replace(/\b[A-Z]+-[A-Z]\s+-\s+[ก-๙]+\b/gi, '');
              zone = zone.replace(/\b[A-Z0-9]+_[0-9]+_[A-Z0-9]+_[A-Z0-9-]+\b/gi, '');

              zone = zone.replace(/\b[A-Z]\d\s+[A-Z0-9]+-\d+\b/gi, '');
              zone = zone.replace(/\b[A-Z]\d-\([A-Z0-9.]+\)\b/gi, '');
              zone = zone.replace(/\b\d{3}[A-Z]\b/gi, '');
              zone = zone.replace(/\b\d{5}\b/g, '');
              zone = zone.replace(/\b0\d{8,9}\b/g, '');
              zone = zone.replace(/\b\d{6}[A-Z0-9]{5,}\b/gi, '');
              zone = zone.replace(/\b(?:TH|JT|SPX)[A-Z0-9]+\b/gi, '');
              zone = zone.replace(/\b\d{12,}\b/g, '');
              zone = zone.replace(/(?:บ้านเลขที่|เลขที่|หมู่ที่|หมู่|ม\.|ซอย|ซ\.|ถนน|ถ\.)\s*\d+[\/\d]*/g, '');
              zone = zone.replace(/\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/g, '');
              zone = zone.replace(/\d{1,2}:\d{2}/g, '');

              // 🟢 ตัดข้อความส่วนยอดรวมทิ้ง ป้องกันระบบดึงเลขผิดมาใส่ SKU
              const endOfTableRegex = /(?:จ[ำํา]นวนรวม|ยอดรวม|รวมทั้งสิ้น|Total\s*Qty|Qty\s*Total)/i;
              const endOfTableMatch = zone.match(endOfTableRegex);
              if (endOfTableMatch) {
                  zone = zone.substring(0, endOfTableMatch.index);
              }

              zone = zone.replace(/In\s*transit\s*by[\s:]*[\d\/:\s]+/gi, '');
              zone = zone.replace(/(?:TikTok\s*Shop|Shopee)/gi, '');

              let parsedItems = [];

              if (platform === 'TIKTOK') {
                  const tikTokResult = parseTikTokPositionedItems(positionedItems, declaredTotalQty);
                  parsedItems = tikTokResult.items;
                  parserWarning = tikTokResult.parserWarning;
              }

              if (platform === 'SHOPEE') {
                  const shopeePositionedResult = parseShopeePositionedItems(positionedItems, declaredTotalQty);
                  if (shopeePositionedResult.items.length > 0 || shopeePositionedResult.parserWarning) {
                      parsedItems = shopeePositionedResult.items;
                      parserWarning = shopeePositionedResult.parserWarning;
                  } else {
                  let remainingText = zone.trim();
                  let currentItemNum = 1;

                  let isNewFormat = false;
                  let firstMarker = remainingText.match(/(?:^|\s)1\s+(\d+)(?:\s+|$)/);
                  if (firstMarker) {
                      let textAfter = remainingText.substring(firstMarker.index + firstMarker[0].length);
                      if (textAfter.trim().length < 30 || textAfter.match(/(?:^|\s)2\s+(\d+)(?:\s+|$)/)) {
                          isNewFormat = true;
                      }
                  }

                  if (isNewFormat) {
                      while (remainingText.length > 0 && currentItemNum <= 20) {
                          let regex = new RegExp(`^(.*?)(?:^|\\s)${currentItemNum}\\s+(\\d+)(?:\\s+|$)`);
                          let match = remainingText.match(regex);
                          if (match) {
                              let textWithoutQty = match[1].replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ').trim();
                              let itemQty = parseInt(match[2], 10);

                              textWithoutQty = textWithoutQty.replace(/^\s*\d+([.)\]]|\s+)(?=[^\d]|$)/, '').trim();

                              parsedItems.push({ text: textWithoutQty, qty: itemQty });

                              remainingText = remainingText.substring(match[0].length).trim();
                              currentItemNum++;
                          } else {
                              break;
                          }
                      }
                  } else {
                      while (remainingText.length > 0 && currentItemNum <= 20) {
                          let prefixRegexStr = `(?:^|\\s)${currentItemNum}(?:\\s*[.)\\]]\\s*|\\s+|(?=\\(|\\[))`;
                          let currentPrefixRegex = new RegExp(prefixRegexStr);
                          let currentMatch = remainingText.match(currentPrefixRegex);

                          if (!currentMatch) break;

                          let nextPrefixRegex = new RegExp(`(?:^|\\s)${currentItemNum + 1}(?:\\s*[.)\\]]\\s*|\\s+|(?=\\(|\\[))`);
                          let nextMatch = remainingText.match(nextPrefixRegex);

                          if (nextMatch) {
                              let textAfterNext = remainingText.substring(nextMatch.index + nextMatch[0].length).trim();
                              let cleanAfter = textAfterNext.replace(/(?:ไม่ต้องเก็บเงิน|เก็บเงินปลายทาง|PICK[\s-]*UP|NDD|HOME|OFFICE|ROS)/gi, '').replace(/\b[A-Z0-9_-]+\b/gi, '').trim();
                              if (!/[a-zA-Zก-๙]/.test(cleanAfter) || cleanAfter.length < 5) {
                                  nextMatch = null;
                              }
                          }

                          let itemStr = '';
                          if (nextMatch) {
                              itemStr = remainingText.substring(currentMatch.index + currentMatch[0].length, nextMatch.index);
                              remainingText = remainingText.substring(nextMatch.index);
                          } else {
                              itemStr = remainingText.substring(currentMatch.index + currentMatch[0].length);
                              remainingText = '';
                          }

                          let textWithoutQty = itemStr.replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ').trim();
                          textWithoutQty = textWithoutQty.replace(/^\s*\d+([.)\]]|\s+)(?=[^\d]|$)/, '').trim();

                          let itemQty = 1;
                          let endDigitsMatch = textWithoutQty.match(/(\d+)\s*(?:หมายเหตุ|PICKUP|[Nn][Ss]|[-_]+)?\s*$/i);
                          if (endDigitsMatch) {
                              let prefixIdx = endDigitsMatch.index - 1;
                              let prefixChar = prefixIdx >= 0 ? textWithoutQty.charAt(prefixIdx) : ' ';

                              if (/\s|[ก-๙]|\)|\]|\}/.test(prefixChar) || prefixIdx < 0) {
                                  itemQty = parseInt(endDigitsMatch[1], 10);
                                  textWithoutQty = textWithoutQty.substring(0, endDigitsMatch.index).trim();
                              }
                          }

                          parsedItems.push({ text: textWithoutQty, qty: itemQty });
                          currentItemNum++;
                      }
                  }
                  }
              }

              if (parsedItems.length === 0 && platform !== 'TIKTOK' && !parserWarning) {
                  let itemStr = zone.trim();

                  let textWithoutQty = itemStr.replace(/[\u200B-\u200F\uFEFF\xA0]/g, ' ').trim();
                  textWithoutQty = textWithoutQty.replace(/^\s*\d+([.)\]]|\s+)(?=[^\d]|$)/, '').trim();

                  let itemQty = 1;
                  let endDigitsMatch = textWithoutQty.match(/(\d+)\s*(?:หมายเหตุ|PICKUP|[Nn][Ss]|[-_]+)?\s*$/i);
                  if (endDigitsMatch) {
                      let prefixIdx = endDigitsMatch.index - 1;
                      let prefixChar = prefixIdx >= 0 ? textWithoutQty.charAt(prefixIdx) : ' ';

                      if (/\s|[ก-๙]|\)|\]|\}/.test(prefixChar) || prefixIdx < 0) {
                          itemQty = parseInt(endDigitsMatch[1], 10);
                          textWithoutQty = textWithoutQty.substring(0, endDigitsMatch.index).trim();
                      }
                  }

                  parsedItems.push({ text: textWithoutQty, qty: itemQty });
              }

              const trackingMatch = fullText.match(/(TH\d{10,}|JT\d{10,}|SPX[A-Z0-9]+|KER[A-Z0-9]+|KA[A-Z0-9]+|66\d{10,}|82\d{10,}|\b\d{12}\b)/i);

              let currentOrderId = null;
              let orderMatch = fullText.match(/(?:Shopee\s*Order\s*No\.?|Order\s*ID)[\s:]*([A-Z0-9]+)/i);
              if (orderMatch) {
                  currentOrderId = orderMatch[1];
              }

              if (currentOrderId) {
                  let existingOrder = allNewOrders.find(o => o.orderId === currentOrderId && !o.isContinuation && o.sourceFileName === file.name);
                  if (existingOrder) {
                      const existingQty = (existingOrder.parsedItems || []).reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
                      const alreadyComplete = Number.isFinite(existingOrder.declaredTotalQty) && existingQty >= existingOrder.declaredTotalQty;
                      const itemsIdentical = existingOrder.parsedItems.length === parsedItems.length &&
                          existingOrder.parsedItems.every((item, idx) => item.text === parsedItems[idx]?.text && item.qty === parsedItems[idx]?.qty);
                      const sameTracking = Boolean(trackingMatch && existingOrder.tracking === trackingMatch[0]);
                      const isDuplicate = alreadyComplete || (itemsIdentical && sameTracking);

                      if (!isDuplicate) {
                          if (parsedItems.length > 0) {
                              existingOrder.parsedItems.push(...parsedItems);
                          }
                          if (Number.isFinite(declaredTotalQty)) existingOrder.declaredTotalQty = declaredTotalQty;
                          existingOrder.parserWarning = Boolean(existingOrder.parserWarning || parserWarning);

                          if (!existingOrder.tracking || existingOrder.tracking.startsWith('PAGE-')) {
                              existingOrder.tracking = trackingMatch ? trackingMatch[0] : existingOrder.tracking;
                          }

                          allNewOrders.push({
                              id: `label-${Date.now()}-${allNewOrders.length}-${i}`,
                              tracking: trackingMatch ? trackingMatch[0] : existingOrder.tracking,
                              parsedItems: [],
                              pdfImage,
                              sourceFileName: file.name,
                              sourcePage: i,
                              platform,
                              orderId: currentOrderId,
                              declaredTotalQty: null,
                              parserWarning: false,
                              isContinuation: true
                          });
                          continue;
                      }
                  }
              }

              allNewOrders.push({
                  id: `label-${Date.now()}-${allNewOrders.length}-${i}`,
                  tracking: trackingMatch ? trackingMatch[0] : `PAGE-${i}`,
                  parsedItems: parsedItems,
                  pdfImage,
                  sourceFileName: file.name,
                  sourcePage: i,
                  platform,
                  orderId: currentOrderId,
                  declaredTotalQty,
                  parserWarning
              });
              }
            } finally {
              if (pdf) await pdf.destroy();
            }
          }

          if (allNewOrders.length > 0) {
            const duplicateSignals = duplicateApi
              ? duplicateApi.findOrderDuplicateSignals(allNewOrders, orders)
              : [];

            if (duplicateSignals.length > 0) {
              const currentUploadCount = duplicateSignals.filter(signal => signal.source === 'current-upload').length;
              const existingHistoryCount = duplicateSignals.filter(signal => signal.source === 'existing-history').length;
              const duplicateSummary = [
                currentUploadCount > 0 ? `ซ้ำในรอบอัปโหลดนี้ ${currentUploadCount} รายการ` : '',
                existingHistoryCount > 0 ? `ซ้ำกับประวัติเดิม ${existingHistoryCount} รายการ` : ''
              ].filter(Boolean).join('\n');
              const importPossibleDuplicates = window.confirm(`พบ Order ที่อาจซ้ำกับข้อมูลใน Batch นี้ ${duplicateSignals.length} รายการ\n\n${duplicateSummary}\n\nระบบจะไม่ลบหรือรวม Qty ให้อัตโนมัติ\nกด OK หากตรวจแล้วต้องการนำเข้าต่อ หรือ Cancel เพื่อหยุดรอบนี้`);
              if (!importPossibleDuplicates) {
                showToast('ยกเลิกการเพิ่ม Order ที่อาจซ้ำ — ข้อมูลเดิมยังอยู่ครบ', 'error');
                return;
              }
            }

            const nextOrders = [...orders, ...allNewOrders];
            if (cloudMode) {
              if (!batchStorageReady || !batchApi || !uploadBatch) {
                throw new Error('Cloud Batch ยังไม่พร้อมบันทึก กรุณาโหลดข้อมูลอีกครั้ง');
              }
              // Commit the PDF-derived orders before showing success or changing local state.
              // Otherwise a 4 MiB Free-plan limit or network error can produce a phantom import.
              try {
                const meta = batchApi.buildBatchMeta(uploadBatch, reviewSummary, {
                  printedAt: null, resolvedSnapshot: null, now: new Date()
                });
                const storedMeta = await batchApi.saveBatch(meta, nextOrders);
                upsertBatchMeta(storedMeta);
              } catch (error) {
                error.cloudSaveFailed = true;
                throw error;
              }
            } else {
              if (batchStorageReady && batchApi && uploadBatch) {
                try {
                  const meta = batchApi.buildBatchMeta(uploadBatch, reviewSummary, {
                    printedAt: null, resolvedSnapshot: null, now: new Date()
                  });
                  const storedMeta = await batchApi.saveBatch(meta, nextOrders);
                  upsertBatchMeta(storedMeta);
                  if (reprintSnapshotApi && uploadBatch.printedAt) {
                    try { reprintSnapshotApi.clearBatchSnapshot(uploadBatch.id); }
                    catch (snapshotError) { console.warn('Clear legacy resolved snapshot after upload failed', snapshotError); }
                  }
                } catch (saveErr) {
                  console.error('Save upload batch failed', saveErr);
                }
              }
            }

            if (duplicateApi && acceptedSourceFiles.length > 0) {
              try {
                duplicateApi.appendBatchFingerprints(activeBatchId, acceptedSourceFiles);
              } catch (fingerprintSaveError) {
                console.error('Save duplicate fingerprint sidecar failed', fingerprintSaveError);
                showToast('นำเข้าได้ แต่บันทึกประวัติไฟล์ซ้ำใน LocalStorage ไม่สำเร็จ — กรุณา Backup ก่อนสลับ Batch', 'error');
              }
            }

            const currentLiveBatchId = (typeof window !== 'undefined' && window.__pmActiveBatchId !== undefined)
              ? window.__pmActiveBatchId
              : ((typeof activeBatchIdRef !== 'undefined' && activeBatchIdRef.current !== undefined)
                ? activeBatchIdRef.current
                : activeBatchId);

            if (currentLiveBatchId === uploadBatchId) {
              setOrders(nextOrders);
              setActiveTab('preview');
              setActiveView('review');
            }
            showToast(cloudMode
              ? `บันทึก Cloud สำเร็จแล้ว ${allNewOrders.length} ใบ`
              : `เพิ่มข้อมูลสำเร็จ ${allNewOrders.length} ใบ`, 'success');
          }
        } catch (err) {
          console.error(err);
          let errMsg = err.message || err.toString();
          setUploadError(`${err.cloudSaveFailed ? 'บันทึก Cloud ไม่สำเร็จ' : 'อ่านไฟล์ไม่สำเร็จ'}: ${errMsg}`);
          showToast(err.cloudSaveFailed
            ? 'บันทึกออเดอร์ขึ้น Cloud ไม่สำเร็จ — ยังไม่ได้เพิ่มออเดอร์ใน Batch'
            : 'อ่านไฟล์ไม่สำเร็จ', 'error');
        } finally {
          setLoadingStatus({ active: false, current: 0, total: 0 });
        }

        e.target.value = null;
      };

      const LiveMappedOrders = useMemo(() => orders.map(o => {
        if (o.parsedItems.length === 0) {
            if (o.isContinuation) return { ...o, displayItems: [], originalQty: 0, qtyWarning: false, resolvedAudit: [] };
            const skuAcknowledged = reviewOverridesApi ? reviewOverridesApi.getReviewAcknowledgement(o, 'sku') : false;
            const qtyAcknowledged = reviewOverridesApi ? reviewOverridesApi.getReviewAcknowledgement(o, 'qty') : false;
            const failedItems = [];
            if (!skuAcknowledged) failedItems.push('• ⚠️ ตรวจสอบ SKU');
            if (!qtyAcknowledged) failedItems.push('• ⚠️ ตรวจสอบ Qty');
            if (failedItems.length === 0) failedItems.push('• ⚠️ ตรวจสอบ SKU');
            return { ...o, displayItems: failedItems, originalQty: 0, qtyWarning: true, unresolvedSku: true, parserWarning: true, resolvedAudit: [] };
        }

        const skuMap = new Map();
        const resolvedAudit = [];
        let hasUnmatched = false;
        let hasAmbiguous = false;

        o.parsedItems.forEach((item, itemIndex) => {
            const effectiveQty = reviewOverridesApi ? reviewOverridesApi.getEffectiveItemQty(o, item, itemIndex) : item.qty;
            const manualOverride = reviewOverridesApi ? reviewOverridesApi.getManualSkuOverride(o, item.text, itemIndex) : null;
            if (manualOverride) {
                const baseName = manualOverride.shortName.trim().replace(/\u00A0/g, ' ');
                const current = skuMap.get(baseName) || { qty: 0, sourceKeyword: item.text || '' };
                skuMap.set(baseName, {
                    qty: current.qty + effectiveQty,
                    sourceKeyword: current.sourceKeyword || item.text || ''
                });
                resolvedAudit.push({ sourceText: item.text || '', effectiveQty, resolution: 'manual', keyword: item.text || '', shortName: baseName });
                return;
            }
            const match = getMatchResult(item, o.platform);
            if (match.status === 'matched' && match.rule) {
                const baseName = match.rule.shortName.trim().replace(/\u00A0/g, ' ');
                const current = skuMap.get(baseName) || { qty: 0, sourceKeyword: match.rule.keyword || '' };
                skuMap.set(baseName, {
                    qty: current.qty + effectiveQty,
                    sourceKeyword: current.sourceKeyword || match.rule.keyword || ''
                });
                resolvedAudit.push({ sourceText: item.text || '', effectiveQty, resolution: 'registry', keyword: match.rule.keyword || '', shortName: baseName });
            } else if (match.status === 'ambiguous') {
                hasAmbiguous = true;
            } else {
                hasUnmatched = true;
            }
        });

        const finalDisplayItems = [];
        skuMap.forEach((entry, baseName) => {
            finalDisplayItems.push(`• ${getAggregatedShortName(baseName, entry.qty, entry.sourceKeyword)}`);
        });

        const skuAcknowledged = reviewOverridesApi ? reviewOverridesApi.getReviewAcknowledgement(o, 'sku') : false;
        const qtyAcknowledged = reviewOverridesApi ? reviewOverridesApi.getReviewAcknowledgement(o, 'qty') : false;
        if (hasAmbiguous || (o.parserWarning && !skuAcknowledged)) finalDisplayItems.push('• ⚠️ ตรวจสอบ SKU');
        if (hasUnmatched) finalDisplayItems.push('• ยังไม่ตั้งชื่อ');

        const totalQty = o.parsedItems.reduce((sum, item, itemIndex) => {
          const qty = reviewOverridesApi ? reviewOverridesApi.getEffectiveItemQty(o, item, itemIndex) : item.qty;
          return sum + (parseInt(qty, 10) || 0);
        }, 0);
        const legacyQtyOverrideAmbiguous = reviewOverridesApi ? reviewOverridesApi.hasAmbiguousLegacyQtyOverride(o) : false;
        const qtyWarning = hasQtyWarning(o.parsedItems, o.declaredTotalQty, o.parserWarning) || legacyQtyOverrideAmbiguous;
        if (qtyWarning && (!qtyAcknowledged || legacyQtyOverrideAmbiguous)) finalDisplayItems.push('• ⚠️ ตรวจสอบ Qty');

        if (finalDisplayItems.length === 0) {
            finalDisplayItems.push('ยังไม่ตั้งชื่อ (ไม่พบ Seller SKU ในทะเบียน)');
        }
        if (finalDisplayItems.length === 1 && finalDisplayItems[0].startsWith('• ')) {
            finalDisplayItems[0] = finalDisplayItems[0].substring(2);
        }

        return { ...o, displayItems: finalDisplayItems, originalQty: totalQty, qtyWarning, unresolvedSku: hasAmbiguous, resolvedAudit };
      }), [orders, getMatchResult, reviewOverridesApi]);

      const historicalSnapshot = useMemo(() => {
        if (!activeBatchId || !activeBatch?.printedAt || !reprintSnapshotApi) return null;
        if (activeBatch.resolvedSnapshot) return activeBatch.resolvedSnapshot;
        try { return reprintSnapshotApi.getBatchSnapshot(activeBatchId); }
        catch (error) { console.error('Resolved reprint snapshot is unreadable', error); return null; }
      }, [activeBatchId, activeBatch && activeBatch.printedAt,
        activeBatch && activeBatch.resolvedSnapshot, reprintSnapshotApi, reprintSnapshotVersion]);

      const MappedOrders = useMemo(() => {
        if (!activeBatch?.printedAt) return LiveMappedOrders;
        if (historicalSnapshot && reprintSnapshotApi) {
          const applied = reprintSnapshotApi.applyBatchSnapshot(LiveMappedOrders, historicalSnapshot);
          if (applied.ok) return applied.orders;
          console.error('Resolved reprint snapshot does not match current Batch', applied.reason);
        }
        return LiveMappedOrders.map(order => order.isContinuation ? { ...order, historicalSnapshotMissing: true } : {
          ...order,
          displayItems: [...(order.displayItems || []), '• ⚠️ ประวัติผลพิมพ์เดิมไม่ครบ — ตรวจสอบก่อน Reprint'],
          unresolvedSku: true,
          historicalSnapshotMissing: true
        });
      }, [LiveMappedOrders, activeBatch && activeBatch.printedAt, historicalSnapshot, reprintSnapshotApi]);

      const getReviewFlags = useCallback((order) => {
        if (exceptionApi) {
          const flags = exceptionApi.getExceptionFlags(order);
          return {
            hasSkuReview: flags.reviewSku,
            hasQtyReview: flags.reviewQty,
            hasUnmapped: flags.unmapped,
            ready: flags.ready
          };
        }
        const outputText = (order.displayItems || []).join(' ');
        const hasSkuReview = outputText.includes('ตรวจสอบ SKU');
        const hasQtyReview = Boolean(order.qtyWarning || outputText.includes('ตรวจสอบ Qty'));
        const hasUnmapped = outputText.includes('ยังไม่ตั้งชื่อ');
        return { hasSkuReview, hasQtyReview, hasUnmapped, ready: !hasSkuReview && !hasQtyReview && !hasUnmapped };
      }, [exceptionApi]);

      const reviewSummary = useMemo(() => {
        return MappedOrders.reduce((summary, order) => {
          summary.total += 1;
          if (exceptionApi) {
            const primaryStatus = exceptionApi.getPrimaryStatus(exceptionApi.getExceptionFlags(order));
            if (primaryStatus === 'READY') summary.ready += 1;
            if (primaryStatus === 'REVIEW_SKU') summary.reviewSku += 1;
            if (primaryStatus === 'REVIEW_QTY') summary.reviewQty += 1;
            if (primaryStatus === 'UNMAPPED') summary.unmapped += 1;
            return summary;
          }

          const flags = getReviewFlags(order);
          if (flags.ready) summary.ready += 1;
          else if (flags.hasQtyReview) summary.reviewQty += 1;
          else if (flags.hasSkuReview) summary.reviewSku += 1;
          else if (flags.hasUnmapped) summary.unmapped += 1;
          return summary;
        }, { total: 0, ready: 0, reviewSku: 0, reviewQty: 0, unmapped: 0 });
      }, [MappedOrders, getReviewFlags]);

      const FilteredOrders = useMemo(() => {
        const query = reviewSearch.trim().toLowerCase();
        return MappedOrders.filter(order => {
          if (reviewPlatform !== 'ALL' && order.platform !== reviewPlatform) return false;

          const flags = getReviewFlags(order);
          if (reviewStatus === 'READY' && !flags.ready) return false;
          if (reviewStatus === 'REVIEW_SKU' && !flags.hasSkuReview) return false;
          if (reviewStatus === 'REVIEW_QTY' && !flags.hasQtyReview) return false;
          if (reviewStatus === 'UNMAPPED' && !flags.hasUnmapped) return false;

          if (!query) return true;
          const searchArea = [
            order.tracking,
            order.orderId,
            order.platform,
            order.sourceFileName,
            order.sourcePage,
            ...(order.displayItems || []),
            ...(order.parsedItems || []).map(item => item.text)
          ].filter(Boolean).join(' ').toLowerCase();
          return searchArea.includes(query);
        });
      }, [MappedOrders, reviewSearch, reviewPlatform, reviewStatus, getReviewFlags]);

      const exceptionRows = useMemo(() =>
        exceptionApi ? exceptionApi.buildExceptionRows(MappedOrders) : [],
      [MappedOrders]);
      const PrintScopedOrders = useMemo(() => printScopeApi
        ? printScopeApi.selectPrintOrders(MappedOrders, printScopeMode, order => getReviewFlags(order).ready)
        : (printScopeMode === 'READY_ONLY' ? MappedOrders.filter(order => getReviewFlags(order).ready) : MappedOrders),
      [MappedOrders, printScopeMode, getReviewFlags]);

      const filteredExceptionRows = useMemo(() =>
        exceptionApi ? exceptionApi.filterExceptionRows(exceptionRows, exceptionType, exceptionSearch) : exceptionRows,
      [exceptionRows, exceptionType, exceptionSearch]);

      const safeExceptionCursor = filteredExceptionRows.length > 0
        ? Math.min(exceptionCursor, filteredExceptionRows.length - 1)
        : 0;
      const currentException = filteredExceptionRows[safeExceptionCursor] || null;

      useEffect(() => { setExceptionCursor(0); }, [exceptionType, exceptionSearch, activeBatchId]);

      const moveExceptionCursor = (delta) => {
        if (filteredExceptionRows.length === 0) return;
        setExceptionCursor(prev => Math.max(0, Math.min(filteredExceptionRows.length - 1, prev + delta)));
      };

      const openExceptionInTable = (row) => {
        if (!row || !row.order) return;
        setPreviewMode('table');
        setReviewPlatform('ALL');
        setReviewStatus('ALL');
        setReviewSearch(row.order.tracking || row.order.orderId || '');
      };

      const getReviewSourceText = (row) => {
        if (!row || !row.order) return '';
        const types = row.types || [];
        const parsedItems = Array.isArray(row.order.parsedItems) ? row.order.parsedItems : [];
        const unresolved = parsedItems.find((item, itemIndex) => {
          try {
            if (reviewOverridesApi?.getManualSkuOverride(row.order, item.text, itemIndex)) return false;
            return getMatchResult(item, row.order.platform).status !== 'matched';
          } catch (error) { return true; }
        });
        if (unresolved) return String(unresolved.text || '').trim();
        let seed = '';
        if (!cloudMode && pilotSafetyApi && types.some(type => type === 'REVIEW_SKU' || type === 'UNMAPPED')) {
          try { seed = pilotSafetyApi.getSkuFixSeed(row, getMatchResult) || ''; }
          catch (error) { console.warn('Pilot Safety seed unavailable', error); }
        }
        if (seed) return seed;
        return String(parsedItems[0]?.text || '').trim();
      };

      const getReviewSourceItemIndex = (row, sourceText) => {
        const items = Array.isArray(row?.order?.parsedItems) ? row.order.parsedItems : [];
        const exact = items.findIndex((item, itemIndex) => String(item?.text || '').trim() === String(sourceText || '').trim() &&
          !reviewOverridesApi?.getManualSkuOverride(row.order, item.text, itemIndex) &&
          (() => { try { return getMatchResult(item, row.order.platform).status !== 'matched'; } catch (_) { return true; } })());
        return exact >= 0 ? exact : items.findIndex(item => String(item?.text || '').trim() === String(sourceText || '').trim());
      };

      const getReviewKeywordSuggestions = (seed) => {
        if (!seed) return [];
        const batchItemTexts = orders.flatMap(order => (Array.isArray(order && order.parsedItems) ? order.parsedItems : []))
          .map(item => String(item && item.text || '').trim())
          .filter(Boolean);
        let suggestions = [];
        if (reviewKeywordSuggestionsApi && typeof reviewKeywordSuggestionsApi.generateReviewKeywordSuggestions === 'function') {
          try {
            suggestions = reviewKeywordSuggestionsApi.generateReviewKeywordSuggestions({
              sourceText: seed,
              existingRules: skuRules,
              batchItemTexts,
              maxSuggestions: 3,
              keywordAssistant: keywordAssistantApi,
              matchRule: matchSkuRule,
              matchNormalizer: normalizeMatchText
            });
          } catch (suggestionError) {
            console.warn('Review Keyword suggestions unavailable', suggestionError);
            suggestions = [];
          }
        } else if (keywordAssistantApi && typeof keywordAssistantApi.generateKeywordSuggestions === 'function') {
          suggestions = keywordAssistantApi.generateKeywordSuggestions({
            sourceText: seed,
            existingRules: skuRules,
            batchItemTexts,
            maxSuggestions: 3,
            safeOnly: true,
            matchRule: matchSkuRule,
            matchNormalizer: normalizeMatchText
          });
        }
        if (suggestions.length === 0 && reviewKeywordSuggestionsApi && typeof reviewKeywordSuggestionsApi.sanitizeSourceIdentity === 'function') {
          const fallback = reviewKeywordSuggestionsApi.sanitizeSourceIdentity(seed);
          if (fallback && (!keywordAssistantApi || !keywordAssistantApi.isGenericCandidate(fallback))) {
            suggestions = [{ value: fallback, confidence: 'review', reason: 'full-source-review', specificity: 'current-context-max', autoApply: false, autoSave: false }];
          }
        }
        return suggestions;
      };

      const handleFixSkuException = (row) => {
        if (!row || !row.order) return;
        const types = row.types || [];
        if (!types.some(type => type === 'REVIEW_SKU' || type === 'UNMAPPED')) {
          openExceptionInTable(row);
          return;
        }
        const seed = getReviewSourceText(row);
        if (!seed) {
          openExceptionInTable(row);
          showToast('ไม่พบข้อความสินค้าใน Order นี้ — กรุณาตรวจใบจริง', 'error');
          return;
        }
        const suggestions = cloudMode ? [] : getReviewKeywordSuggestions(seed);
        quickMapOpenerRef.current = document.activeElement;
        setQuickMapState({ open: true, row, sourceText: seed, itemIndex: getReviewSourceItemIndex(row, seed), keyword: '', shortName: '', suggestions });
      };

      const handleReviewException = (row) => {
        if (!row || !row.order) return;
        const types = row.types || [];
        if (types.some(type => type === 'REVIEW_SKU' || type === 'UNMAPPED')) {
          handleFixSkuException(row);
          return;
        }
        const seed = getReviewSourceText(row);
        quickMapOpenerRef.current = document.activeElement;
        setQuickMapState({ open: true, row, sourceText: seed, itemIndex: getReviewSourceItemIndex(row, seed), keyword: '', shortName: '', suggestions: [] });
      };

      const handleSetReviewConfirmation = async (type, confirmed) => {
        const targetOrderId = quickMapState.row?.order?.id;
        if (!targetOrderId || !reviewOverridesApi) return;
        if (!await resetActiveBatchCompletion()) return;
        setOrders(prev => prev.map(order => {
          if (order.id !== targetOrderId) return order;
          return confirmed
            ? reviewOverridesApi.confirmReview(order, type)
            : reviewOverridesApi.clearReviewConfirmation(order, type);
        }));
        setQuickMapState(prev => {
          if (!prev.row || !prev.row.order) return prev;
          const updatedOrder = confirmed
            ? reviewOverridesApi.confirmReview(prev.row.order, type)
            : reviewOverridesApi.clearReviewConfirmation(prev.row.order, type);
          return { ...prev, row: { ...prev.row, order: updatedOrder } };
        });
        const label = type === 'qty' ? 'Qty' : 'SKU';
        showToast((confirmed ? 'ยืนยันว่า ' : 'ยกเลิกการยืนยัน ') + label + (confirmed ? ' ถูกต้องแล้ว' : ' แล้ว'), 'success');
      };

      const handleSaveQtyReviewCorrections = async () => {
        const targetOrderId = quickMapState.row?.order?.id;
        const items = Array.isArray(quickMapState.row?.order?.parsedItems) ? quickMapState.row.order.parsedItems : [];
        if (!targetOrderId || !reviewOverridesApi || items.length === 0) return;
        const drafts = quickMapState.qtyDrafts || {};
        const corrections = items.map((item, itemIndex) => {
          const itemKey = reviewOverridesApi.getItemKey(itemIndex);
          const fallbackQty = reviewOverridesApi.getEffectiveItemQty(quickMapState.row.order, item, itemIndex);
          const rawDraft = Object.prototype.hasOwnProperty.call(drafts, itemKey) ? drafts[itemKey] : fallbackQty;
          return { item, itemIndex, qty: Number(rawDraft) };
        });
        if (corrections.some(entry => !Number.isInteger(entry.qty) || entry.qty < 1)) {
          showToast('Qty ที่แก้ต้องเป็นจำนวนเต็มตั้งแต่ 1 ขึ้นไป', 'error');
          return;
        }
        if (!await resetActiveBatchCompletion()) return;
        const applyQtyCorrections = (order) => {
          let next = corrections.reduce((current, entry) => reviewOverridesApi.upsertQtyOverride(current, entry.item, entry.itemIndex, entry.qty), order);
          next = reviewOverridesApi.confirmReview(next, 'qty');
          return next;
        };
        setOrders(prev => prev.map(order => order.id === targetOrderId ? applyQtyCorrections(order) : order));
        setQuickMapState(prev => prev.row?.order
          ? { ...prev, row: { ...prev.row, order: applyQtyCorrections(prev.row.order) } }
          : prev
        );
        showToast('บันทึก Qty ที่แก้และยืนยันแล้ว', 'success');
      };

      const handleApplyQuickOrderName = async () => {
        const shortName = String(quickMapState.shortName || '').trim();
        const sourceText = String(quickMapState.sourceText || '').trim();
        const targetOrderId = quickMapState.row?.order?.id;
        if (!shortName || !sourceText || !targetOrderId || !reviewOverridesApi) {
          showToast('กรุณาเลือกหรือกรอกชื่อภายในก่อนใช้กับ Order นี้', 'error');
          return;
        }
        if (!await resetActiveBatchCompletion()) return;
        setOrders(prev => prev.map(order => {
          if (order.id !== targetOrderId) return order;
          let next = reviewOverridesApi.upsertManualSkuOverride(order, sourceText, shortName, quickMapState.itemIndex);
          if ((quickMapState.row?.types || []).includes('REVIEW_SKU')) next = reviewOverridesApi.confirmReview(next, 'sku');
          return next;
        }));
        showToast('ใช้ชื่อกับ Order นี้แล้ว — ไม่ได้เพิ่ม Mapping ใหม่', 'success');
        setQuickMapState({ open: false, row: null, keyword: '', shortName: '' });
      };

      const persistRegistryAssignmentEvidence = async (platform, evidence, internalName) => {
        if (!registryMatcherApi || !registryIdentityApi ||
            !marketplaceCatalogIndex || !registryAssignmentsLoaded ||
            registryAssignmentsError || registryAssignmentsBusy) {
          throw new Error('Registry SKU mapping is not ready');
        }
        const canProceed = evidence?.status === 'found' || (evidence?.status === 'not_found' && evidence?.sellerSku);
        if (!canProceed) {
          throw new Error(evidence?.status === 'ambiguous'
            ? 'รายการนี้ยังระบุตัวเลือกในทะเบียนได้ไม่ชัดเจน'
            : 'ไม่พบแถวทะเบียนที่ระบุตัวได้แบบแน่นอน');
        }
        let next;
        try {
          next = registryMatcherApi.saveConfirmedAssignment(
            registryAssignments, marketplaceCatalogIndex, platform, evidence, internalName);
        } catch (err) {
          if (err?.message === 'Confirmed registry assignment requires productId' || err?.message?.includes('requires productId')) {
            throw new Error('ไม่พบแถวทะเบียนที่ระบุตัวได้แบบแน่นอน');
          }
          throw err;
        }
        setRegistryAssignmentsBusy(true);
        try {
          if (cloudMode) await cloud.saveRegistryAssignments(next);
          else registryMatcherApi.saveLocalAssignments(window.localStorage, next);
          setRegistryAssignments(next);
        } catch (error) {
          if (error.status === 409) {
            setRegistryAssignmentsError('ชื่อภายในตามทะเบียนถูกแก้จากอีกเครื่อง กรุณาโหลด Cloud ใหม่');
          }
          throw error;
        } finally {
          setRegistryAssignmentsBusy(false);
        }
      };

      const saveRegistryAssignment = async (platform, item, internalName) => {
        const evidence = registryIdentityApi.resolve(marketplaceCatalogIndex, platform, item);
        return persistRegistryAssignmentEvidence(platform, registryMatcherApi.canonicalEvidence(marketplaceCatalogIndex, platform, evidence), internalName);
      };

      const getRegistryRowEvidence = (platform, row) => {
        const productId = String(row?.productId || row?.itemId || '').trim();
        if (!productId) return { status: 'unavailable', reason: 'missing_product_id' };
        const sellerSku = String(row?.sellerSku || '').trim();
        const candidate = {
          platform,
          sellerSku: sellerSku || null,
          productId,
          productName: row?.productName || row?.title || '',
          modelId: row?.modelId || null,
          variantName: row?.variantName || null
        };
        const normalizedSku = registryMatcherApi?.normalizeSku(sellerSku) || '';
        const sellerCandidates = normalizedSku
          ? (marketplaceCatalogIndex?.[platform]?.sellerSkus?.get(normalizedSku) || [])
          : [];
        const sameRegistryRow = sellerCandidates.length === 1 &&
          sellerCandidates[0].productId === candidate.productId &&
          (sellerCandidates[0].modelId || null) === (candidate.modelId || null) &&
          (candidate.modelId
            ? true
            : (sellerCandidates[0].variantName || null) === (candidate.variantName || null));
        if (sameRegistryRow) {
          return {
            status: 'found',
            identityType: 'seller_sku',
            sellerSku,
            candidate,
            captureDate: marketplaceCatalogIndex?.[platform]?.captureDate || null
          };
        }
        return {
          status: 'found',
          identityType: 'catalog_row',
          sellerSku: null,
          candidate,
          captureDate: marketplaceCatalogIndex?.[platform]?.captureDate || null
        };
      };

      const hasDuplicateRegistrySku = (platform, row) => {
        const sku = registryMatcherApi?.normalizeSku(row?.sellerSku || '');
        return Boolean(sku && (marketplaceCatalogIndex?.[platform]?.sellerSkus?.get(sku) || []).length > 1);
      };

      const saveRegistryRowAssignment = async (platform, row, internalName) =>
