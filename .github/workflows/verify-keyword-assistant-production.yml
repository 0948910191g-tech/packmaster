name: Verify Keyword Assistant Production

on:
  push:
    branches:
      - verify-keyword-assistant-production
    paths:
      - .github/workflows/verify-keyword-assistant-production.yml

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2914aa7faf909370d80b86370beeb1ca98797063
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for live Keyword Assistant build
        run: |
          set -euo pipefail
          URL='https://0948910191g-tech.github.io/packmaster/'
          for attempt in $(seq 1 24); do
            html="$(curl -fsSL --max-time 20 "${URL}?kw-assistant=2914aa7-${attempt}" || true)"
            if grep -Fq './packmaster-keyword-assistant.js' <<< "$html" \
              && grep -Fq 'data-pm-keyword-suggestion' <<< "$html" \
              && grep -Fq 'Keyword แนะนำ' <<< "$html"; then
              echo 'Live Keyword Assistant assets are ready'
              exit 0
            fi
            sleep 10
          done
          echo 'Live Keyword Assistant build did not appear in time' >&2
          exit 1
      - name: Verify live frozen Batch adapter
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://0948910191g-tech.github.io/packmaster/packmaster-batch.js?kw=2914aa7' -o /tmp/live-packmaster-batch.js
          test "$(git hash-object /tmp/live-packmaster-batch.js)" = '941bddd557803aa27e58bd23372b9f51d6ca1605'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise live Keyword Assistant
        run: |
          cat > verify-keyword-production.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          const url = 'https://0948910191g-tech.github.io/packmaster/?kw-production=2914aa7';
          await page.goto(url, { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.evaluate(async () => {
            localStorage.removeItem('skuMappingRules');
            const api = window.PackMasterBatch;
            if (api) for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
          });
          await page.reload({ waitUntil: 'networkidle' });

          await page.getByRole('button', { name: 'เริ่มงานแพ็กใหม่', exact: true }).click();
          const longSource = '(1 แถม 1) ทิชชู่เปียกเครื่องสำอาง EXCARE MAKEUP REMOVER ช่วยขจัดเมคอัพและทำความสะอาดผิว 30 แผ่นใหญ่';
          await page.evaluate(async ({ longSource }) => {
            const api = window.PackMasterBatch;
            const batch = (await api.listBatches())[0];
            const pixel = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlF1VQAAAAASUVORK5CYII=';
            const orders = [
              { id:'live-kw1', tracking:'LIVEKW001', orderId:'SYNTH-LIVE-KW-1', platform:'SHOPEE', pdfImage:pixel, parsedItems:[{text:longSource,qty:1}], qtyWarning:false },
              { id:'live-kw2', tracking:'LIVEKW002', orderId:'SYNTH-LIVE-KW-2', platform:'SHOPEE', pdfImage:pixel, parsedItems:[{text:'HOYA V2 HAKU BLUE 1 ลัง',qty:1}], qtyWarning:true, declaredTotalQty:2 }
            ];
            await api.saveBatch(api.buildBatchMeta(batch,{total:2,ready:0,reviewSku:0,reviewQty:1,unmapped:1},{now:new Date()}),orders);
          }, { longSource });

          await page.getByRole('button', { name:'งานแพ็ก', exact:true }).click();
          await page.getByRole('button', { name:'เปิดงาน', exact:true }).first().click();
          await page.getByRole('button', { name:'รีวิว & พิมพ์', exact:true }).click();
          await page.getByRole('button', { name:'ตั้งชื่อ SKU', exact:true }).first().click();

          const modal = page.locator('[data-pm-quick-mapping]');
          await modal.waitFor({state:'visible'});
          const keyword = modal.locator('input').nth(0);
          const shortName = modal.locator('input').nth(1);
          assert(await keyword.inputValue() === longSource, 'live safe seed must remain initial Keyword');
          assert(await shortName.inputValue() === '', 'live internal name must remain manual');
          const suggestions = modal.locator('[data-pm-keyword-suggestion]');
          const count = await suggestions.count();
          assert(count >= 1 && count <= 3, `live expected 1-3 suggestions, got ${count}`);
          const labels = await suggestions.evaluateAll(nodes => nodes.map(node => node.innerText));
          assert(labels.some(text => /EXCARE MAKEUP REMOVER/i.test(text)), `live missing strong keyword suggestion: ${labels.join(' | ')}`);
          const chosen = (await suggestions.first().locator('span').first().innerText()).trim();
          await suggestions.first().click();
          assert(await keyword.inputValue() === chosen, 'live click must update Keyword only');
          assert(await shortName.inputValue() === '', 'live suggestion must not fill internal name');
          assert((await page.evaluate(() => JSON.parse(localStorage.getItem('skuMappingRules') || '[]').length)) === 0, 'live suggestion must not auto-save');

          await shortName.fill('Ex เมคอัพ1');
          await modal.getByRole('button',{name:'บันทึกและใช้',exact:true}).click();
          await modal.waitFor({state:'hidden'});
          const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('skuMappingRules') || '[]'));
          assert(saved.some(rule => rule.shortName === 'Ex เมคอัพ1'), 'live manual internal name must save through existing rule path');

          const mixed = await page.evaluate(() => window.PackMasterKeywordAssistant.generateKeywordSuggestions({
            sourceText:'ทิชชู่เปียก สูตรเย็น 30 แผ่น สำหรับเช็ดทำความสะอาด',
            batchItemTexts:['ทิชชู่เปียก สูตรเย็น 30 แผ่น สำหรับเช็ดทำความสะอาด']
          }));
          assert(mixed.length > 0 && mixed.every(row => row.confidence === 'review'), 'live mixed fallback must be review-only');
          assert(await page.getByRole('button',{name:'Save PDF',exact:true}).isDisabled(), 'live Qty exception must keep Save PDF locked');

          assert(pageErrors.length === 0, `live page errors: ${pageErrors.join(' | ')}`);
          const relevant = consoleErrors.filter(text => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(text));
          assert(relevant.length === 0, `live console errors: ${relevant.join(' | ')}`);
          await page.evaluate(async () => {
            localStorage.removeItem('skuMappingRules');
            const api = window.PackMasterBatch;
            if (api) for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
          });
          await browser.close();
          console.log('PackMaster live Keyword Assistant verification passed');
          JS
          node verify-keyword-production.mjs
      - name: Verify live source safety markers
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 'https://0948910191g-tech.github.io/packmaster/?kw-source=2914aa7')"
          grep -Fq './packmaster-keyword-assistant.js' <<< "$html"
          grep -Fq 'for (let i = 0; i < MappedOrders.length; i++)' <<< "$html"
          grep -Fq 'MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' <<< "$html"
