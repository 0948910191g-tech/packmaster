name: Verify Production Smoke Hotfix RED

on:
  push:
    branches:
      - hotfix-production-smoke-pipefail

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm regression test fails before fix
        run: |
          if node tests/packmaster-production-smoke-workflow.test.mjs; then
            echo "Expected smoke workflow regression test to fail before hotfix" >&2
            exit 1
          else
            echo "TDD RED confirmed: printf | grep -q is unsafe under pipefail"
          fi
