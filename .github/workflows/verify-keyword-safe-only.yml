name: Verify Keyword Safe Only

on:
  push:
    branches:
      - verify-keyword-safe-only

jobs:
  production-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for production deployment and verify live files
        run: |
          set -euo pipefail
          LIVE_BASE="https://0948910191g-tech.github.io/packmaster"
          MAIN_RAW="https://raw.githubusercontent.com/0948910191g-tech/packmaster/4ab111495c8bc17619b4f719c2c955db8b6d4532"
          matched=0
          for i in $(seq 1 30); do
            if curl -fsS "$LIVE_BASE/packmaster-keyword-assistant.js?verify=$i" -o /tmp/live-keyword.js \
              && curl -fsS "$MAIN_RAW/packmaster-keyword-assistant.js" -o /tmp/main-keyword.js \
              && cmp -s /tmp/live-keyword.js /tmp/main-keyword.js \
              && grep -Fq "assessKeywordSafety" /tmp/live-keyword.js \
              && curl -fsS "$LIVE_BASE/?verify=$i" -o /tmp/live-index.html \
              && grep -Fq "Keyword แนะนำที่ผ่าน Safety Check" /tmp/live-index.html; then
              matched=1
              break
            fi
            sleep 4
          done
          test "$matched" = "1"
          curl -fsS "$LIVE_BASE/packmaster-batch.js?verify=batch" | git hash-object --stdin | grep -Fx "941bddd557803aa27e58bd23372b9f51d6ca1605"
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise live matcher-backed Keyword safety
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const LIVE = 'https://0948910191g-tech.github.io/packmaster/';

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto(`${LIVE}?keyword-safe-only=${Date.now()}`, { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() =>
              window.PackMasterKeywordAssistant &&
              typeof window.PackMasterKeywordAssistant.assessKeywordSafety === 'function',
              null,
              { timeout: 30000 }
            );
            const headingPresent = await page.locator('body').evaluate(body => body.innerText.includes('PackMaster'));
            assert.equal(headingPresent, true);

            const liveHtml = await (await page.request.get(`${LIVE}?matcher-source=${Date.now()}`)).text();
            const start = liveHtml.indexOf('const normalizeMatchText');
            const end = liveHtml.indexOf('const waitForLabelRender');
            assert.ok(start >= 0 && end > start, 'live Smart Matcher helper block must be present');
            const matcherSource = liveHtml.slice(start, end);

            const result = await page.evaluate(({ matcherSource }) => {
              const matcher = new Function(`${matcherSource}; return { normalizeMatchText, matchSkuRule };`)();
              const api = window.PackMasterKeywordAssistant;
              const thaiSource = 'ยกลัง 36 ห่อ ใหม่ ทิชชู่เปียก ฮากุ เบบี้ สูตรน้ำแร่ อ่อนโยน ผิวบอบบาง 40 แผ่น QTY TOTAL 36';
              const excareSource = '1 ห่อ ทิชชู่เปียกสำหรับผู้ใหญ่ EXCARE ADULT WIPES XXL 50 แผ่นใหญ่';
              const existingExcare = [{ id: 1, keyword: 'EXCARE ADULT WIPES', shortName: 'adult-existing' }];
              const siblingCurrent = 'HOYA BABY PURPLE 5 PACK';
              const siblingOther = 'HOYA BABY PINK 5 PACK';

              const thai = api.generateKeywordSuggestions({
                sourceText: thaiSource,
                existingRules: [],
                batchItemTexts: [thaiSource],
                safeOnly: true,
                matchRule: matcher.matchSkuRule,
                matchNormalizer: matcher.normalizeMatchText
              });
              const excare = api.generateKeywordSuggestions({
                sourceText: excareSource,
                existingRules: existingExcare,
                batchItemTexts: [excareSource],
                safeOnly: true,
                matchRule: matcher.matchSkuRule,
                matchNormalizer: matcher.normalizeMatchText
              });

              return {
                thai,
                excare,
                excareHasExactDuplicate: excare.some(row => matcher.normalizeMatchText(row.value) === matcher.normalizeMatchText('EXCARE ADULT WIPES')),
                unsafeSibling: api.assessKeywordSafety({
                  candidate: 'HOYA BABY',
                  sourceText: siblingCurrent,
                  existingRules: [],
                  batchItemTexts: [siblingCurrent, siblingOther],
                  matchRule: matcher.matchSkuRule,
                  matchNormalizer: matcher.normalizeMatchText
                }),
                similarButSpecific: api.assessKeywordSafety({
                  candidate: 'HOYA BABY PURPLE',
                  sourceText: siblingCurrent,
                  existingRules: [{ id: 2, keyword: 'HOYA BABY PINK', shortName: 'pink' }],
                  batchItemTexts: [siblingCurrent, siblingOther],
                  matchRule: matcher.matchSkuRule,
                  matchNormalizer: matcher.normalizeMatchText
                })
              };
            }, { matcherSource });

            assert.ok(result.thai.length > 0, 'Thai product must retain at least one matcher-verified candidate');
            assert.ok(result.thai.every(row => row.confidence === 'recommended'));
            assert.equal(result.thai.some(row => /\bQTY\b|\bTOTAL\b|QUANTITY/i.test(row.value)), false, 'Qty Total metadata must not be suggested');
            assert.equal(result.excareHasExactDuplicate, false, 'exact existing Library keyword must not be suggested');
            assert.ok(result.excare.every(row => row.confidence === 'recommended'));
            assert.equal(result.unsafeSibling.safe, false, 'candidate that could reroute a sibling SKU must be rejected');
            assert.equal(result.similarButSpecific.safe, true, 'similar but routing-safe specific keyword must remain allowed');
            assert.deepEqual(pageErrors, []);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
