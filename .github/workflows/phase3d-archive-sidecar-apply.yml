name: Apply PackMaster Phase 3D Archive Sidecar Correction

on:
  push:
    branches:
      - phase3d-archive-sidecar-current-main
    paths:
      - .github/workflows/phase3d-archive-sidecar-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3d-archive-sidecar-current-main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore frozen Batch adapter from pre-Phase3D commit
        run: git checkout c5bb068a3c7c6a0dd66231d8cb2dd7b340de37f2 -- packmaster-batch.js

      - name: Apply guarded archive sidecar patch
        run: python3 .github/scripts/apply-phase3d-archive-sidecar-current-main.py

      - name: Archive sidecar regressions
        run: |
          node tests/packmaster-archive.test.mjs
          node tests/packmaster-phase3d-ui.test.mjs

      - name: Storage Health sidecar-aware regressions
        run: |
          node tests/packmaster-storage-health.test.mjs
          node tests/packmaster-phase3e-ui.test.mjs

      - name: Duplicate / Exception / Workspace regressions
        run: |
          node tests/packmaster-duplicate.test.mjs
          node tests/packmaster-duplicate-sidecar.test.mjs
          node tests/packmaster-phase3b-ui.test.mjs
          node tests/packmaster-exceptions.test.mjs
          node tests/packmaster-phase3c-ui.test.mjs
          node tests/packmaster-workspace.test.mjs
          node tests/packmaster-workspace-validation.test.mjs

      - name: Pilot hardening regressions
        run: |
          node tests/packmaster-diagnostics.test.mjs
          node tests/packmaster-performance.test.mjs
          node tests/packmaster-pilot-ready.test.mjs

      - name: Frozen Core regressions
        run: |
          node tests/packmaster-batch.test.mjs
          node tests/packmaster-smart-matcher.test.mjs

      - name: JSX compile
        run: |
          npm install --no-save --no-package-lock @babel/core @babel/preset-react
          node <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script type="text\/babel">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Babel app script missing');
          babel.transformSync(match[1], { presets: ['@babel/preset-react'] });
          console.log('JSX compile passed');
          NODE

      - name: Hard safety invariants
        run: |
          git diff --exit-code c5bb068a3c7c6a0dd66231d8cb2dd7b340de37f2 -- packmaster-batch.js
          grep -F "const DB_VERSION = 1;" packmaster-batch.js
          grep -F 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -F '{MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
          git diff --check

      - name: Commit corrected implementation
        run: |
          if git diff --quiet -- index.html packmaster-batch.js packmaster-storage-health.js; then
            echo "No implementation diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html packmaster-batch.js packmaster-storage-health.js
          git commit -m "fix: move Batch archive state to LocalStorage sidecar"
          git push origin HEAD:phase3d-archive-sidecar-current-main
