<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PackMaster Cloud • เข้าสู่ระบบ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5fa;color:#17243e;font:15px/1.55 system-ui,'Segoe UI',sans-serif;padding:24px}
    main{width:min(440px,100%);padding:30px;background:white;border:1px solid #dfe7f1;border-radius:22px;box-shadow:0 18px 48px #071f3d15}
    .brand{display:inline-flex;background:#0b315f;color:white;font-weight:800;padding:6px 12px;border-radius:8px;font-size:12px}
    h1{font-size:25px;margin:18px 0 8px}.hint{color:#66748a;font-size:13px;margin:0 0 22px}
    label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;border:1px solid #b5c6da;border-radius:10px;padding:12px;font:inherit}
    input:focus-visible,button:focus-visible{outline:3px solid #7fa9e9;outline-offset:2px}
    button{margin-top:18px;background:#0b63ce;border:0;border-radius:10px;color:white;font-weight:750;font:inherit;padding:12px 16px;width:100%;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#message{min-height:24px;font-size:13px;color:#9c2d35;margin-top:14px}
    footer{color:#66748a;font-size:12px;margin-top:22px}
  </style>
  <script src="./cloud-login.js" defer></script>
</head>
<body>
  <main>
    <span class="brand">PPG • PackMaster Cloud</span>
    <h1>เข้าสู่ระบบ PackMaster</h1>
    <p class="hint">ใช้รหัสเข้าถึงที่ผู้ดูแล PPG อนุญาต ระบบจะสร้าง Session ชั่วคราว ไม่เก็บรหัสใน Browser</p>
    <form id="login">
      <label for="password">รหัสเข้าถึง Cloud Workspace</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="32">
      <button id="submit" type="submit">เข้าสู่ PackMaster</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <footer>ข้อมูลออเดอร์ใช้ฐานข้อมูลกลางเดียวกัน และจำกัดการเข้าถึงเฉพาะผู้มีสิทธิ์</footer>
  </main>
</body>
</html>
