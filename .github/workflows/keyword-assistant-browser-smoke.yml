name: Keyword Assistant Browser Smoke

on:
  push:
    branches:
      - feature-keyword-assistant
    paths:
      - .github/workflows/keyword-assistant-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-keyword-assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run local static server
        run: |
          python3 -m http.server 4173 >/tmp/packmaster-keyword-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/packmaster-keyword-http.log
          exit 1
      - name: Exercise Keyword Assistant
        run: |
          cat > keyword-assistant-browser.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });

          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            if (api) for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.removeItem('skuMappingRules');
          });
          await page.reload({ waitUntil: 'networkidle' });

          await page.getByRole('button', { name: 'เริ่มงานแพ็กใหม่', exact: true }).click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });

          const longSource = '(1 แถม 1) ทิชชู่เปียกเครื่องสำอาง EXCARE MAKEUP REMOVER ช่วยขจัดเมคอัพและทำความสะอาดผิว 30 แผ่นใหญ่';
          const siblingA = 'HOYA BABY PURPLE 5 PACK';
          const siblingB = 'HOYA BABY PINK 5 PACK';

          await page.evaluate(async ({ longSource, siblingA, siblingB }) => {
            const api = window.PackMasterBatch;
            const batch = (await api.listBatches())[0];
            const pixel = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlF1VQAAAAASUVORK5CYII=';
            const orders = [
              { id: 'kw-1', tracking: 'KWASSIST001', orderId: 'SYNTH-KW-1', platform: 'SHOPEE', pdfImage: pixel, parsedItems: [{ text: longSource, qty: 1 }], qtyWarning: false },
              { id: 'kw-2', tracking: 'KWASSIST002', orderId: 'SYNTH-KW-2', platform: 'SHOPEE', pdfImage: pixel, parsedItems: [{ text: siblingA, qty: 1 }], qtyWarning: false },
              { id: 'kw-3', tracking: 'KWASSIST003', orderId: 'SYNTH-KW-3', platform: 'SHOPEE', pdfImage: pixel, parsedItems: [{ text: siblingB, qty: 1 }], qtyWarning: false },
              { id: 'kw-4', tracking: 'KWASSIST004', orderId: 'SYNTH-KW-4', platform: 'SHOPEE', pdfImage: pixel, parsedItems: [{ text: 'HOYA V2 HAKU BLUE 1 ลัง', qty: 1 }], qtyWarning: true, declaredTotalQty: 2 }
            ];
            const meta = api.buildBatchMeta(batch, { total: 4, ready: 0, reviewSku: 0, reviewQty: 1, unmapped: 3 }, { now: new Date() });
            await api.saveBatch(meta, orders);
          }, { longSource, siblingA, siblingB });

          await page.getByRole('button', { name: 'งานแพ็ก', exact: true }).click();
          await page.getByRole('button', { name: 'เปิดงาน', exact: true }).first().click();
          await page.getByRole('button', { name: 'รีวิว & พิมพ์', exact: true }).click();
          await page.locator('[data-pm-view="review"]').waitFor({ state: 'visible' });

          const fixButtons = page.getByRole('button', { name: 'ตั้งชื่อ SKU', exact: true });
          await fixButtons.first().click();
          const modal = page.locator('[data-pm-quick-mapping]');
          await modal.waitFor({ state: 'visible' });

          const keywordInput = modal.locator('input').nth(0);
          const shortNameInput = modal.locator('input').nth(1);
          assert((await keywordInput.inputValue()) === longSource, 'safe seed should remain the original long source before selection');
          assert((await shortNameInput.inputValue()) === '', 'shortName must start blank');

          const suggestions = modal.locator('[data-pm-keyword-suggestion]');
          const count = await suggestions.count();
          assert(count >= 1 && count <= 3, `expected 1-3 suggestions, got ${count}`);
          const values = await suggestions.evaluateAll(nodes => nodes.map(node => node.innerText));
          assert(values.some(text => /EXCARE MAKEUP REMOVER/i.test(text)), `expected EXCARE MAKEUP REMOVER suggestion: ${values.join(' | ')}`);
          assert(!values.some(text => /^EXCARE\s*(แนะนำ|ตรวจเพิ่ม)?$/i.test(text.trim())), 'generic EXCARE alone must not be suggested');

          const firstValue = (await suggestions.first().locator('span').first().innerText()).trim();
          await suggestions.first().click();
          assert((await keywordInput.inputValue()) === firstValue, 'clicking suggestion should only update Keyword');
          assert((await shortNameInput.inputValue()) === '', 'clicking suggestion must not fill shortName');
          assert((await page.evaluate(() => JSON.parse(localStorage.getItem('skuMappingRules') || '[]').length)) === 0, 'clicking suggestion must not save a rule');

          await shortNameInput.fill('Ex เมคอัพ1');
          await modal.getByRole('button', { name: 'บันทึกและใช้', exact: true }).click();
          await modal.waitFor({ state: 'hidden' });
          const rules = await page.evaluate(() => JSON.parse(localStorage.getItem('skuMappingRules') || '[]'));
          assert(rules.some(rule => rule.shortName === 'Ex เมคอัพ1'), 'manual shortName should save through existing rule path');

          // Qty exception remains unresolved and must continue to block printing.
          await page.getByRole('button', { name: /พิมพ์/ }).last().click();
          const bodyText = await page.locator('body').innerText();
          assert(/ยังพิมพ์ไม่ได้|แก้ Exception ให้ครบก่อน/.test(bodyText), 'unrelated Qty exception must still block Print');

          const helperCheck = await page.evaluate(({ siblingA, siblingB }) => {
            const api = window.PackMasterKeywordAssistant;
            return api.generateKeywordSuggestions({ sourceText: siblingA, batchItemTexts: [siblingA, siblingB] });
          }, { siblingA, siblingB });
          const broad = helperCheck.find(row => row.value === 'HOYA BABY');
          assert(!broad || broad.confidence === 'review', 'sibling collision must not recommend HOYA BABY');

          assert(pageErrors.length === 0, `page errors: ${pageErrors.join(' | ')}`);
          const relevantConsole = consoleErrors.filter(text => !/favicon/i.test(text));
          assert(relevantConsole.length === 0, `console errors: ${relevantConsole.join(' | ')}`);

          await page.evaluate(async () => {
            localStorage.removeItem('skuMappingRules');
            const api = window.PackMasterBatch;
            if (api) for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
          });
          await browser.close();
          console.log('Keyword Assistant browser smoke passed');
          JS
          node keyword-assistant-browser.mjs
