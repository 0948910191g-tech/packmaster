name: Apply PackMaster Phase 1 UI V2

on:
  push:
    branches:
      - phase1-ui-ux-v2

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase1-ui-ux-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baseline regression tests
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Apply presentation-only Phase 1 UI patch
        run: python3 scripts/apply_phase1_ui_v2.py

      - name: Regression tests after UI patch
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Verify UI safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '// Phase 1 UI/UX V2 — presentation-only controls',
              'const FilteredOrders = useMemo(() => {',
              'const filteredSkuRules = useMemo(() => {',
              'for (let i = 0; i < MappedOrders.length; i++)',
              '{MappedOrders.map((order) => (\n              <div key={`render-arena-${order.id}`}',
              '{MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing safety/UI markers: {missing}')
          print('UI markers and print/export safety invariants verified.')
          PY

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit generated UI change
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "packmaster-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Phase 1 review and SKU library UX"
          git push origin HEAD:phase1-ui-ux-v2
