name: PackMaster Regression Tests

on:
  push:
    branches:
      - main
      - agent/smart-matcher
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Smart matcher regression tests
        run: node tests/packmaster-smart-matcher.test.mjs

      - name: Local batch regression tests
        run: node tests/packmaster-batch.test.mjs

      - name: Workspace backup restore regression tests
        run: node tests/packmaster-workspace.test.mjs

      - name: Workspace strict validation tests
        run: node tests/packmaster-workspace-validation.test.mjs

      - name: Duplicate detection regression tests
        run: node tests/packmaster-duplicate.test.mjs

      - name: Duplicate upload UI guard
        run: node tests/packmaster-phase3b-ui.test.mjs

      - name: Exception Inbox regression tests
        run: node tests/packmaster-exceptions.test.mjs

      - name: Exception Inbox UI guard
        run: node tests/packmaster-phase3c-ui.test.mjs

      - name: Batch archive lifecycle tests
        run: node tests/packmaster-archive.test.mjs

      - name: Batch archive UI guard
        run: node tests/packmaster-phase3d-ui.test.mjs

      - name: Storage health regression tests
        run: node tests/packmaster-storage-health.test.mjs

      - name: Diagnostics privacy tests
        run: node tests/packmaster-diagnostics.test.mjs

      - name: Synthetic high-volume performance guard
        run: node tests/packmaster-performance.test.mjs

      - name: Pilot hardening UI guard
        run: node tests/packmaster-phase3e-ui.test.mjs

      - name: Pilot readiness package guard
        run: node tests/packmaster-pilot-ready.test.mjs

      - name: Existing guardrail tests when present
        run: |
          if [ -f tests/packmaster-guardrails.test.mjs ]; then
            node tests/packmaster-guardrails.test.mjs
          else
            echo "Guardrail test file is not on this branch yet"
          fi

      - name: Check whitespace errors
        run: git diff --check
