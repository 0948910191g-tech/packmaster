name: PackMaster Frontend V3 Branch Test

on:
  push:
    branches:
      - frontend-v3-operational-ui

permissions:
  contents: read

jobs:
  frontend-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend V3 contract
        run: node tests/packmaster-frontend-v3-ui.test.mjs
