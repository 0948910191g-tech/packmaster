name: PackMaster Phase 2 TDD

on:
  push:
    branches:
      - phase2-local-batch

permissions:
  contents: read

jobs:
  batch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local batch helper tests
        run: node tests/packmaster-batch.test.mjs
