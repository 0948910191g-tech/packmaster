name: Apply Phase 3E-H Pilot Hardening

on:
  push:
    branches:
      - phase3e-pilot-hardening

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Storage health helper GREEN
        run: node tests/packmaster-storage-health.test.mjs

      - name: Diagnostics privacy GREEN
        run: node tests/packmaster-diagnostics.test.mjs

      - name: Synthetic 2,000-order performance guard
        run: node tests/packmaster-performance.test.mjs

      - name: UI RED before patch when missing
        run: |
          if grep -Fq '<script src="./packmaster-storage-health.js"></script>' index.html; then
            echo "Pilot UI patch already present"
          else
            if node tests/packmaster-phase3e-ui.test.mjs; then
              echo "Expected Phase 3E-H UI test to fail before patch" >&2
              exit 1
            else
              echo "TDD RED confirmed for pilot UI"
            fi
          fi

      - name: Apply pilot UI patch
        run: node tools/patch-phase3e-pilot.cjs

      - name: Pilot UI and package GREEN
        run: |
          node tests/packmaster-phase3e-ui.test.mjs
          node tests/packmaster-pilot-ready.test.mjs

      - name: Existing regressions
        run: |
          node tests/packmaster-smart-matcher.test.mjs
          node tests/packmaster-batch.test.mjs
          node tests/packmaster-workspace.test.mjs
          node tests/packmaster-workspace-validation.test.mjs
          node tests/packmaster-duplicate.test.mjs
          node tests/packmaster-phase3b-ui.test.mjs
          node tests/packmaster-exceptions.test.mjs
          node tests/packmaster-phase3c-ui.test.mjs
          node tests/packmaster-archive.test.mjs
          node tests/packmaster-phase3d-ui.test.mjs

      - name: Frozen Batch adapter check
        run: git diff --exit-code origin/main -- packmaster-batch.js

      - name: Print and Save PDF invariants
        run: |
          grep -F 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -F '{MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
          git diff --check

      - name: Browser runtime smoke
        run: |
          python3 -m http.server 4173 >/tmp/packmaster-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium not present on runner; static/runtime regressions already passed"
            exit 0
          fi
          timeout 45s "$chrome" --headless --disable-gpu --no-sandbox --dump-dom http://127.0.0.1:4173/ > /tmp/packmaster-dom.html
          grep -F 'PackMaster' /tmp/packmaster-dom.html
          grep -F 'PackMaster Pilot' /tmp/packmaster-dom.html
          grep -F 'งานแพ็ก' /tmp/packmaster-dom.html

      - name: Commit generated UI when changed
        run: |
          if git diff --quiet; then
            echo "No generated UI changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Phase 3E-H local pilot hardening UI"
          git push
