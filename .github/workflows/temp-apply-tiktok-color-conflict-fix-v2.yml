name: Temporary Apply TikTok Color Conflict Fix V2

on:
  push:
    branches:
      - fix/tiktok-color-conflict-fail-closed-20260815

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/tiktok-color-conflict-fail-closed-20260815
          fetch-depth: 0

      - name: Apply scoped matcher fix
        run: node scripts/apply-tiktok-color-conflict-fix-v2.mjs

      - name: Commit changed matcher
        run: |
          if git diff --quiet -- index.html; then
            echo "Matcher patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: scope TikTok seller color conflict validation"
          git push origin HEAD:fix/tiktok-color-conflict-fail-closed-20260815
