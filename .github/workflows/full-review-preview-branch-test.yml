name: PackMaster Full Review Preview Branch Test

on:
  push:
    branches:
      - frontend-v3-full-review-preview

permissions:
  contents: read

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full review preview contract
        run: node tests/packmaster-full-review-preview.test.mjs
