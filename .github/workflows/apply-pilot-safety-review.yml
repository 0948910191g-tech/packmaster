name: Apply Pilot Safety Review Fixes

on:
  push:
    branches:
      - pilot-print-safety-exception-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply safety review patch
        run: node tools/patch-pilot-safety-review.cjs
      - name: Safety and full regression checks
        run: |
          node tests/packmaster-pilot-safety.test.mjs
          node tests/packmaster-pilot-safety-ui.test.mjs
          node tests/packmaster-smart-matcher.test.mjs
          node tests/packmaster-batch.test.mjs
          node tests/packmaster-workspace.test.mjs
          node tests/packmaster-workspace-validation.test.mjs
          node tests/packmaster-duplicate.test.mjs
          node tests/packmaster-duplicate-sidecar.test.mjs
          node tests/packmaster-exceptions.test.mjs
          node tests/packmaster-phase3c-ui.test.mjs
          node tests/packmaster-archive.test.mjs
          node tests/packmaster-phase3d-ui.test.mjs
          node tests/packmaster-storage-health.test.mjs
          node tests/packmaster-diagnostics.test.mjs
          node tests/packmaster-performance.test.mjs
          node tests/packmaster-phase3e-ui.test.mjs
          node tests/packmaster-pilot-ready.test.mjs
          node tests/packmaster-production-smoke-workflow.test.mjs
          node tests/packmaster-guardrails.test.mjs
      - name: Frozen core / print invariants
        run: |
          git diff --exit-code origin/main -- packmaster-batch.js
          grep -F 'for (let i = 0; i < MappedOrders.length; i++)' index.html
          grep -F '{MappedOrders.map((order) => (<LabelCard key={`print-${order.id}`}' index.html
          git diff --check
      - name: Commit generated index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden Multi-SKU exception fix safety"
          git push
