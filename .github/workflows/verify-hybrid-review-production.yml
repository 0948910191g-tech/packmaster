name: Verify Hybrid Review Production

on:
  push:
    branches:
      - verify-hybrid-review-production

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-hybrid-review-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for live hybrid build
        run: |
          set -euo pipefail
          URL='https://0948910191g-tech.github.io/packmaster/'
          for attempt in $(seq 1 18); do
            html="$(curl -fsSL --max-time 20 "${URL}?hybrid=${GITHUB_SHA}" || true)"
            if grep -Fq 'data-pm-review-layout="hybrid-grid"' <<< "$html" \
              && grep -Fq 'pm-review-grid' <<< "$html" \
              && grep -Fq 'พรีวิวหลายใบ' <<< "$html"; then
              echo 'Live hybrid Review assets are ready'
              exit 0
            fi
            sleep 10
          done
          echo 'Live hybrid Review build did not appear in time' >&2
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise live hybrid Review workflow
        run: |
          cat > verify-hybrid-production.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1536, height: 1050 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          await page.goto('https://0948910191g-tech.github.io/packmaster/?verify-hybrid=1', { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            if (!api) throw new Error('PackMasterBatch unavailable');
            for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.setItem('skuMappingRules', JSON.stringify([{ id: 'live-hybrid-rule', keyword: 'LIVE HYBRID SKU', shortName: 'เด้งม่วง5' }]));
            const meta = api.createBatchMeta([], new Date('2026-08-08T23:35:00+07:00'));
            const img = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200"><rect width="100%" height="100%" fill="white"/><text x="50" y="100" font-size="50" fill="black">LIVE HYBRID LABEL</text></svg>');
            const orders = Array.from({ length: 9 }, (_, idx) => {
              const n = idx + 1;
              return {
                id: `live-hybrid-${n}`,
                tracking: `LIVEHYBRID-${String(n).padStart(4, '0')}`,
                parsedItems: [{ text: 'LIVE HYBRID SKU', qty: n % 3 + 1 }],
                pdfImage: img,
                platform: n % 2 ? 'SHOPEE' : 'TIKTOK',
                orderId: `LIVEORDER${String(n).padStart(4, '0')}`,
                declaredTotalQty: null,
                parserWarning: false
              };
            });
            const savedMeta = api.buildBatchMeta(meta, { total: 9, ready: 9, reviewSku: 0, reviewQty: 0, unmapped: 0 }, { now: new Date('2026-08-08T23:35:00+07:00') });
            await api.saveBatch(savedMeta, orders);
          });

          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'เปิดงาน', exact: true }).first().click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });
          await page.getByRole('button', { name: 'รีวิว & พิมพ์', exact: true }).first().click();

          const grid = page.locator('[data-pm-review-layout="hybrid-grid"]');
          await grid.waitFor({ state: 'visible' });
          const cards = page.locator('[data-pm-review-preview-item]');
          assert(await cards.count() === 9, `Expected 9 live hybrid cards, got ${await cards.count()}`);
          assert(await page.locator('[data-pm-review-card-details]').count() === 9, 'Every live hybrid card must have details');
          const columnCount = await grid.evaluate(el => getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length);
          assert(columnCount === 3, `Expected 3 live desktop columns, got ${columnCount}`);
          await cards.first().getByText('Order / Tracking', { exact: true }).waitFor();
          await cards.first().getByText('ชื่อภายใน / ผลลัพธ์ที่จะพิมพ์', { exact: true }).waitFor();
          await cards.first().getByText(/เด้งม่วง\d+/, { exact: true }).last().waitFor();
          await cards.first().getByText('พร้อมพิมพ์', { exact: true }).waitFor();

          const search = page.getByPlaceholder('ค้นหา Order / SKU / ชื่อภายใน');
          await search.fill('LIVEHYBRID-0009');
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 1);
          assert(await cards.count() === 1, 'Live search must filter hybrid cards');
          await search.fill('');
          await page.waitForFunction(() => document.querySelectorAll('[data-pm-review-preview-item]').length === 9);

          await page.getByRole('button', { name: 'มุมมองรายการ', exact: true }).click();
          await page.locator('table.pm-table').last().waitFor({ state: 'visible' });
          await page.getByRole('button', { name: 'พรีวิวหลายใบ', exact: true }).click();
          await grid.waitFor({ state: 'visible' });

          assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
          const relevantConsoleErrors = consoleErrors.filter(text => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(text));
          assert(relevantConsoleErrors.length === 0, `Console errors: ${relevantConsoleErrors.join(' | ')}`);

          await page.evaluate(async () => {
            const api = window.PackMasterBatch;
            for (const batch of await api.listBatches()) await api.deleteBatch(batch.id);
            localStorage.removeItem('skuMappingRules');
          });
          await browser.close();
          console.log('PackMaster live hybrid 3-column Review smoke passed');
          JS
          node verify-hybrid-production.mjs
