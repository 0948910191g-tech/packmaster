name: PackMaster Phase 3B Sidecar Browser Smoke

on:
  push:
    branches:
      - phase3b-sidecar-current-main
    paths:
      - .github/workflows/phase3b-sidecar-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/packmaster-http.log 2>&1 &
          echo $! >/tmp/packmaster-http.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/packmaster-http.log
          exit 1

      - name: Exercise sidecar backup restore and clear
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();
            const errors = [];

            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Workspace restore file validation failed')) return;
              errors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => Boolean(window.PackMasterBatch && window.PackMasterWorkspace && window.PackMasterDuplicate), null, { timeout: 60000 });
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor({ timeout: 60000 });

            await page.getByRole('button', { name: /สร้าง Batch/ }).first().click();
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).waitFor();
            const batchId = await page.evaluate(async () => (await window.PackMasterBatch.listBatches())[0].id);

            await page.evaluate(id => {
              window.PackMasterDuplicate.appendBatchFingerprints(id, [{
                hash: 'SANITIZED-HASH-001',
                size: 123,
                addedAt: '2026-08-08T13:30:00.000Z',
                name: 'must-not-persist.pdf'
              }]);
            }, batchId);

            const state = await page.evaluate(async id => {
              const loaded = await window.PackMasterBatch.loadBatch(id);
              return {
                sidecar: window.PackMasterDuplicate.getBatchFingerprints(id),
                meta: loaded.meta,
                raw: localStorage.getItem(window.PackMasterDuplicate.STORAGE_KEY)
              };
            }, batchId);
            assert.equal(state.sidecar.length, 1);
            assert.equal(state.sidecar[0].hash, 'SANITIZED-HASH-001');
            assert.equal('name' in state.sidecar[0], false, 'filename must not persist');
            assert.equal(Object.prototype.hasOwnProperty.call(state.meta, 'sourceFiles'), false, 'new sidecar write must not add sourceFiles to Batch metadata');
            assert.ok(state.raw.includes('SANITIZED-HASH-001'));

            // Leave active Batch through the normal path, then download a real Workspace Backup.
            await page.getByRole('button', { name: /กลับรายการ Batch/ }).click();
            await page.getByRole('button', { name: /คลังคำศัพท์/ }).click();
            await page.getByRole('heading', { name: 'คลังคำศัพท์' }).waitFor();
            const downloadPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: /สำรอง Workspace/ }).click();
            const download = await downloadPromise;
            const backupText = fs.readFileSync(await download.path(), 'utf8');
            const backup = JSON.parse(backupText);
            assert.equal(backup.settings.duplicateFingerprints[batchId][0].hash, 'SANITIZED-HASH-001');
            assert.equal('name' in backup.settings.duplicateFingerprints[batchId][0], false);

            // Mutate local sidecar, then restore downloaded workspace via UI.
            await page.evaluate(id => {
              window.PackMasterDuplicate.replaceFingerprintStore({
                [id]: [{ hash: 'MUTATED-HASH', size: 1, addedAt: '2026-08-08T13:31:00.000Z' }]
              });
            }, batchId);
            assert.equal(await page.evaluate(id => window.PackMasterDuplicate.getBatchFingerprints(id)[0].hash, batchId), 'MUTATED-HASH');

            const restoreInput = page.locator('input[type="file"][accept=".json,application/json"]');
            await restoreInput.setInputFiles({ name: 'sidecar-backup.json', mimeType: 'application/json', buffer: Buffer.from(backupText) });
            await page.getByText(/พร้อมกู้คืนจาก sidecar-backup.json/).waitFor();
            page.once('dialog', dialog => dialog.accept());
            await page.getByRole('button', { name: 'Replace Workspace' }).click();
            await page.getByRole('heading', { name: 'งานแพ็ก' }).waitFor({ timeout: 30000 });
            assert.equal(await page.evaluate(id => window.PackMasterDuplicate.getBatchFingerprints(id)[0].hash, batchId), 'SANITIZED-HASH-001');

            // Invalid optional sidecar must be rejected during preview and leave current sidecar unchanged.
            await page.getByRole('button', { name: /คลังคำศัพท์/ }).click();
            const invalid = JSON.parse(backupText);
            invalid.settings.duplicateFingerprints = { [batchId]: [{ hash: '' }] };
            await page.locator('input[type="file"][accept=".json,application/json"]').setInputFiles({
              name: 'invalid-sidecar.json', mimeType: 'application/json', buffer: Buffer.from(JSON.stringify(invalid))
            });
            await page.getByText(/ไฟล์ Backup ใช้งานไม่ได้/).waitFor();
            assert.equal(await page.evaluate(id => window.PackMasterDuplicate.getBatchFingerprints(id)[0].hash, batchId), 'SANITIZED-HASH-001');

            // Seed a sanitized Order only after Restore while the Batch is closed, so React cannot overwrite it.
            await page.getByRole('button', { name: /งานแพ็ก/ }).click();
            await page.evaluate(async id => {
              const loaded = await window.PackMasterBatch.loadBatch(id);
              await window.PackMasterBatch.saveBatch(loaded.meta, [{
                id: 'sanitized-order-clear',
                tracking: 'SANITIZED-CLEAR-TRACK',
                orderId: 'SANITIZED-CLEAR-ORDER',
                platform: 'TIKTOK',
                parsedItems: [],
                displayItems: ['SANITIZED OUTPUT'],
                originalQty: 1,
                qtyWarning: false,
                parserWarning: false,
                pdfImage: ''
              }]);
            }, batchId);

            // Explicit clear-orders action must clear duplicate history without mutating Batch schema.
            await page.getByRole('button', { name: 'เปิดงาน' }).first().click();
            await page.getByRole('button', { name: /รีวิว & พิมพ์/ }).click();
            await page.getByRole('heading', { name: 'รีวิวและพิมพ์' }).waitFor();
            page.once('dialog', dialog => dialog.accept());
            await page.getByRole('button', { name: /ล้างออเดอร์/ }).click();
            await page.waitForTimeout(700);
            assert.deepEqual(await page.evaluate(id => window.PackMasterDuplicate.getBatchFingerprints(id), batchId), []);
            const finalMeta = await page.evaluate(async id => (await window.PackMasterBatch.loadBatch(id)).meta, batchId);
            assert.equal(Object.prototype.hasOwnProperty.call(finalMeta, 'sourceFiles'), false);

            if (errors.length) throw new Error(`Unexpected browser errors:\n${errors.join('\n')}`);
            console.log('PackMaster duplicate sidecar browser smoke passed');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop local app
        if: always()
        run: |
          if [ -f /tmp/packmaster-http.pid ]; then kill $(cat /tmp/packmaster-http.pid) || true; fi
