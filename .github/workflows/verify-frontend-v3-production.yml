name: Verify Frontend V3 Production

on:
  push:
    branches:
      - verify-frontend-v3-production

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for live V3 assets
        run: |
          set -euo pipefail
          url='https://0948910191g-tech.github.io/packmaster/'
          for i in {1..30}; do
            html="$(curl -fsSL --retry 2 "$url" || true)"
            if grep -Fq 'data-pm-shell="v3"' <<< "$html" && grep -Fq 'PackMaster Frontend V3' <<< "$html"; then
              echo 'Live Frontend V3 markers found'
              exit 0
            fi
            sleep 5
          done
          echo 'Live Frontend V3 markers did not appear in time'
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Exercise live Frontend V3
        run: |
          cat > .verify-v3-production.mjs <<'JS'
          import { chromium } from 'playwright';

          const url = 'https://0948910191g-tech.github.io/packmaster/';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, acceptDownloads: true });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

          const assert = (value, message) => { if (!value) throw new Error(message); };
          const gotoView = async (label, view) => {
            await page.getByRole('button', { name: label, exact: true }).first().click();
            await page.locator(`[data-pm-view="${view}"]`).waitFor({ state: 'visible' });
          };

          await page.goto(url, { waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.locator('[data-pm-view="batches"]').waitFor({ state: 'visible' });
          console.log('STEP 1 live V3 shell/batches');

          // Isolated GitHub Actions browser profile: clear only this ephemeral test context.
          await page.evaluate(async () => {
            localStorage.clear();
            if (indexedDB.databases) {
              const dbs = await indexedDB.databases();
              await Promise.all(dbs.map(db => db.name && new Promise(resolve => {
                const req = indexedDB.deleteDatabase(db.name);
                req.onsuccess = req.onerror = req.onblocked = () => resolve();
              })));
            }
          });
          await page.reload({ waitUntil: 'networkidle' });
          await page.locator('[data-pm-view="batches"]').waitFor({ state: 'visible' });

          const create = page.locator('[data-pm-action="create-batch"]');
          await create.click();
          await page.locator('[data-pm-view="upload"]').waitFor({ state: 'visible' });
          assert(await page.locator('input[type="file"][accept=".pdf"]').count() >= 1, 'Live Upload PDF input missing');
          console.log('STEP 2 live create/upload');

          await gotoView('คลังคำศัพท์', 'sku');
          const keyword = page.getByPlaceholder('เช่น HOYA Cooling 5 ห่อ');
          await keyword.fill('PRODUCTION-SMOKE-V3');
          assert(await keyword.inputValue() === 'PRODUCTION-SMOKE-V3', 'Live SKU form not interactive');
          const skuSearch = page.getByPlaceholder('ค้นหา Keyword / ชื่อภายใน');
          await skuSearch.fill('HOYA');
          assert(await skuSearch.inputValue() === 'HOYA', 'Live SKU search not interactive');
          console.log('STEP 3 live SKU workspace');

          await gotoView('รีวิว & พิมพ์', 'review');
          const print = page.locator('[data-pm-action="print"]');
          const savePdf = page.locator('[data-pm-action="save-pdf"]');
          await print.waitFor({ state: 'visible' });
          await savePdf.waitFor({ state: 'visible' });
          assert(await print.isDisabled(), 'Live Print should be disabled for empty active Batch');
          await page.getByTitle('Grid').click();
          await page.getByTitle('Compact list').click();
          console.log('STEP 4 live Review controls/print safety');

          await gotoView('สำรองข้อมูล', 'safety');
          const backup = page.locator('[data-pm-action="workspace-backup"]');
          await backup.waitFor({ state: 'visible' });
          // IndexedDB initialization is async on first load; allow UI to settle.
          for (let i = 0; i < 20 && await backup.isDisabled(); i++) await page.waitForTimeout(250);
          assert(!(await backup.isDisabled()), 'Live Workspace Backup stayed disabled');
          const downloadPromise = page.waitForEvent('download');
          await backup.click();
          const download = await downloadPromise;
          assert(download.suggestedFilename().endsWith('.json'), 'Live Workspace Backup did not download JSON');
          await page.getByText('Diagnostics แบบไม่รวมข้อมูลลูกค้า', { exact: true }).waitFor({ state: 'visible' });
          console.log('STEP 5 live Safety/Backup/Diagnostics');

          await gotoView('งานแพ็ก', 'batches');
          assert(await page.getByRole('button', { name: 'เปิดงาน', exact: true }).count() >= 1, 'Live created Batch missing');
          const archive = page.getByRole('button', { name: 'เก็บเข้าคลัง', exact: true }).first();
          if (await archive.count()) {
            page.once('dialog', d => d.accept());
            await archive.click();
            await page.waitForTimeout(300);
            await page.getByRole('button', { name: /เก็บแล้ว/ }).click();
            const restore = page.getByRole('button', { name: 'นำกลับ', exact: true }).first();
            await restore.waitFor({ state: 'visible' });
            await restore.click();
            await page.waitForTimeout(300);
          }
          console.log('STEP 6 live Archive/Restore');

          await page.reload({ waitUntil: 'networkidle' });
          await page.locator('[data-pm-shell="v3"]').waitFor({ state: 'visible' });
          await page.locator('[data-pm-view="batches"]').waitFor({ state: 'visible' });
          assert(await page.getByRole('button', { name: 'เปิดงาน', exact: true }).count() >= 1, 'Live Batch did not persist after reload');
          console.log('STEP 7 live reload persistence');

          assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
          const relevant = consoleErrors.filter(x => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(x));
          assert(relevant.length === 0, `Console errors: ${relevant.join(' | ')}`);

          // Cleanup only this ephemeral browser context.
          await page.evaluate(async () => {
            localStorage.clear();
            if (indexedDB.databases) {
              const dbs = await indexedDB.databases();
              await Promise.all(dbs.map(db => db.name && new Promise(resolve => {
                const req = indexedDB.deleteDatabase(db.name);
                req.onsuccess = req.onerror = req.onblocked = () => resolve();
              })));
            }
          });
          await browser.close();
          console.log('PackMaster Frontend V3 LIVE production Chromium smoke passed');
          JS
          node .verify-v3-production.mjs
          rm -f .verify-v3-production.mjs
