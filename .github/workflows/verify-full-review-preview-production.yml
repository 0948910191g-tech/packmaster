name: Diagnose Legacy Production Smoke Markers

on:
  push:
    branches:
      - verify-full-review-preview-production

permissions:
  contents: read

jobs:
  markers:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://0948910191g-tech.github.io/packmaster/
    steps:
      - name: PackMaster Pilot marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq 'PackMaster Pilot'
      - name: Storage health marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq './packmaster-storage-health.js'
      - name: Diagnostics marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq './packmaster-diagnostics.js'
      - name: Pilot safety marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq './packmaster-pilot-safety.js'
      - name: Exception safety copy marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq 'แก้ Exception ให้ครบก่อนพิมพ์'
      - name: Legacy review copy marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq 'รีวิวและพิมพ์'
      - name: Stable Review V3 marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq 'data-pm-view="review"'
      - name: Full Preview marker
        run: curl -fsSL "${PROD_URL}?diag=${GITHUB_SHA}" | grep -Fq 'data-pm-review-preview="full"'
